            {chkLbl(eau, setEau, "💧 Eau")}
            {chkLbl(nourriture, setNourriture, "🌾 Nourriture")}
            {chkLbl(nettoyage, setNettoyage, "🧹 Nettoyage")}
          </div>
          <div className="grid grid-cols-2 gap-3">
            <Field label="Temp. (°C)"><input type="number" step="0.1" className={inputClass} value={temp} onChange={(e) => setTemp(e.target.value)} /></Field>
            <Field label="Humidité (%)"><input type="number" step="1" min="0" max="100" className={inputClass} value={humidite} onChange={(e) => setHumidite(e.target.value)} /></Field>
          </div>
          <div className="grid grid-cols-2 gap-3">
            <Field label="Vivants"><input type="number" min="0" className={inputClass} value={vivants} onChange={(e) => setVivants(e.target.value)} /></Field>
            <Field label="Morts"><input type="number" min="0" className={inputClass} value={morts} onChange={(e) => setMorts(e.target.value)} /></Field>
          </div>
          <Field label="Comportement"><input className={inputClass} value={comportement} onChange={(e) => setComportement(e.target.value)} placeholder="ex. actifs, regroupés…" /></Field>
          <Field label="Changement d'alimentation (si besoin)"><input className={inputClass} value={alimentation} onChange={(e) => setAlimentation(e.target.value)} placeholder="ex. démarrage → croissance" /></Field>
          <Field label="Observation"><textarea className={inputClass} rows="2" value={obs} onChange={(e) => setObs(e.target.value)} /></Field>
          <Field label="Problème éventuel"><textarea className={inputClass} rows="2" value={probleme} onChange={(e) => setProbleme(e.target.value)} placeholder="ex. boiterie, picage…" /></Field>
          <FormButtons onClose={onClose} />
        </form>
      );
    }

    // (L'ancien formulaire « détail d'une semaine » (p.semaines) a été supprimé : le suivi S1-S8
    // est quotidien depuis l'échange 31 et s'édite jour par jour ; les anciennes données
    // p.semaines restent stockées mais ne sont plus affichées.)

    // Criticité d'un jour de jeune (les 10 premiers jours sont décisifs).
    // Plus on avance, moins la couleur est « alerte » : fond + bordure gauche colorée qui s'estompe
    // (rouge → orange → ambre → lime de surveillance → neutre). Renvoie {cls, badge, label}.
    function critJour(n) {
      if (n <= 3)  return { cls: "bg-red-50 border-l-4 border-red-400",       badge: "bg-red-100 text-red-700",       label: "très critique" };
      if (n <= 7)  return { cls: "bg-orange-50 border-l-4 border-orange-400", badge: "bg-orange-100 text-orange-700", label: "critique" };
      if (n <= 10) return { cls: "bg-amber-50 border-l-4 border-amber-400",   badge: "bg-amber-100 text-amber-700",   label: "important" };
      if (n <= 21) return { cls: "bg-lime-50 border-l-4 border-lime-300",     badge: "bg-lime-100 text-lime-700",     label: "surveillance" };
      return { cls: "", badge: "", label: "" };
    }

    // Confirmation du transfert d'un lot de jeunes vers l'abattoir (avec le nombre destiné à la consommation)
    function TransfertConsoForm({ p, onClose, onConfirm }) {
      const vivants = Number(p.nombre) || 0;
      const [nombre, setNombre] = useState(String(vivants));
      return (
        <form onSubmit={(e) => { e.preventDefault(); onConfirm(Math.max(0, Number(nombre) || 0)); onClose(); }} className="space-y-3">
          <p className="text-sm text-slate-600">Lot <span className="font-medium">{p.id || "—"}</span> · {labelJeune(p.espece)} · <span className="font-medium">{vivants}</span> vivant(s).</p>
          <Field label="Nombre destiné à la consommation (abattoir)">
            <input type="number" min="0" max={vivants} className={inputClass} value={nombre} onChange={(e) => setNombre(e.target.value)} autoFocus />
          </Field>
          <p className="text-xs text-slate-400">Le lot sera marqué « transféré consommation » et ce nombre ajouté aux « Animaux consommation ». Aucun transfert automatique vers les reproducteurs (à faire manuellement).</p>
          <FormButtons onClose={onClose} />
        </form>
      );
    }

    function Poussins({ embedded, initialLotIndex, initialSub }) {
      const { poussins, config, majLigne, supprimerLigne, patchLigne, ajouterAbattoir } = useData();
      const [sub, setSub] = useState(initialSub || "lots");   // lots | sem (peut être pré-ouvert sur le suivi)
      const [open, setOpen] = useState(false);
      const [edit, setEdit] = useState(null);
      const [jourEdit, setJourEdit] = useState(null);   // { lotIndex, p, jour }
      const [semOuvertes, setSemOuvertes] = useState({ 1: true }); // semaine 1 ouverte par défaut (jours décisifs)
      const [transfConso, setTransfConso] = useState(null);        // { i, p } → modale de transfert vers l'abattoir
      const nJ = (config.jeunes && config.jeunes.suiviJours) || 10;
      const nS = (config.jeunes && config.jeunes.suiviSemaines) || 8;

      const actifsIdx = poussins.map((p, i) => ({ p, i })).filter(({ p }) => p.statut === "en croissance");
      const [selS, setSelS] = useState(initialLotIndex != null ? initialLotIndex : null);
      const idxS = selS != null ? selS : (actifsIdx[0] ? actifsIdx[0].i : null);
      const labelLot = (p, i) => (p.id || p.lot || ("Lot " + (i + 1))) + " · " + labelJeune(p.espece);

      const lignes = poussins.map((p, i) => ({ p, i })).sort((a, b) => b.p.date.localeCompare(a.p.date));
      const vivP = actifsIdx.filter(({ p }) => p.espece !== "caille").reduce((s, { p }) => s + (Number(p.nombre) || 0), 0);
      const vivC = actifsIdx.filter(({ p }) => p.espece === "caille").reduce((s, { p }) => s + (Number(p.nombre) || 0), 0);

      // Action de fin de suivi : transfert / archivage. Pour la consommation, `nombre` = quantité destinée à l'abattoir.
      function transferer(i, p, cible, nombre) {
        if (cible === "consommation") {
          const n = nombre != null ? nombre : (Number(p.nombre) || 0);
          ajouterAbattoir({ lot: p.id || "", espece: p.espece === "caille" ? "caille" : "poule", race: "", naissance: p.date, nombre: n, statut: "en croissance", abattagePrevu: "", abattageReel: "", obs: "Issu du lot de naissance " + (p.id || "") });
          patchLigne("poussins", i, { statut: "transféré consommation" });
        } else if (cible === "reproduction") {
          patchLigne("poussins", i, { statut: "transféré reproduction" });
        } else if (cible === "archive") {
          patchLigne("poussins", i, { statut: "archivé" });
        }
      }

      const tab = (id, lbl) => (
        <button onClick={() => setSub(id)} className={"px-4 py-2 rounded-lg text-sm font-medium border " + (sub === id ? "bg-emerald-600 text-white border-emerald-600" : "bg-white text-slate-600 border-slate-300 hover:bg-slate-50")}>{lbl}</button>
      );
      const chk = (checked, onChange) => <input type="checkbox" checked={!!checked} onChange={onChange} className="w-4 h-4" />;
      const majJour = (i, p, n, patch) => patchLigne("poussins", i, { jours: { ...(p.jours || {}), [n]: { ...((p.jours || {})[n] || {}), ...patch } } });

      return (
        <div>
          {embedded
            ? (sub === "lots" && <div className="flex justify-end mb-3"><AddButton onClick={() => setOpen(true)} label="Ajouter un lot" /></div>)
            : <PageHeader title="Poussins & cailleteaux" subtitle="Suivi des jeunes par lot : naissances + suivi quotidien S1 à S8 (les 10 premiers jours sont mis en évidence car décisifs). Soins quotidiens centralisés dans Gestion poulailler."
                action={sub === "lots" ? <AddButton onClick={() => setOpen(true)} label="Ajouter un lot" /> : null} />}

          {/* Sous-onglets */}
          <div className="flex gap-2 mb-5 flex-wrap">
            {tab("lots", "Lots / naissances")}
            {tab("sem", "Suivi S1–S" + nS)}
          </div>

          {/* SECTION 1 — Lots / naissances */}
          {sub === "lots" && (
            <div>
              <div className="grid grid-cols-2 md:grid-cols-3 gap-4 mb-6">
                <StatCard label="🐥 Poussins vivants" value={vivP} />
                <StatCard label="🐦 Cailleteaux vivants" value={vivC} color="indigo" />
                <StatCard label="Lots en suivi" value={actifsIdx.length} color="purple" />
              </div>
              <Table
                resume={(r, k) => { const p = lignes[k].p; const a = ageJeune(p.date); const cr = (p.croisements || []).map((c) => codeCroisement(c.nom)).join(" "); return <><span className="font-medium">{p.id || "—"}</span> — {labelJeune(p.espece)}<span className="text-slate-400"> · {a.label} · {p.nombre} viv.{cr ? " · 🧬 " + cr : ""}</span></>; }}
                columns={["Lot", "Type", "Naissance", "Âge", "Nés", "Vivants", "Morts", "Étape", "Statut", "🧬 Croisements", "Obs", "Actions"]}
                rows={lignes.map(({ p, i }) => {
                  const a = ageJeune(p.date);
                  const pret = a.jours != null && a.jours > nS * 7;
                  return [
                    <span className="font-medium">{p.id || "—"}</span>,
                    labelJeune(p.espece),
                    frDate(p.date),
                    <span className={"whitespace-nowrap" + (a.futur ? " text-red-600" : "")}>{a.label}</span>,
                    p.nes != null && p.nes !== "" ? p.nes : "—",
                    <span className="font-medium text-emerald-600">{p.nombre}</span>,
                    Number(p.morts) || 0,
                    <EtapeJeune birthDate={p.date} />,
                    <StatutAnimal statut={p.statut} />,
                    (p.croisements || []).length
                      ? <span className="flex flex-wrap gap-1">{p.croisements.map((c, k2) => <BadgeCroisement key={k2} c={c} />)}</span>
                      : <span className="text-slate-300 text-xs">—</span>,
                    <ObsCell texte={p.obs} titre="Observation" onSave={(v) => patchLigne("poussins", i, { obs: v })} />,
                    <RowActions
                      onEdit={() => setEdit({ index: i, rec: p })}
                      onDelete={() => supprimerLigne("poussins", i)}
                      extra={pret && p.statut === "en croissance" ? (
                        <>
                          <button onClick={() => transferer(i, p, "reproduction")} title="→ Reproducteurs" className="px-1.5 py-0.5 rounded hover:bg-emerald-50 text-emerald-600 text-xs">→Repro</button>
                          <button onClick={() => setTransfConso({ i, p })} title="→ Consommation" className="px-1.5 py-0.5 rounded hover:bg-orange-50 text-orange-600 text-xs">→Conso</button>
                          <button onClick={() => transferer(i, p, "archive")} title="Archiver" className="px-1.5 py-0.5 rounded hover:bg-slate-100 text-slate-500 text-xs">Arch.</button>
                        </>
                      ) : null} />,
                  ];
                })}
              />
              <p className="text-xs text-slate-400 mt-2">Étapes : J0-10 démarrage sensible · J11-S4 croissance · S5-S8 développement · après S{nS} prêt à transférer (→Repro / →Conso / Archiver).</p>
            </div>
          )}

          {/* SECTION 2 — Suivi S1 à S8 (intègre les 10 premiers jours, mis en évidence) */}
          {sub === "sem" && (
            <div>
              <Field label="Lot suivi">
                <select className={inputClass + " max-w-xs"} value={idxS != null ? idxS : ""} onChange={(e) => setSelS(e.target.value === "" ? null : Number(e.target.value))}>
                  <option value="">— choisir un lot —</option>
                  {actifsIdx.map(({ p, i }) => <option key={i} value={i}>{labelLot(p, i)}</option>)}
                </select>
              </Field>
              {idxS == null ? <p className="text-sm text-slate-400 mt-3">Aucun lot en suivi.</p> : (() => {
                const p = poussins[idxS]; if (!p) return null;
                return (
                  <div className="mt-3">
                    <p className="text-sm text-slate-600 mb-2">{p.id || ""} · {labelJeune(p.espece)} · {ageJeune(p.date).label}</p>
                    <p className="text-xs text-slate-400 mb-2">Suivi quotidien sur {nS} semaines (les 10 premiers jours, décisifs, sont colorés). Clique une semaine pour la déplier, puis un jour pour ses détails · 💧 eau · 🌾 nourriture · 🧹 nettoyage cochables · ✏️ pour le détail.</p>
                    {/* Légende de criticité des 10 premiers jours */}
                    <div className="flex flex-wrap gap-2 mb-3 text-xs">
                      <span className="px-2 py-0.5 rounded-full bg-red-100 text-red-700 font-medium">J1-J3 très critique</span>
                      <span className="px-2 py-0.5 rounded-full bg-orange-100 text-orange-700 font-medium">J4-J7 critique</span>
                      <span className="px-2 py-0.5 rounded-full bg-amber-100 text-amber-700 font-medium">J8-J10 important</span>
                      <span className="px-2 py-0.5 rounded-full bg-lime-100 text-lime-700 font-medium">S2-S3 surveillance</span>
                      <span className="px-2 py-0.5 rounded-full bg-slate-100 text-slate-500 font-medium">ensuite normal</span>
                    </div>
                    <div className="space-y-2">
                      {Array.from({ length: nS }, (_, k) => k + 1).map((sem) => {
                        const ouverte = !!semOuvertes[sem];
                        const jours = Array.from({ length: 7 }, (_, j) => (sem - 1) * 7 + j + 1);
                        const nbFait = jours.reduce((s, n) => { const d = (p.jours || {})[n] || {}; return s + ((d.eau || d.nourriture || d.nettoyage) ? 1 : 0); }, 0);
                        const mortsSem = jours.reduce((s, n) => s + (Number(((p.jours || {})[n] || {}).morts) || 0), 0);
                        const crit = critJour(jours[0]);   // criticité de la semaine = celle de son 1er jour
                        return (
                          <div key={sem} className={"rounded-xl border shadow-sm " + (crit.cls ? crit.cls + " border-slate-200" : "bg-white border-slate-100")}>
                            <button type="button" onClick={() => setSemOuvertes((o) => ({ ...o, [sem]: !o[sem] }))} className="w-full flex items-center justify-between px-4 py-3 text-left gap-2">
                              <span className="text-sm font-medium text-slate-700 min-w-0">{ouverte ? "▼" : "▶"} Semaine {sem} <span className="text-xs text-slate-400 font-normal">· {frDate(dateDecalee(p.date, (sem - 1) * 7))} → {frDate(dateDecalee(p.date, sem * 7 - 1))}</span> {crit.label && <span className={"ml-1 px-1.5 py-0.5 rounded-full text-[11px] font-medium " + crit.badge}>{crit.label}</span>}</span>
                              <span className="text-xs text-slate-400 shrink-0">{nbFait}/7 j {mortsSem > 0 ? <span className="text-red-600">· {mortsSem} mort(s)</span> : null}</span>
                            </button>
                            {ouverte && (
                              <div className="px-2 pb-3">
                                <Table
                                  rowClass={(r, k) => critJour(jours[k]).cls}
                                  resume={(r, k) => { const n = jours[k]; const c = critJour(n); return <>J {n} · {frDate(dateDecalee(p.date, n - 1))} {c.label && <span className={"ml-1 px-1.5 py-0.5 rounded-full text-[11px] font-medium " + c.badge}>{c.label}</span>}</>; }}
                                  columns={["Jour", "Date", "💧", "🌾", "🧹", "Temp.", "Vivants", "Morts", "Obs", ""]}
                                  rows={jours.map((n) => {
                                    const d = (p.jours || {})[n] || {};
                                    return [
                                      "J " + n,
                                      frDate(dateDecalee(p.date, n - 1)),
                                      chk(d.eau, (e) => majJour(idxS, p, n, { eau: e.target.checked })),
                                      chk(d.nourriture, (e) => majJour(idxS, p, n, { nourriture: e.target.checked })),
                                      chk(d.nettoyage, (e) => majJour(idxS, p, n, { nettoyage: e.target.checked })),
                                      d.temp != null && d.temp !== "" ? d.temp + "°" : "—",
                                      d.vivants != null && d.vivants !== "" ? d.vivants : "—",
                                      (Number(d.morts) || 0) > 0 ? <span className="text-red-600 font-medium">{d.morts}</span> : "—",
                                      <ObsCell texte={d.obs} titre={"J " + n} onSave={(v) => majJour(idxS, p, n, { obs: v })} />,
                                      <button onClick={() => setJourEdit({ lotIndex: idxS, p, jour: n })} className="px-1.5 py-0.5 rounded hover:bg-slate-100 text-slate-500">✏️</button>,
                                    ];
                                  })}
                                />
                              </div>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  </div>
                );
              })()}
            </div>
          )}

          {open && <Modal title="Nouveau lot de naissance" onClose={() => setOpen(false)}><PoussinForm onClose={() => setOpen(false)} /></Modal>}
          {edit && <Modal title="Modifier le lot" onClose={() => setEdit(null)}><PoussinForm initial={edit.rec} onSave={(rec) => majLigne("poussins", edit.index, rec)} onClose={() => setEdit(null)} /></Modal>}
          {transfConso && <Modal title="Transférer vers l'abattoir" onClose={() => setTransfConso(null)}><TransfertConsoForm p={transfConso.p} onClose={() => setTransfConso(null)} onConfirm={(n) => transferer(transfConso.i, transfConso.p, "consommation", n)} /></Modal>}
          {jourEdit && <Modal title="Suivi du jour" onClose={() => setJourEdit(null)}><SuiviJourForm lotIndex={jourEdit.lotIndex} p={poussins[jourEdit.lotIndex]} jour={jourEdit.jour} onClose={() => setJourEdit(null)} /></Modal>}
        </div>
      );
    }

    /* ---------- Statistiques ---------- */
    // Contenu « Statistiques détaillées » (tableau de bord + onglet Stats de « Récolte des œufs »).
    // couvaisonSeule : n'affiche que la partie couvaison (sans les dépenses par année).
    function StatsDetaillees({ couvaisonSeule }) {
      const { lots, mirages, eclosions, consommables, materiel } = useData();
      const sc = statsConsommables(consommables);
      const sm = statsMateriel(materiel);
      const parLot = lots.map((l) => ({ l, r: recapSuivi(l, mirages, eclosions) }))
        .sort((a, b) => (b.l.dateDebut || "").localeCompare(a.l.dateDebut || ""));   // le plus récent en haut
      const annees = Array.from(new Set(Object.keys(sc.depAnnee).concat(Object.keys(sm.depAnnee)))).sort().reverse();
      // Bilan de couvée agrégé par espèce (fertilité / éclosion / réussite globale).
      // Chaque taux n'utilise que les lots qui ONT la donnée (mirage fait / éclosion faite),
      // sinon un lot en cours compterait comme « 0 % d'éclosion ».
      const bilanEspece = {};
      parLot.forEach(({ l, r }) => {
        if (!r) return;
        const e = l.espece || "?";
        const b = bilanEspece[e] || (bilanEspece[e] = { oeufs: 0, fecondes: 0, nes: 0, oeufsMir: 0, oeufsEcl: 0, fecondesEcl: 0 });
        b.oeufs += r.nbOeufs || 0;
        if (r.hasMirage) { b.fecondes += r.fecondes || 0; b.oeufsMir += r.nbOeufs || 0; }
        if (r.hasEclosion) { b.nes += r.nes || 0; b.oeufsEcl += r.nbOeufs || 0; b.fecondesEcl += r.fecondes || 0; }
      });
      const pct = (a, b) => (b > 0 ? Math.round((a / b) * 100) + " %" : "—");
      const especesBilan = Object.keys(bilanEspece);
      return (
        <div>
          <h3 className="text-sm font-semibold text-slate-600 mb-2">Bilan de couvée par espèce</h3>
          {especesBilan.length === 0
            ? <p className="text-sm text-slate-400 mb-6">Aucune donnée de couvaison pour l'instant.</p>
            : <Table
                columns={["Espèce", "Œufs incubés", "Fécondés", "Nés", "Fertilité", "Éclosion", "Réussite globale"]}
                rows={especesBilan.map((e) => {
                  const b = bilanEspece[e];
                  return [
                    <span className="font-medium capitalize">{e}</span>,
                    b.oeufs || "—", b.oeufsMir ? b.fecondes : "—", b.oeufsEcl ? b.nes : "—",
                    pct(b.fecondes, b.oeufsMir), pct(b.nes, b.fecondesEcl), pct(b.nes, b.oeufsEcl),
                  ];
                })}
              />}
          <p className="text-xs text-slate-400 mt-1 mb-6">Fertilité = fécondés / incubés · Éclosion = nés / fécondés · Réussite globale = nés / incubés.</p>

          <h3 className="text-sm font-semibold text-slate-600 mb-2">Taux par lot <span className="text-slate-400 font-normal">(du plus récent au plus ancien)</span></h3>
          <Table
            columns={["Lot", "Espèce", "Mise en couveuse", "Œufs", "Fécondés", "Nés", "Fertilité", "Éclosion", "Réussite", "Statut"]}
            rows={parLot.map(({ l, r }) => [
              <span className="font-medium">{l.id}</span>,
              l.espece,
              frDate(l.dateDebut),
              r.nbOeufs || "—",
              r.fecondes != null ? r.fecondes : "—",
              r.nes != null ? r.nes : "—",
              r.tauxFec != null ? <span className="px-2 py-0.5 rounded-full text-xs font-medium bg-emerald-100 text-emerald-700">{r.tauxFec} %</span> : "—",
              r.tauxEcl != null ? <span className="px-2 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-blue-700">{r.tauxEcl} %</span> : "—",
              r.tauxGlobal != null ? <span className="px-2 py-0.5 rounded-full text-xs font-medium bg-purple-100 text-purple-700">{r.tauxGlobal} %</span> : "—",
              <StatusBadge statut={l.statut} />,
            ])}
          />
          {!couvaisonSeule && <>
          <h3 className="text-sm font-semibold text-slate-600 mb-2 mt-6">Dépenses par année</h3>
          <Table
            columns={["Année", "Consommables", "Matériel", "Total"]}
            rows={annees.map((an) => {
              const c = sc.depAnnee[an] || 0, m = sm.depAnnee[an] || 0;
              return [an, eur(c), eur(m), <span className="font-medium">{eur(c + m)}</span>];
            })}
          />
          </>}
        </div>
      );
    }

    /* ---------- Historique / archives ---------- */
    function Historique() {
      const { lots, materiel, suivis, mirages, eclosions, collectes, poulaillers, consommables, lotsStock, supprimerLigne, reproducteurs, poussins, abattoir, breederPurchases, config } = useData();
      // Lots terminés + résultats de couvée (fécondés / nés / taux) + date d'éclosion réelle
      const lotsTermines = lots.map((l, i) => ({ l, i }))
        .filter(x => x.l.statut === "terminé")
        .map(x => ({ ...x, rec: recapSuivi(x.l, mirages, eclosions), dateEcl: eclosions.filter(e => e.lot === x.l.id && e.date).map(e => e.date).sort().pop() || null }))
        .sort((a, b) => (b.l.dateDebut || "").localeCompare(a.l.dateDebut || ""));
      const materielRemplace = materiel.map((m, i) => ({ m, i })).filter(x => x.m.etat === "remplacé");

      // --- Résumé automatique de la période (sans IA : calculé depuis les données) ---
      const [jours, setJours] = useState(30);
      const [vue, setVue] = useState("lots");   // onglet interne : lots | materiel | registre
      const [anRegistre, setAnRegistre] = useState("");   // filtre d'année du registre ("" = année la plus récente, "tout")
      const depuis = new Date(AUJOURDHUI); depuis.setDate(depuis.getDate() - Number(jours));
      const dansPeriode = (d) => d && new Date(d) >= depuis && new Date(d) <= AUJOURDHUI;
      const somme = (arr, f) => arr.reduce((s, x) => s + (Number(f(x)) || 0), 0);

      const actesP = poulaillers.filter(p => dansPeriode(p.date));
      const parAction = {};
      actesP.forEach(p => { parAction[p.action] = (parAction[p.action] || 0) + 1; });
      const colP = collectes.filter(c => dansPeriode(c.date));
      const eclP = eclosions.filter(e => dansPeriode(e.date));
      const lotsP = lots.filter(l => dansPeriode(l.dateDebut));
      const nes = somme(eclP, e => e.nes), nonEclos = somme(eclP, e => e.nonEclos);
      const depConso = somme(consommables.filter(c => c.mouvement !== "sortie" && dansPeriode(c.date)),
        c => (Number(c.quantite) || 0) * (Number(c.prixUnitaire) || 0));

      const lignesResume = [];
      lignesResume.push("🥚 Œufs récoltés : " + somme(colP, c => c.recoltes) + " · consommés : " + somme(colP, c => c.consommation) + " · stockés : " + somme(colP, c => c.stockes));
      lignesResume.push("🌡️ Lots mis en couveuse : " + lotsP.length + (eclP.length ? " · éclosions : " + eclP.length + " (" + nes + " nés, " + nonEclos + " non éclos)" : " · aucune éclosion"));

      });
      const blocVide = { duree: 21, phases: [{ jusqua: 21, temp: 37.5, hum: 55 }], params: { retournementJusqua: 0, mirage1: 0, mirage2: 0, ventilation: "" } };
      const normeDe = (esp) => config.normes[esp] || blocVide;
      const setDuree = (esp, val) => setConfig((c) => ({ ...c, normes: { ...c.normes, [esp]: { ...(c.normes[esp] || blocVide), duree: Number(val) || 0 } } }));
      const setParam = (esp, champ, val) => setConfig((c) => {
        const n = c.normes[esp] || blocVide;
        return { ...c, normes: { ...c.normes, [esp]: { ...n, params: { ...(n.params || {}), [champ]: champ === "ventilation" ? val : (Number(val) || 0) } } } };
      });
      const setInterv = (zone, val) => setConfig((c) => ({ ...c, intervalleNettoyage: { ...c.intervalleNettoyage, [zone]: Number(val) || 0 } }));
      const setFreqTrait = (zone, key, val) => setConfig((c) => ({ ...c, freqTraitements: { ...c.freqTraitements, [zone]: { ...((c.freqTraitements || {})[zone] || {}), [key]: Number(val) || 0 } } }));
      // Abreuvoirs / volumes
      const setAbreuvoir = (idx, champ, val) => setConfig((c) => ({ ...c, abreuvoirs: (c.abreuvoirs || []).map((a, i) => i === idx ? { ...a, [champ]: (champ === "volume" ? (val === "" ? "" : (Number(val) || 0)) : (champ === "actif" ? val : val)) } : a) }));
      const addAbreuvoir = () => setConfig((c) => ({ ...c, abreuvoirs: (c.abreuvoirs || []).concat([{ zone: "", type: "poussins", volume: "", actif: true, traitement: false, obs: "" }]) }));
      const delAbreuvoir = (idx) => setConfig((c) => ({ ...c, abreuvoirs: (c.abreuvoirs || []).filter((_, i) => i !== idx) }));
      const setDoseRule = (champ, val) => setConfig((c) => ({ ...c, doseRule: { ...(c.doseRule || { ml: 3, parLitres: 5 }), [champ]: Number(val) || 0 } }));
      const setFreqJeune = (key, val) => setConfig((c) => ({ ...c, freqJeunes: { ...(c.freqJeunes || {}), [key]: Number(val) || 0 } }));
      const setAgeRepro = (esp, champ, val) => setConfig((c) => ({ ...c, agesRepro: { ...c.agesRepro, [esp]: { ...(c.agesRepro[esp] || {}), [champ]: Number(val) || 0 } } }));
      // Mémoire inventaire (articles) : édition / suppression d'une entrée mémorisée
      const setMemArt = (key, champ, val) => setConfig((c) => ({ ...c, memoireArticles: { ...c.memoireArticles, [key]: { ...((c.memoireArticles || {})[key] || {}), [champ]: (champ === "seuil" ? (val === "" ? "" : (Number(val) || 0)) : val) } } }));
      const delMemArt = (key) => setConfig((c) => { const m = { ...(c.memoireArticles || {}) }; delete m[key]; return { ...c, memoireArticles: m }; });
      // Normes détaillées température/humidité (par plage de jours)
      const setNormeC = (esp, idx, champ, val) => setConfig((c) => {
        const arr = (c.normesCouvaison[esp] || []).map((r, i) => {
          if (i !== idx) return r;
          const v = (champ === "phase" || champ === "obs") ? val : (champ === "actif" ? val : (val === "" ? "" : Number(val)));
          return { ...r, [champ]: v };
        });
        return { ...c, normesCouvaison: { ...c.normesCouvaison, [esp]: arr } };
      });
      const addNormeC = (esp) => setConfig((c) => {
        const arr = c.normesCouvaison[esp] || [];
        const last = arr[arr.length - 1] || { jFin: 0 };
        const j = (Number(last.jFin) || 0) + 1;
        return { ...c, normesCouvaison: { ...c.normesCouvaison, [esp]: arr.concat([{ jDebut: j, jFin: j, tempCible: 37.5, tempMin: 37.2, tempMax: 37.8, humMin: 50, humMax: 60, phase: "incubation", actif: true, obs: "" }]) } };
      });
      const delNormeC = (esp, idx) => setConfig((c) => ({ ...c, normesCouvaison: { ...c.normesCouvaison, [esp]: (c.normesCouvaison[esp] || []).filter((_, i) => i !== idx) } }));
      const restaurerNormesC = () => {
        if (!window.confirm("Restaurer les normes officielles ?\n• Poule : 21 j · 37,5°C · J1-17 → 45-55% · J18-21 → 65-75% · Mirage J7/J14 · arrêt retournement J18\n• Caille : 17 j · 37,5°C · J1-13 → 45-50% · J14-17 → 65-75% · Mirage J7/J10 · arrêt retournement J14\nTes autres réglages ne changent pas.")) return;

                const on = e.target.checked;
                if (!on) { setConfig((c) => ({ ...c, notifications: false })); return; }
                if (typeof Notification === "undefined") { alert("Ce navigateur ne permet pas les notifications."); return; }
                if (Notification.permission === "granted") setConfig((c) => ({ ...c, notifications: true }));
                else Notification.requestPermission().then((p) => {
                  if (p === "granted") setConfig((c) => ({ ...c, notifications: true }));
                  else alert("Notifications refusées par le navigateur. Autorise-les dans les réglages du navigateur / téléphone puis réessaie.");
                });
              }} />
              <span><span className="font-medium">Notification quotidienne</span> — à la première ouverture de l'app chaque jour : retards, soins et événements du jour (éclosion, début de récolte, mirage…).</span>
            </label>
            <div className="flex items-center gap-2 mt-3 flex-wrap">
              <button type="button" onClick={() => {

          </>}

          {cat === "repro" && <>
          {/* Seuils d'âge des reproducteurs */}
          <h2 className="text-lg font-semibold mb-3">Seuils d'âge reproducteurs (en mois)</h2>
          <div className="bg-white rounded-xl border border-slate-100 shadow-sm p-4 mb-8 space-y-2">
            <div className="hidden sm:grid grid-cols-4 gap-3 text-xs text-slate-400 font-medium px-1">
              <span>Type</span><span>Min (ponte/repro)</span><span>Fin âge optimal</span><span>Début déclin</span>
            </div>
            {Object.keys(config.agesRepro || {}).map((esp) => (
              <div key={esp} className="grid grid-cols-2 sm:grid-cols-4 gap-3 items-center">
                <span className="text-sm text-slate-700">{esp}</span>
                {["min", "optimal", "declin"].map((champ) => (
                  <input key={champ} type="number" step="0.5" min="0" className={numCls} value={(config.agesRepro[esp] || {})[champ] != null ? config.agesRepro[esp][champ] : ""} onChange={(e) => setAgeRepro(esp, champ, e.target.value)} />
                ))}
              </div>
            ))}
            <p className="text-xs text-slate-400">En dessous de « Min » → trop jeune ; jusqu'à « Fin âge optimal » → optimal ; jusqu'à « Début déclin » → baisse possible ; au-delà → animal âgé.</p>
          </div>

          </>}

          {cat === "soins" && <>
          {/* (L'éditeur « Rappels produits » a été retiré : les rappels réels se calculent depuis
              les fréquences de nettoyage et de traitements ci-dessus.) */}

          {/* Restes interdits */}
          <h2 className="text-lg font-semibold mb-3">Restes alimentaires interdits dans</h2>
          <div className="bg-white rounded-xl border border-slate-100 shadow-sm p-4 mb-8 flex flex-wrap gap-3">
            {config.zones.map((z) => (
              <label key={z} className="flex items-center gap-2 text-sm text-slate-700">
                <input type="checkbox" checked={(config.restesInterdits || []).includes(z)} onChange={() => toggleRestes(z)} />
                {z}
              </label>
            ))}
          </div>

          {/* Zones de jeunes (gérées dans Poussins & cailleteaux) */}
          <h2 className="text-lg font-semibold mb-3">Zones de jeunes (gérées dans « Poussins & cailleteaux »)</h2>
          <div className="bg-white rounded-xl border border-slate-100 shadow-sm p-4 mb-2 flex flex-wrap gap-3">
            {config.zones.map((z) => (
              <label key={z} className="flex items-center gap-2 text-sm text-slate-700">
                <input type="checkbox" checked={(config.zonesJeunes || []).includes(z)} onChange={() => toggleZoneJeune(z)} />
                {z}
              </label>
            ))}
          </div>
          <p className="text-xs text-slate-400 mb-8">Les zones cochées (poussins / cailleteaux) sont retirées de « Gestion poulailler » et suivies par lot dans « Poussins & cailleteaux ». L'historique reste conservé.</p>

          </>}

          <p className="text-xs text-slate-400 mt-6">Sauvegarde automatique. Exportez vos données (barre latérale) pour conserver une copie.</p>
        </div>
      );
    }

    // Contexte de navigation : permet à une page (ex. Calendrier) de demander l'ouverture d'une autre page.
    const NavContext = createContext(() => {});

    // ===== Notifications locales (PWA) =====
    // Envoie une notification système : via le service worker si présent (Android/PWA), sinon Notification directe.
    function envoyerNotification(titre, corps) {
      if (typeof Notification === "undefined" || Notification.permission !== "granted") return false;
      const opts = { body: corps, icon: "icon-192.png", badge: "icon-192.png", tag: "cheptel-jour" };
      const direct = () => { try { new Notification(titre, opts); return true; } catch (e) { return false; } };
      try {
        if (navigator.serviceWorker && navigator.serviceWorker.getRegistration) {
          navigator.serviceWorker.getRegistration()
            .then((reg) => { if (reg && reg.showNotification) reg.showNotification(titre, opts); else direct(); })
            .catch(direct);
          return true;
        }
        return direct();
      } catch (e) { return direct(); }
    }
    // À la première ouverture de la journée : notifie retards + soins + événements du jour (1 seule notification).
    function NotificationsDaemon() {
      const { lots, poulaillers, poussins, reproducteurs, abattoir, config } = useData();
      useEffect(() => {
        if (!config.notifications) return;
        if (typeof Notification === "undefined" || Notification.permission !== "granted") return;
        if (localStorage.getItem("cheptel_notif_jour") === AUJOURDHUI_ISO) return;   // déjà notifié aujourd'hui
        const lignes = [];
        nettoyagesAPrevoir(poulaillers, config).forEach((n) => { if (n.code === "retard") lignes.push("🔴 Nettoyer " + n.zone + " (retard)"); });
        rappelsIntelligents(poulaillers, config).forEach((r) => {
          if (r.action === "nettoyage") return;   // géré par la ligne ci-dessus
          if (r.code === "retard") lignes.push("🔴 " + r.label + " — " + r.zone);
          else if (r.code === "aujourdhui") lignes.push("🟠 " + r.label + " — " + r.zone);
        });
        (evenementsCalendrier({ lots, poulaillers, poussins, reproducteurs, abattoir }, config)[AUJOURDHUI_ISO] || [])
          .forEach((e) => lignes.push(e.icon + " " + e.label));
        if (!lignes.length) return;
        if (envoyerNotification("🐔 Cheptel — aujourd'hui", lignes.slice(0, 8).join("\n") + (lignes.length > 8 ? "\n…" : "")))
          localStorage.setItem("cheptel_notif_jour", AUJOURDHUI_ISO);
      }, [config.notifications]);
      return null;
    }

    // Construit tous les événements datés de l'élevage → { "YYYY-MM-DD": [ {icon,label,color,page} ] }.
    // Partagé entre la page Calendrier et l'aperçu « Cette semaine » du tableau de bord.
    function evenementsCalendrier({ lots, poulaillers, poussins, reproducteurs, abattoir }, config) {
      const events = {};
      const add = (date, ev) => { if (!date) return; (events[date] = events[date] || []).push(ev); };
      // Couvaisons : couleur par ESPÈCE (poule = ambre, caille = indigo) → repère la couveuse d'un coup d'œil.
      lots.forEach((l) => {
        if (l.statut === "terminé" || !l.dateDebut) return;
        const cE = l.espece === "caille" ? "indigo" : "amber";   // code couleur par couveuse / espèce
        add(l.dateDebut, { icon: "🥚", label: "Mise en couveuse " + l.id + " (" + l.espece + ")", color: cE, page: "lots" });
        add(dateEclosion(l.dateDebut, l.espece), { icon: "🐣", label: "Éclosion prévue " + l.id + " (" + l.espece + ")", color: cE, page: "lots" });
        const params = (normeEspece(config, l.espece).params) || {};
        if (params.mirage1) add(dateDecalee(l.dateDebut, Number(params.mirage1)), { icon: "🔦", label: "Mirage 1 — " + l.id + " (" + l.espece + ")", color: cE, page: "lots" });
        if (params.mirage2) add(dateDecalee(l.dateDebut, Number(params.mirage2)), { icon: "🔦", label: "Mirage 2 — " + l.id + " (" + l.espece + ")", color: cE, page: "lots" });
        if (l.statut === "en couveuse") {
          const duree = DUREE[l.espece] || 21;
          const cons = Number(config.conservationOeufs) || 14, delta = Number(config.deltaEclosion) || 0;
          add(dateDecalee(l.dateDebut, Math.max(0, duree - cons + delta)), { icon: "🥚", label: "Début récolte prochaine couvée — couveuse " + l.couveuse + " (" + l.espece + ")", color: cE, page: "lots" });
        }
      });
      rappelsIntelligents(poulaillers, config).forEach((r) => { if (r.prochain) add(r.prochain, { icon: "🔔", label: r.label + " — " + r.zone, color: "red", page: "poulaillers" }); });
      poulaillers.forEach((p) => { if (p.rappel && !ligneFaitAction(p, "nettoyage")) add(p.rappel, { icon: "⏰", label: "Rappel — " + p.zone, color: "red", page: "poulaillers" }); });
      // Transferts prévus des bébés à la fin du suivi (≈ 8 semaines depuis la naissance)
      const nS = (config.jeunes && config.jeunes.suiviSemaines) || 8;
      poussins.forEach((p) => {
        if (p.statut !== "en croissance" || !p.date) return;
        add(dateDecalee(p.date, nS * 7), { icon: "🍗", label: "Transfert prévu (" + nS + " sem.) — " + (p.id || labelJeune(p.espece)), color: "purple", page: "poulaillers" });
      });
      // Jalons d'âge des reproducteurs actifs : entrée en ponte/repro (min) et début de déclin
      reproducteurs.forEach((r) => {
        if (r.statut !== "actif" || !r.naissance) return;
        const seuils = (config.agesRepro || {})[r.espece];
        if (!seuils) return;
        const nom = r.nom || r.espece;
        if (seuils.min != null) add(dateDecalee(r.naissance, Math.round(seuils.min * 30.44)), { icon: "🐓", label: "Âge de ponte/repro — " + nom, color: "emerald", page: "reproducteurs" });
        if (seuils.declin != null) add(dateDecalee(r.naissance, Math.round(seuils.declin * 30.44)), { icon: "⚠️", label: "Début de déclin — " + nom, color: "orange", page: "reproducteurs" });
      });
      // Abattages prévus (animaux destinés à la consommation) — si une date d'abattage prévu est renseignée
      abattoir.forEach((a) => {
        if (!a.abattagePrevu || a.abattageReel) return;   // déjà abattu → on n'affiche plus
        add(a.abattagePrevu, { icon: "🔪", label: "Abattage prévu — " + (a.lot || a.espece || "lot") + (a.nombre ? " (" + a.nombre + ")" : ""), color: "slate", page: "abattoir" });
      });
      return events;
    }

    // Calendrier mensuel : couvaisons (mise en couveuse + éclosion prévue + mirages),
    // début de récolte des œufs pour la couvée suivante, et rappels (nettoyage / traitements / manuels).
    // Chaque événement a une `page` cible → cliquable pour s'y rendre.
    function Calendrier() {
      const allerA = useContext(NavContext);
      const { lots, poulaillers, poussins, reproducteurs, abattoir, config } = useData();
      const now = new Date();
      const [vue, setVue] = useState({ y: now.getFullYear(), m: now.getMonth() });
      const [jourSel, setJourSel] = useState(AUJOURDHUI_ISO);
      const pad = (n) => String(n).padStart(2, "0");
      const isoDate = (y, m, d) => y + "-" + pad(m + 1) + "-" + pad(d);

      const events = evenementsCalendrier({ lots, poulaillers, poussins, reproducteurs, abattoir }, config);

      const dot = { indigo: "bg-indigo-500", emerald: "bg-emerald-500", amber: "bg-amber-500", orange: "bg-orange-500", red: "bg-red-500", purple: "bg-purple-500", slate: "bg-slate-500" };
      const chip = { indigo: "bg-indigo-100 text-indigo-700", emerald: "bg-emerald-100 text-emerald-700", amber: "bg-amber-100 text-amber-700", orange: "bg-orange-100 text-orange-700", red: "bg-red-100 text-red-700", purple: "bg-purple-100 text-purple-700", slate: "bg-slate-200 text-slate-700" };

      const premierJour = new Date(vue.y, vue.m, 1);
      const offset = (premierJour.getDay() + 6) % 7;   // semaine commençant le lundi
      const nbJours = new Date(vue.y, vue.m + 1, 0).getDate();
      const cells = [];
      for (let i = 0; i < offset; i++) cells.push(null);
      for (let d = 1; d <= nbJours; d++) cells.push(d);
      const moisLabel = premierJour.toLocaleDateString("fr-FR", { month: "long", year: "numeric" });
      const prevMois = () => setVue((v) => { const d = new Date(v.y, v.m - 1, 1); return { y: d.getFullYear(), m: d.getMonth() }; });
      const nextMois = () => setVue((v) => { const d = new Date(v.y, v.m + 1, 1); return { y: d.getFullYear(), m: d.getMonth() }; });
      const auj = () => { setVue({ y: now.getFullYear(), m: now.getMonth() }); setJourSel(AUJOURDHUI_ISO); };

      const evJourSel = events[jourSel] || [];
      const moisCle = vue.y + "-" + pad(vue.m + 1);
      const datesMois = Object.keys(events).filter((d) => d.slice(0, 7) === moisCle).sort();

      return (
        <div>
          <PageHeader title="Calendrier" subtitle="Couvaisons, éclosions prévues et rappels — vue mensuelle." />
          <div className="bg-white rounded-xl shadow-sm border border-slate-100 p-4 mb-4">
            <div className="flex items-center justify-between mb-3">
              <button onClick={prevMois} className="px-3 py-1.5 rounded-lg border border-slate-300 hover:bg-slate-50" aria-label="Mois précédent">◀</button>
              <div className="text-center">
                <p className="font-semibold text-slate-800 capitalize">{moisLabel}</p>
                <button onClick={auj} className="text-xs text-emerald-600 hover:underline">Aujourd'hui</button>
              </div>
              <button onClick={nextMois} className="px-3 py-1.5 rounded-lg border border-slate-300 hover:bg-slate-50" aria-label="Mois suivant">▶</button>
            </div>
            <div className="grid grid-cols-7 gap-1 text-center text-xs text-slate-400 mb-1">
              {["L", "M", "M", "J", "V", "S", "D"].map((j, i) => <div key={i}>{j}</div>)}
            </div>
            <div className="grid grid-cols-7 gap-1">
              {cells.map((d, i) => {
                if (d == null) return <div key={i} />;
                const date = isoDate(vue.y, vue.m, d);
                const evs = events[date] || [];
                const estAuj = date === AUJOURDHUI_ISO;
                const estSel = date === jourSel;
                return (
                  <button key={i} onClick={() => setJourSel(date)}
                    className={"aspect-square rounded-lg border p-1 flex flex-col items-center justify-start " + (estSel ? "border-emerald-500 bg-emerald-50" : "border-slate-100 hover:bg-slate-50")}>
                    <span className={"text-xs leading-none " + (estAuj ? "font-bold text-emerald-600" : "text-slate-600")}>{d}</span>
                    <span className="flex flex-wrap gap-0.5 mt-1 justify-center">
                      {evs.slice(0, 4).map((e, k) => <span key={k} className={"inline-block w-1.5 h-1.5 rounded-full " + (dot[e.color] || "bg-slate-400")} />)}
                    </span>
                  </button>
                );
              })}
            </div>
          </div>

          {/* Détail du jour sélectionné */}
          <div className="bg-white rounded-xl shadow-sm border border-slate-100 p-4 mb-4">
            <p className="text-sm font-semibold text-slate-700 mb-2">{frDate(jourSel)}{jourSel === AUJOURDHUI_ISO ? " · aujourd'hui" : ""}</p>
            {evJourSel.length === 0
              ? <p className="text-sm text-slate-400">Rien de prévu ce jour.</p>
              : <ul className="space-y-1.5">{evJourSel.map((e, k) => (
                  <li key={k}>
                    <button onClick={() => e.page && allerA(e.page)} className="flex items-center gap-2 text-sm w-full text-left hover:opacity-80">
                      <span>{e.icon}</span>
                      <span className={"px-2 py-0.5 rounded-full text-xs font-medium " + (chip[e.color] || "bg-slate-100 text-slate-600")}>{e.label}</span>
                      {e.page && <span className="text-slate-300 text-xs">›</span>}
                    </button>
                  </li>
                ))}</ul>}
          </div>

          {/* Agenda du mois */}
          <div className="bg-white rounded-xl shadow-sm border border-slate-100 p-4">
            <p className="text-sm font-semibold text-slate-700 mb-2">Agenda du mois</p>
            {datesMois.length === 0
              ? <p className="text-sm text-slate-400">Aucun événement ce mois-ci.</p>
              : <ul className="space-y-2">
                  {datesMois.map((d) => (
                    <li key={d}>
                      <p className="text-xs font-medium text-slate-500">{frDate(d)}</p>
                      <ul className="ml-1 mt-0.5 space-y-1">
                        {events[d].map((e, k) => <li key={k}><button onClick={() => e.page && allerA(e.page)} className="flex items-center gap-2 text-sm text-slate-700 w-full text-left hover:text-emerald-700"><span>{e.icon}</span>{e.label}{e.page && <span className="text-slate-300 text-xs">›</span>}</button></li>)}
                      </ul>
                    </li>
                  ))}
                </ul>}
          </div>

          <div className="text-xs text-slate-400 mt-3 space-y-1">
            <p><span className="inline-block w-2 h-2 rounded-full bg-amber-500 align-middle mr-1"></span> Couvaison <span className="font-medium">poules</span> · <span className="inline-block w-2 h-2 rounded-full bg-indigo-500 align-middle mx-1"></span> Couvaison <span className="font-medium">cailles</span> — icône = type : 🥚 mise · 🐣 éclosion · 🔦 mirage · 🥚 récolte couvée suivante.</p>
            <p><span className="inline-block w-2 h-2 rounded-full bg-red-500 align-middle mr-1"></span> 🔔/⏰ rappels · <span className="inline-block w-2 h-2 rounded-full bg-purple-500 align-middle mx-1"></span> 🍗 transfert bébés · <span className="inline-block w-2 h-2 rounded-full bg-emerald-500 align-middle mx-1"></span> 🐓 âge de ponte · <span className="inline-block w-2 h-2 rounded-full bg-orange-500 align-middle mx-1"></span> ⚠️ déclin · <span className="inline-block w-2 h-2 rounded-full bg-slate-500 align-middle mx-1"></span> 🔪 abattage prévu.</p>
          </div>
        </div>
      );
    }

    /* ============================================================
       LAYOUT + NAVIGATION
       ============================================================ */
    // Ordre : quotidien en haut, élevage au milieu, inventaires, puis réglages/historique en bas.
    // Ordre demandé. Couveuses & Statistiques ne sont plus des onglets :
    // leur contenu est intégré dans le tableau de bord (sections déroulantes).
    const PAGES = [
      { id: "dashboard", label: "Tableau de bord", icon: "📊", comp: Dashboard },
      { id: "calendrier", label: "Calendrier", icon: "📅", comp: Calendrier },
      { id: "poulaillers", label: "Gestion poulailler", icon: "🏠", comp: GestionPoulaillers },
      { id: "lots",      label: "Récolte des œufs", icon: "🥚", comp: Lots },
      { id: "reproducteurs", label: "Animaux reproducteurs", icon: "🐓", comp: Reproducteurs },
      { id: "abattoir",  label: "Animaux consommation", icon: "🍗", comp: Abattoir },
      { id: "consommables", label: "Inventaire consommables", icon: "🧺", comp: InventaireConsommables },
      { id: "materiel",  label: "Inventaire matériel", icon: "🔧", comp: InventaireMateriel },
      { id: "catalogue", label: "Catalogue des races", icon: "📖", comp: Catalogue },
      { id: "reglages",  label: "Réglages / Base de données", icon: "⚙️", comp: Reglages },
      { id: "historique", label: "Historique",      icon: "🗄️", comp: Historique },
    ];

    // Indicateur de sauvegarde + bouton « Sauvegarder maintenant » (barre latérale)
    function SaveIndicator() {
      const store = useData();
      const s = useSyncState();
      const [, force] = useState(0);
      const [connecte, setConnecte] = useState(false);
      useEffect(() => { const id = setInterval(() => force((n) => n + 1), 30000); return () => clearInterval(id); }, []);  // rafraîchit « il y a X min »
      // Vraie connexion = un utilisateur cloud authentifié (la lib peut être chargée sans compte = mode local)
      useEffect(() => { const c = getSb(); if (!c) { setConnecte(false); return; } c.auth.getUser().then(({ data }) => setConnecte(!!(data && data.user))).catch(() => setConnecte(false)); }, [s.at]);
      let cls, txt, icone;
      if (!connecte || s.status === "local") { cls = "bg-slate-800 text-slate-300"; icone = "💾"; txt = "Sur cet appareil"; }
      else if (s.status === "saving" || s.status === "pending") { cls = "bg-amber-500/20 text-amber-200"; icone = "⏳"; txt = "Enregistrement…"; }
      else if (s.status === "error") { cls = "bg-red-500/20 text-red-200"; icone = "⚠️"; txt = "Hors-ligne — non sauvegardé"; }
      else { cls = "bg-emerald-500/20 text-emerald-200"; icone = "✓"; txt = "Sauvegardé " + tempsRelatif(s.at); }
      const action = () => { if (connecte) pushCloud(); else exporterDonnees(store); };
      return (
        <div className="space-y-1.5">
          <div className={"flex items-center gap-2 px-2.5 py-1.5 rounded-lg text-xs " + cls} title={s.at ? "Dernière sauvegarde : " + new Date(s.at).toLocaleString("fr-FR") : ""}>
            <span>{icone}</span><span className="truncate">{txt}</span>
          </div>
          <div className="flex gap-1.5">
            <button onClick={action} title={connecte ? "Sauvegarder maintenant (cloud)" : "Télécharger une sauvegarde (JSON)"}
              className="flex-1 flex items-center justify-center gap-1 px-2 py-1.5 rounded-lg text-xs font-medium text-white bg-emerald-600 hover:bg-emerald-700">💾 Sauvegarder</button>
            <button onClick={() => exporterDonnees(store)} title="Exporter (JSON)"
              className="px-2.5 py-1.5 rounded-lg text-sm text-slate-300 bg-slate-800 hover:bg-slate-700">⬇️</button>
            <label title="Importer (JSON)" className="px-2.5 py-1.5 rounded-lg text-sm text-slate-300 bg-slate-800 hover:bg-slate-700 cursor-pointer">⬆️
              <input type="file" accept="application/json,.json" className="hidden"
                onChange={(e) => { if (e.target.files[0]) importerDonnees(e.target.files[0]); e.target.value = ""; }} />
            </label>
          </div>
        </div>
      );
    }

    // Bouton bascule jour / nuit (préférence mémorisée dans localStorage)
    function ThemeToggle({ className }) {
      const [nuit, setNuit] = useState(() => document.documentElement.classList.contains("nuit"));
      const toggle = () => {
        const on = !nuit;
        document.documentElement.classList.toggle("nuit", on);
        try { localStorage.setItem("cheptel_theme", on ? "nuit" : "jour"); } catch (e) {}
        setNuit(on);
      };
      return (
        <button onClick={toggle} aria-label={nuit ? "Passer en mode jour" : "Passer en mode nuit"}
          title={nuit ? "Mode jour" : "Mode nuit"}
          className={className || "flex items-center justify-center w-10 h-10 rounded-lg text-xl"}>
          {nuit ? "☀️" : "🌙"}
        </button>
      );
    }

    function App() {
      const store = useData();
      const config = store.config || {};
      const titreOnglet = (p) => ((config.titresOnglets || {})[p.id] || "").trim() || p.label;
      // Onglets masqués par l'utilisatrice (Réglages) — Réglages reste toujours visible pour pouvoir les réafficher
      const masques = config.ongletsMasques || [];
      const visiblePages = PAGES.filter((p) => p.id === "reglages" || !masques.includes(p.id));
      const [page, setPage] = useState("dashboard");
      const [menuOuvert, setMenuOuvert] = useState(false);   // menu latéral mobile
      const Current = PAGES.find(p => p.id === page).comp;
      const allerA = (id) => { setPage(id); setMenuOuvert(false); };
      return (
        <div className="sm:flex min-h-screen">
          <NotificationsDaemon />
          {/* Barre du haut (mobile uniquement) : bouton menu ☰.
              padding-top = safe-area pour ne pas passer sous la barre d'état / le notch du téléphone. */}
          <div className="sm:hidden sticky top-0 z-40 flex items-center gap-2 bg-slate-900 text-white px-3 pb-3"
            style={{ paddingTop: "calc(env(safe-area-inset-top, 0px) + 0.625rem)" }}>
            <button onClick={() => setMenuOuvert(true)}
              className="flex items-center justify-center w-11 h-11 -ml-1 rounded-lg text-2xl leading-none hover:bg-slate-800 active:bg-slate-700"
              aria-label="Ouvrir le menu">☰</button>
            <span className="text-xl">🐔</span><span className="font-bold">Cheptel</span>
            <ThemeToggle className="ml-auto flex items-center justify-center w-11 h-11 rounded-lg text-xl hover:bg-slate-800 active:bg-slate-700" />
          </div>
          {/* Voile sombre derrière le menu mobile */}
          {menuOuvert && <div className="sm:hidden fixed inset-0 bg-black/40 z-40" onClick={() => setMenuOuvert(false)} />}
          <aside className={"w-60 bg-slate-900 text-slate-100 flex-shrink-0 p-4 flex flex-col h-screen fixed sm:sticky top-0 left-0 z-50 transition-transform duration-200 sm:translate-x-0 " + (menuOuvert ? "translate-x-0" : "-translate-x-full")}
            style={{ paddingTop: "calc(env(safe-area-inset-top, 0px) + 1rem)" }}>
            <div className="flex items-center justify-between mb-6 px-2">
              <div className="flex items-center gap-2">
                <span className="text-2xl">🐔</span>
                <span className="font-bold text-lg">Cheptel</span>
              </div>
              <div className="flex items-center gap-1">
                <ThemeToggle className="flex items-center justify-center w-10 h-10 rounded-lg text-xl text-slate-300 hover:text-white hover:bg-slate-800" />
                <button onClick={() => setMenuOuvert(false)} className="sm:hidden flex items-center justify-center w-10 h-10 -mr-1 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 text-2xl leading-none" aria-label="Fermer">×</button>
              </div>
            </div>
            <nav className="space-y-1 overflow-y-auto flex-1 -mr-2 pr-2">
              {visiblePages.map(p => (
                <button
                  key={p.id}
                  onClick={() => allerA(p.id)}
                  className={`w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm text-left transition
                    ${page === p.id ? "bg-emerald-600 text-white" : "hover:bg-slate-800 text-slate-300"}`}
                >
                  <span>{p.icon}</span>{titreOnglet(p)}
                </button>
              ))}
            </nav>

            {/* Sauvegarde (compacte) — les onglets gardent la priorité */}
            <div className="mt-auto pt-3 border-t border-slate-800">
              <SaveIndicator />
              <p className="text-[10px] text-slate-500 text-center mt-2" title="Version de l'app — doit changer après chaque publication GitHub">{APP_VERSION}</p>
            </div>
          </aside>
          <main className="flex-1 p-4 sm:p-8 max-w-6xl w-full min-w-0">
            <NavContext.Provider value={allerA}>
              <Current />
            </NavContext.Provider>
          </main>
        </div>
      );
    }

    /* ============================================================
       AUTHENTIFICATION + DÉMARRAGE
       ============================================================ */
    function PleinEcran({ msg }) {
      return (
        <div className="min-h-screen flex flex-col items-center justify-center text-slate-500 gap-2">
          <span className="text-3xl">🐔</span><span>{msg}</span>
        </div>
      );
    }

    function traduireErreur(m) {
      if (!m) return "Erreur de connexion.";
      if (/invalid login credentials/i.test(m)) return "Email ou mot de passe incorrect.";
      if (/email not confirmed/i.test(m)) return "Email non confirmé (coche « Auto Confirm » dans Supabase).";
      return m;
    }

    function LoginEcran({ onLogin, erreur, occupe, onLocal }) {
      const [email, setEmail] = useState("");
      const [mdp, setMdp] = useState("");
      const [voirMdp, setVoirMdp] = useState(false);
      return (
        <div className="min-h-screen flex items-center justify-center bg-slate-100 p-4">
          <form onSubmit={(e) => { e.preventDefault(); onLogin(email.trim().toLowerCase(), mdp); }}
            className="bg-white rounded-xl shadow-sm border border-slate-100 p-6 w-full max-w-sm space-y-4">
            <div className="flex items-center gap-2"><span className="text-2xl">🐔</span><span className="font-bold text-lg">Cheptel</span></div>
            <p className="text-sm text-slate-500">Connecte-toi pour accéder à tes données synchronisées.</p>
            <Field label="Email"><input type="email" inputMode="email" autoCapitalize="none" autoCorrect="off" spellCheck="false" autoComplete="email" className={inputClass} value={email} onChange={(e) => setEmail(e.target.value)} required autoFocus /></Field>
            <Field label="Mot de passe">
              <input type={voirMdp ? "text" : "password"} autoCapitalize="none" autoCorrect="off" spellCheck="false" autoComplete="current-password" className={inputClass} value={mdp} onChange={(e) => setMdp(e.target.value)} required />
              <label className="flex items-center gap-2 text-xs text-slate-500 mt-1"><input type="checkbox" checked={voirMdp} onChange={(e) => setVoirMdp(e.target.checked)} /> Afficher le mot de passe</label>
            </Field>
            {erreur && <p className="text-sm text-red-600">{erreur}</p>}
            <button type="submit" disabled={occupe}
              className="w-full px-4 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white font-medium disabled:opacity-60">
              {occupe ? "Connexion…" : "Se connecter"}
            </button>
            {onLocal && (
              <button type="button" onClick={onLocal}
                className="w-full px-4 py-2 rounded-lg border border-slate-300 text-slate-600 hover:bg-slate-50 text-sm">
                Continuer en mode local (sans cloud)
              </button>
            )}
            <p className="text-xs text-slate-400">Le mode local utilise les données de cet appareil. La synchro cloud reprendra une fois connecté.</p>
          </form>
        </div>
      );
    }

    // Carte « Cloud » affichée en haut des Réglages
    function CloudReglages() {
      const [email, setEmail] = useState(null);
      const [msg, setMsg] = useState("");
      useEffect(() => {
        const c = getSb(); if (!c) return;
        c.auth.getUser().then(({ data }) => setEmail(data && data.user ? data.user.email : null)).catch(() => {});
      }, []);
      if (!getSb()) return null;
      async function sync() { setMsg("Envoi…"); const ok = await pushCloud().catch(() => false); setMsg(ok ? "Synchronisé ✓" : "Échec (hors-ligne ?)"); }
      async function recup() { if (!window.confirm("Récupérer les données du cloud et remplacer celles de cet appareil ?")) return; await pullCloud().catch(() => {}); location.reload(); }
      async function logout() { const c = getSb(); await c.auth.signOut().catch(() => {}); location.reload(); }
      const last = localStorage.getItem("cheptel_lastSync");
      return (
        <div className="bg-white rounded-xl border border-slate-100 shadow-sm p-4 mb-8">
          <p className="text-sm font-semibold text-slate-700 mb-1">☁️ Cloud (Supabase)</p>
          {email
            ? <p className="text-xs text-slate-500 mb-3">Connecté : <span className="font-medium">{email}</span>{last ? " · dernière synchro " + frDate(last.slice(0, 10)) : ""}</p>
            : <p className="text-xs text-slate-500 mb-3">Mode local (non connecté).</p>}
          <div className="flex flex-wrap gap-2">
            <button onClick={sync} className="px-3 py-2 text-sm rounded-lg bg-emerald-600 text-white hover:bg-emerald-700">⬆️ Synchroniser</button>
            <button onClick={recup} className="px-3 py-2 text-sm rounded-lg border border-slate-300 hover:bg-slate-50">⬇️ Récupérer le cloud</button>
            {email && <button onClick={logout} className="px-3 py-2 text-sm rounded-lg border border-slate-300 hover:bg-slate-50">Se déconnecter</button>}
          </div>
          {msg && <p className="text-xs text-slate-500 mt-2">{msg}</p>}
        </div>
      );
    }

    function Root() {
      const [phase, setPhase] = useState("loading");   // loading | login | sync | app
      const [erreur, setErreur] = useState("");
      const [occupe, setOccupe] = useState(false);

      async function demarrer() {
        setPhase("sync");
        try { const trouve = await pullCloud(); if (!trouve) await pushCloud(); } catch (e) {}
        setPhase("app");
      }

      useEffect(() => {
        const c = getSb();
        if (!c) { setPhase("app"); return; }            // bibliothèque indisponible → mode local
        let abonnement;
        c.auth.getSession()
          .then(({ data }) => { if (data.session) demarrer(); else setPhase("login"); })
          .catch(() => setPhase("login"));
        const sub = c.auth.onAuthStateChange((_e, session) => { if (!session) setPhase("login"); });
        abonnement = sub && sub.data ? sub.data.subscription : null;
        return () => { if (abonnement) abonnement.unsubscribe(); };
      }, []);

      async function login(email, mdp) {
        const c = getSb(); if (!c) return;
        setOccupe(true); setErreur("");
        const { error } = await c.auth.signInWithPassword({ email, password: mdp });
        setOccupe(false);
        if (error) { setErreur(traduireErreur(error.message)); return; }
        await demarrer();
      }

      const contenu =
        phase === "loading" ? <PleinEcran msg="Chargement…" />
        : phase === "sync" ? <PleinEcran msg="Synchronisation…" />
        : phase === "login" ? <LoginEcran onLogin={login} erreur={erreur} occupe={occupe} onLocal={() => setPhase("app")} />
        : <DataProvider><App /></DataProvider>;
      return contenu;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
  </script>

  <!-- Compilation manuelle en runtime "classic" (React.createElement, sans import) -->
  <script>
    (function () {
      try {
        var src = document.getElementById("appsrc").textContent;
        var out = Babel.transform(src, { presets: [["react", { runtime: "classic" }]] }).code;
        new Function(out)();
      } catch (err) {
        var r = document.getElementById("root");
        if (r) r.innerHTML =
          '<div style="padding:24px;font-family:system-ui;color:#b91c1c">' +
          '<h2>Erreur</h2><pre style="white-space:pre-wrap">' +
          (err && err.message ? err.message : err) + '</pre></div>';
        console.error(err);
      }
    })();
  </script>
</body>
</html>
