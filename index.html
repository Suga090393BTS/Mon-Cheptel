    // (Les éclosions sont saisies et affichées dans l'onglet « Suivi journalier ».)

    /* ---------- Catalogue races ---------- */
    // ---- Race / couleur : séparation propre (la couleur n'est PAS une race) ----
    // Couleurs/variétés courantes par race (croisé depuis standards FFV, APA, British Leghorn Club,
    // Orpington Club de France, marans.eu, The Holistic Hen pour la caille japonaise).
    // « courantes » ≠ forcément standard officiel partout.
    const COULEURS_PAR_RACE = {
      "Leghorn": ["blanche", "noire", "brune (perdrix)", "bleue", "fauve (buff)", "coucou", "argentée", "dorée saumonée", "exchequer"],
      "Sussex": ["herminée (blanc/noir)", "fauve", "tricolore (saumonée)", "blanche", "noire", "coucou", "argentée herminée"],
      "Wyandotte": ["blanche", "noire", "argentée à liseré", "dorée à liseré", "bleue", "coucou", "fauve", "colombienne (herminée)", "perdrix maillée"],
      "Orpington": ["fauve", "noire", "blanche", "bleue", "herminée blanche", "chocolat", "coucou", "perdrix"],
      "Marans": ["noir cuivré", "froment", "noire", "cuivré bleu", "blanche", "coucou argenté", "bleu"],
      "Brahma": ["herminée (blanc/noir)", "perdrix maillée", "fauve herminée", "bleue", "blanche", "noire", "gris perle"],
      "Plymouth Rock": ["barrée (coucou)", "blanche", "fauve", "noire", "bleue", "perdrix", "herminée colombienne"],
      "Australorp": ["noire", "bleue", "blanche", "chocolat"],
      "Rhode Island Red": ["rouge acajou", "blanche (Rhode Island White)"],
      "Cochin": ["fauve", "noire", "blanche", "bleue", "perdrix", "coucou", "gris perle"],
      "Faverolles": ["saumonée", "blanche", "noire", "bleue", "herminée"],
      "Araucana": ["bleue", "noire", "froment", "sauvage doré", "blanche", "lavande"],
      "Ameraucana": ["bleue", "noire", "blanche", "fauve (buff)", "argentée", "froment bleu", "lavande"],
      "Poule Soie": ["blanche", "noire", "bleue", "fauve", "gris perle", "perdrix", "coucou"],
      "Pékin / Cochin naine": ["fauve", "blanche", "noire", "bleue", "coucou", "mille-fleurs", "porcelaine", "perdrix maillée"],
      "Barbu d'Anvers": ["quail (caille)", "mille-fleurs", "porcelaine", "noire", "blanche", "bleue", "lavande", "fauve"],
      "Sebright": ["argentée liserée", "dorée liserée"],
      "Andalouse": ["bleue", "noire", "blanche"],
      "Hambourg": ["argentée caillouté", "dorée caillouté", "noire", "blanche", "bleue"],
      "Padoue": ["chamois liseré blanc", "argentée liserée", "dorée liserée", "blanche", "noire à huppe blanche", "bleue"],
      "Vorwerk": ["fauve à camail noir"],
      "Caille japonaise / Coturnix japonica": ["pharaon (sauvage)", "anglaise blanche", "tuxedo", "tibétaine", "rosetta", "italienne (dorée)", "manchurian golden", "panda", "texas A&M (blanche)", "fauve roux", "argentée", "bleue (andalouse)", "albinos"],
    };
    // Mots de couleur FR détectés en fin de nom pour séparer « Race couleur » → { base, couleur }
    const MOTS_COULEUR = new Set(["blanche", "blanc", "noire", "noir", "bleue", "bleu", "doree", "dore", "argentee", "argente",
      "fauve", "herminee", "hermine", "coucou", "cailloute", "saumonee", "saumon", "froment", "lavande", "chocolat",
      "tricolore", "perdrix", "grise", "gris", "rouge", "mordore"]);
    function splitRaceCouleur(nom) {
      const s = (nom || "").trim();
      const toks = s.split(/\s+/);
      if (toks.length < 2) return { base: s, couleur: "" };
      const dernier = normLibelle(toks[toks.length - 1]);
      if (MOTS_COULEUR.has(dernier)) return { base: toks.slice(0, -1).join(" "), couleur: toks[toks.length - 1] };
      return { base: s, couleur: "" };
    }
    // Couleurs/variétés possibles d'une race : champ saisi sinon table de référence
    function couleursDeRace(r) {
      if (r.couleurs && r.couleurs.length) return r.couleurs;
      const base = splitRaceCouleur(r.race).base;
      return COULEURS_PAR_RACE[base] || COULEURS_PAR_RACE[r.race] || [];
    }

    function RaceForm({ onClose, initial, onSave }) {
      const { ajouterRace } = useData();
      const [espece, setEspece] = useState(initial ? (initial.espece === "caille" ? "caille" : "poule") : "poule");
      const [race, setRace] = useState(initial ? initial.race : "");
      const [categorie, setCategorie] = useState(initial ? initial.categorie : "ponte");
      const [ponteAn, setPonteAn] = useState(initial && initial.ponte_moyenne_an !== "" && initial.ponte_moyenne_an != null ? String(initial.ponte_moyenne_an) : "");
      const [poidsF, setPoidsF] = useState(initial && initial.poids_femelle_kg !== "" && initial.poids_femelle_kg != null ? String(initial.poids_femelle_kg) : "");
      const [poidsM, setPoidsM] = useState(initial && initial.poids_male_kg !== "" && initial.poids_male_kg != null ? String(initial.poids_male_kg) : "");
      const [mere, setMere] = useState(initial ? (initial.qualite_mere || "moyenne") : "moyenne");
      const [chair, setChair] = useState(initial ? (initial.aptitude_chair || "moyenne") : "moyenne");
      const [signes, setSignes] = useState(initial ? (initial.signes_reconnaissance || "") : "");
      const [imageUrl, setImageUrl] = useState(initial ? (initial.image_url || "") : "");
      const [sourceImage, setSourceImage] = useState(initial ? (initial.source_image || "") : "Wikimedia Commons");
      const [notes, setNotes] = useState(initial ? (initial.notes || "") : "");
      const [couleurs, setCouleurs] = useState(initial ? (initial.couleurs || []).join(", ") : "");
      const [noteperso, setNoteperso] = useState(initial ? (initial.noteperso || "") : "");

      function submit(e) {
        e.preventDefault();
        // espèce coq = mêmes races que poule → on stocke "poule" dans le catalogue
        const especeCat = espece === "coq" ? "poule" : espece;
        const id = initial && initial.id ? initial.id : (especeCat + "_" + race + "_" + Date.now()).toLowerCase().normalize("NFD").replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, "");
        const couleursArr = couleurs.split(",").map((c) => c.trim()).filter(Boolean);
        const rec = {
          ...(initial || {}),            // préserve les champs non gérés par le formulaire
          id, espece: especeCat, race: race.trim(), categorie,
          ponte_moyenne_an: Number(ponteAn) || "", poids_femelle_kg: Number(poidsF) || "", poids_male_kg: Number(poidsM) || "",
          qualite_mere: mere, aptitude_chair: chair, signes_reconnaissance: signes.trim(),
          image_url: imageUrl.trim(), source_image: sourceImage.trim(), notes: notes.trim(),
          couleurs: couleursArr, noteperso: noteperso.trim(),
        };
        (onSave || ajouterRace)(rec);
        onClose();
      }
      const qualites = ["faible", "moyenne", "bonne", "excellente"];
      return (
        <form onSubmit={submit} className="space-y-3">
          <div className="grid grid-cols-2 gap-3">
            <Field label="Espèce">
              <select className={inputClass} value={espece} onChange={(e) => setEspece(e.target.value)}>
                <option value="poule">Poule</option>
                <option value="coq">Coq</option>
                <option value="caille">Caille</option>
              </select>
            </Field>
            <Field label="Catégorie">
              <select className={inputClass} value={categorie} onChange={(e) => setCategorie(e.target.value)}>
                <option value="ponte">Ponte</option>
                <option value="chair">Chair</option>
                <option value="mixte">Mixte</option>
                <option value="ornement">Ornement</option>
              </select>
            </Field>
          </div>
          <Field label="Race">
            <input className={inputClass} value={race} onChange={(e) => setRace(e.target.value)} placeholder="ex. Marans" required />
          </Field>
          <div className="grid grid-cols-3 gap-3">
            <Field label="Ponte / an">
              <input type="number" min="0" className={inputClass} value={ponteAn} onChange={(e) => setPonteAn(e.target.value)} placeholder="200" />
            </Field>
            <Field label="Poids ♀ (kg)">
              <input type="number" step="0.01" className={inputClass} value={poidsF} onChange={(e) => setPoidsF(e.target.value)} placeholder="3" />
            </Field>
            <Field label="Poids ♂ (kg)">
              <input type="number" step="0.01" className={inputClass} value={poidsM} onChange={(e) => setPoidsM(e.target.value)} placeholder="4" />
            </Field>
          </div>
          <div className="grid grid-cols-2 gap-3">
            <Field label="Qualité de mère / couveuse">
              <select className={inputClass} value={mere} onChange={(e) => setMere(e.target.value)}>
                {qualites.map((q) => <option key={q} value={q}>{q}</option>)}
              </select>
            </Field>
            <Field label="Aptitude chair">
              <select className={inputClass} value={chair} onChange={(e) => setChair(e.target.value)}>
                {qualites.map((q) => <option key={q} value={q}>{q}</option>)}
              </select>
            </Field>
          </div>
          <Field label="Signes de reconnaissance">
            <textarea className={inputClass} rows="2" value={signes} onChange={(e) => setSignes(e.target.value)} />
          </Field>
          <Field label="Photo (la tienne, depuis l'appareil / la galerie)">
            <PhotoPicker value={imageUrl} onChange={(v) => { setImageUrl(v); setSourceImage(v ? "Photo perso" : "Wikimedia Commons"); }} />
          </Field>
          {!/^data:image\//.test(imageUrl) && (
            <div className="grid grid-cols-2 gap-3">
              <Field label="… ou lien d'image (URL / Wikimedia, facultatif)">
                <input className={inputClass} value={imageUrl} onChange={(e) => setImageUrl(e.target.value)} placeholder="https://…" />
              </Field>
              <Field label="Source image">
                <input className={inputClass} value={sourceImage} onChange={(e) => setSourceImage(e.target.value)} />
              </Field>
            </div>
          )}
          <Field label="Couleurs / variétés possibles (séparées par des virgules)">
            <input className={inputClass} value={couleurs} onChange={(e) => setCouleurs(e.target.value)} placeholder="ex. blanche, bleue, fauve" />
          </Field>
          <Field label="Notes">
            <textarea className={inputClass} rows="2" value={notes} onChange={(e) => setNotes(e.target.value)} />
          </Field>
          <Field label="Note personnelle">
            <textarea className={inputClass} rows="2" value={noteperso} onChange={(e) => setNoteperso(e.target.value)} placeholder="ta remarque (lignée, éleveur, etc.)" />
          </Field>
          <FormButtons onClose={onClose} />
        </form>
      );
    }

    // Vignette image d'une race (image directe si dispo, sinon repli + lien source)
    function RaceImage({ race, onZoom }) {
      const [err, setErr] = useState(false);
      const src = imageAffichable(race.image_url);
      if (src && !err) {
        // object-contain : l'animal entier reste visible (pas de recadrage) ; clic = agrandir
        return (
          <button type="button" onClick={() => onZoom && onZoom(race)} title="Agrandir la photo"
            className="w-full h-44 bg-slate-50 flex items-center justify-center overflow-hidden cursor-zoom-in">
            <img src={src} alt={race.race} onError={() => setErr(true)} className="max-w-full max-h-full object-contain" />
          </button>
        );
      }
      return (
        <div className="w-full h-44 flex items-center justify-center bg-slate-100 text-5xl">
          {race.espece === "caille" ? "🐦" : "🐔"}
        </div>
      );
    }

    const CAT_COLOR = {
      ponte: "bg-blue-100 text-blue-700",
      chair: "bg-red-100 text-red-700",
      mixte: "bg-emerald-100 text-emerald-700",
      ornement: "bg-purple-100 text-purple-700",
    };

    // Fiche détaillée d'une race : infos + couleurs/variétés éditables + note perso
    function FicheRace({ race, index, onClose, onEdit }) {
      const { patchLigne } = useData();
      const [couleurs, setCouleurs] = useState(couleursDeRace(race));
      const [nouvelle, setNouvelle] = useState("");
      const [noteperso, setNoteperso] = useState(race.noteperso || "");
      const [imageUrl, setImageUrl] = useState(race.image_url || "");
      const ajouter = () => { const v = nouvelle.trim(); if (v && !couleurs.includes(v)) { setCouleurs([...couleurs, v]); setNouvelle(""); } };
      const retirer = (c) => setCouleurs(couleurs.filter((x) => x !== c));
      const enregistrer = () => {
        const patch = { couleurs, noteperso: noteperso.trim() };
        if (imageUrl !== (race.image_url || "")) { patch.image_url = imageUrl; patch.source_image = /^data:image\//.test(imageUrl) ? "Photo perso" : race.source_image; }
        patchLigne("races", index, patch);
        onClose();
      };
      const src = imageAffichable(imageUrl);
      const info = (lbl, val) => <div><span className="text-slate-400">{lbl} :</span> {val || "—"}</div>;
      return (
        <div className="space-y-4">
          {src && <img src={src} alt={race.race} className="w-full max-h-60 object-contain rounded-lg bg-slate-50" />}
          {/* Changer / ajouter sa propre photo (remplace l'image actuelle après « Enregistrer ») */}
          <PhotoPicker value={imageUrl} onChange={setImageUrl} />
          <div className="grid grid-cols-2 gap-x-4 gap-y-1 text-sm">
            {info("Espèce", race.espece === "caille" ? "Caille" : "Poule / coq")}
            {info("Type", race.categorie)}
            {info("Ponte / an", race.ponte_moyenne_an)}
            {info("Poids", "♀ " + race.poids_femelle_kg + " · ♂ " + race.poids_male_kg + " kg")}
            {info("Qualité de mère", race.qualite_mere)}
            {info("Aptitude chair", race.aptitude_chair)}
          </div>
          {race.signes_reconnaissance && <p className="text-sm text-slate-600">{race.signes_reconnaissance}</p>}
          {race.notes && <p className="text-sm text-slate-400 italic">{race.notes}</p>}
          <div>
            <p className="text-sm font-medium text-slate-700 mb-2">Couleurs / variétés possibles</p>
            <div className="flex flex-wrap gap-2 mb-2">
              {couleurs.length ? couleurs.map((c) => (
                <span key={c} className="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs bg-slate-100 text-slate-700">
                  {c}<button type="button" onClick={() => retirer(c)} className="text-slate-400 hover:text-red-500 leading-none">×</button>
                </span>
              )) : <span className="text-xs text-slate-400">Aucune renseignée.</span>}
            </div>
            <div className="flex gap-2">
              <input className={inputClass} value={nouvelle} onChange={(e) => setNouvelle(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); ajouter(); } }} placeholder="ajouter une couleur / variété…" />
              <button type="button" onClick={ajouter} className="px-3 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-sm whitespace-nowrap">+ Ajouter</button>
            </div>
          </div>
          <Field label="Note personnelle">
            <textarea className={inputClass} rows="2" value={noteperso} onChange={(e) => setNoteperso(e.target.value)} placeholder="lignée, éleveur, remarque…" />
          </Field>
          {race.source_image && <a href={race.source_image} target="_blank" rel="noreferrer" className="text-xs text-emerald-600 hover:underline block">Source photo : Wikimedia Commons ↗</a>}
          <div className="flex justify-between items-center gap-2 pt-1 flex-wrap">
            {/* Édition complète (tous les champs : liens, ponte, poids, notes…) via le formulaire de race */}
            {onEdit
              ? <button type="button" onClick={onEdit} className="px-3 py-2 rounded-lg border border-slate-300 text-slate-600 hover:bg-slate-50 text-sm whitespace-nowrap">✏️ Modifier la fiche</button>
              : <span />}
            <div className="flex gap-2">
              <button type="button" onClick={onClose} className="px-4 py-2 rounded-lg border border-slate-300 text-slate-600">Fermer</button>
              <button type="button" onClick={enregistrer} className="px-4 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white">Enregistrer</button>
            </div>
          </div>
        </div>
      );
    }

    // Page « Plumages » : les grands types de coloris/motifs, poules-coqs puis cailles
    function CataloguePlumages() {
      const bloc = (titre, note, items) => (
        <div className="mb-8">

            {items.map((p) => (

      const nbPoule = PLUMAGES_POULE_UNIS.length + PLUMAGES_POULE_ZONES.length + PLUMAGES_POULE_DESSINS.length;
      return (
        <div>
          <p className="text-sm text-slate-500 mb-4">🐔 <span className="font-medium">{nbPoule} coloris de poules/coqs</span> (standards avicoles) en 3 familles + <span className="font-medium">{PLUMAGES_CAILLE.length} variétés de cailles</span>. Camail = plumes du cou · rémiges = grandes plumes d'aile.</p>
          {bloc("🎨 Unicolores — une seule couleur", "La couleur couvre tout le corps de façon uniforme.", PLUMAGES_POULE_UNIS)}
          {bloc("🐔 Motifs à deux zones — corps + camail/queue", "Deux couleurs réparties par zones du corps (le dessin de chaque plume reste simple).", PLUMAGES_POULE_ZONES)}
          {bloc("✒️ Dessins de plume — chaque plume est dessinée", "Liserés, pointes, barres ou perles répétés sur chaque plume. Un même dessin existe souvent en doré ET argenté.", PLUMAGES_POULE_DESSINS)}
          {bloc("🐦 Cailles — variétés de plumage", "Variétés de la caille japonaise (Coturnix japonica), celle qu'on élève pour les œufs et la chair.", PLUMAGES_CAILLE)}
          <p className="text-xs text-slate-400">Référence pour identifier tes animaux — la couleur/variété exacte de chaque reproducteur se note dans sa fiche (champ « couleur »). Beaucoup de races existent dans plusieurs de ces coloris.</p>
        </div>

    // Page « Œufs » : types et couleurs de coquille, poule puis caille
    function CatalogueOeufs() {
      const bloc = (titre, note, items) => (
        <div className="mb-8">
          <h2 className="text-lg font-semibold mb-1">{titre}</h2>
          <p className="text-xs text-slate-500 mb-3">{note}</p>
          <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
            {items.map((o) => (
              <div key={o.nom} className="bg-white rounded-xl shadow-sm border border-slate-100 p-4">
                <div className="flex items-center gap-3 mb-2">
                  <span className="w-9 h-11 rounded-[50%] border border-slate-300 shadow-inner shrink-0" style={{ backgroundColor: o.c }} />
                  <h3 className="font-semibold leading-tight">{o.nom}</h3>
                </div>
                <p className="text-sm text-slate-600 mb-2">{o.desc}</p>
                <p className="text-xs text-slate-400">Ex. : {o.ex}</p>
              </div>
            ))}
          </div>
        </div>
      );
      return (
        <div>
          {bloc("🥚 Œufs de poule — couleurs de coquille", "Poids moyen 55 à 65 g. La couleur dépend de la race : une même poule pond toujours la même couleur, qui peut pâlir en fin de saison.", OEUFS_POULE)}
          {bloc("🥚 Œufs de caille — types et couleurs", "Poids moyen 10 à 12 g (Jumbo 13-16 g). Environ 5 œufs de caille = 1 œuf de poule.", OEUFS_CAILLE)}
          <p className="text-xs text-slate-400">Référence indicative : la teinte réelle varie selon l'alimentation, l'âge et la saison de ponte.</p>
        </div>
      );
    }

    /* ---------- Catalogue : simulateur de croisements ---------- */
    const QUALITES_ORD = ["faible", "moyenne", "bonne", "excellente"];
    // Estimation d'un croisement entre deux races du catalogue (indicatif) :
    // moyenne des deux parents + légère vigueur hybride sur la ponte, qualités ordinales moyennées,
    // et particularités d'œufs détectées par le nom de race (gène œuf bleu = dominant ; Marans = foncé).
    function estimeCroisement(racePere, raceMere, races) {
      const cherche = (nom) => races.find((r) => r.race === nom) || races.find((r) => splitRaceCouleur(r.race).base === nom) || null;
      const p = cherche(racePere), m = cherche(raceMere);
      const num = (v) => { const n = Number(v); return isFinite(n) && n > 0 ? n : null; };
      const moy = (a, b) => (a != null && b != null ? (a + b) / 2 : (a != null ? a : b));
      const moyQual = (a, b) => {
        const ia = QUALITES_ORD.indexOf(a), ib = QUALITES_ORD.indexOf(b);
        if (ia < 0 && ib < 0) return null;
        if (ia < 0) return b; if (ib < 0) return a;
        return QUALITES_ORD[Math.round((ia + ib) / 2)];
      };
      const pure = racePere && racePere === raceMere;
      const ponteBase = moy(num(p && p.ponte_moyenne_an), num(m && m.ponte_moyenne_an));
      const noms = (racePere + " " + raceMere).toLowerCase();
      const notes = [];
      if (!pure) {
        notes.push("Vigueur hybride : les croisés F1 sont souvent un peu plus robustes et productifs que la moyenne des parents.");
        notes.push("Attention : un F1 ne se reproduit pas « fidèlement » — ses petits (F2) seront très variables.");
      }
      if (/araucana|ameraucana|legbar/.test(noms)) notes.push("🥚 Gène « œuf bleu » (dominant) : les filles pondront des œufs bleutés ou verts (olive si croisé avec une race à œufs foncés).");
      if (/marans|welsumer|penedesenca/.test(noms)) notes.push("🥚 Parent à œufs foncés : les filles pondront des œufs plus colorés que la moyenne (mais moins foncés qu'une Marans pure).");
      return {
        p, m, pure,
        ponte: ponteBase != null ? Math.round(ponteBase * (pure ? 1 : 1.05)) : null,
        poidsF: moy(num(p && p.poids_femelle_kg), num(m && m.poids_femelle_kg)),
        poidsM: moy(num(p && p.poids_male_kg), num(m && m.poids_male_kg)),
        mere: moyQual(p && p.qualite_mere, m && m.qualite_mere),
        chair: moyQual(p && p.aptitude_chair, m && m.aptitude_chair),
        notes,
      };
    }
    // Carte de résultat d'un croisement
    function CarteCroisement({ titre, sousTitre, racePere, raceMere, races, alerteLignee }) {
      const e = estimeCroisement(racePere, raceMere, races);
      const kg = (v) => (v != null ? (Math.round(v * 100) / 100) + " kg" : "—");
      const manquantes = [!e.p && racePere, !e.m && raceMere].filter(Boolean);
      return (
        <div className="bg-white rounded-xl shadow-sm border border-slate-100 p-4">
          <div className="flex items-start justify-between gap-2 mb-1 flex-wrap">
            <h3 className="font-semibold leading-tight">{titre}</h3>
            {e.pure
              ? <span className="px-2 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-blue-700 whitespace-nowrap">race pure</span>
              : <span className="px-2 py-0.5 rounded-full text-xs font-medium bg-purple-100 text-purple-700 whitespace-nowrap">croisé F1</span>}
          </div>
          {sousTitre && <p className="text-xs text-slate-400 mb-2">{sousTitre}</p>}
          {alerteLignee && <p className="text-xs font-medium text-red-600 bg-red-50 border border-red-200 rounded-lg px-2 py-1 mb-2">{typeof alerteLignee === "string" ? alerteLignee : "⚠️ Même lignée des deux côtés — risque de consanguinité, croisement déconseillé."}</p>}
          {manquantes.length > 0
            ? <p className="text-sm text-slate-500">Race{manquantes.length > 1 ? "s" : ""} <span className="font-medium">{manquantes.join(" et ")}</span> introuvable{manquantes.length > 1 ? "s" : ""} au catalogue — ajoute-la pour obtenir une estimation.</p>
            : <>
              <div className="grid grid-cols-2 gap-x-3 gap-y-0.5 text-sm text-slate-600 mb-2">
                <span>🥚 Ponte estimée : <span className="font-medium">{e.ponte != null ? "~" + e.ponte + " /an" : "—"}</span></span>
                <span>⚖️ Adultes : ♀ {kg(e.poidsF)} · ♂ {kg(e.poidsM)}</span>
                <span>🐣 Qualité de mère : <span className="font-medium">{e.mere || "—"}</span></span>
                <span>🍗 Chair : <span className="font-medium">{e.chair || "—"}</span></span>
              </div>
              {e.pure
                ? <p className="text-xs text-slate-500">Même race des deux côtés : descendance conforme au standard de la race.</p>
                : e.notes.map((n, i) => <p key={i} className="text-xs text-slate-500 mb-0.5">• {n}</p>)}
            </>}
        </div>
      );
    }
    // Page « Croisements » : simule le croisement de MES mâles reproducteurs avec MES femelles,
    // + un essai libre entre deux races du catalogue.
    function CatalogueCroisements() {
      const { races, reproducteurs } = useData();
      const actifs = reproducteurs.map((r, i) => ({ r, i })).filter(({ r }) => r.statut === "actif");
      const grp = (esp) => ((esp || "").includes("caille") ? "caille" : "poule");
      const males = actifs.filter(({ r }) => r.espece === "coq" || r.espece === "caille mâle");
      const [pereSel, setPereSel] = useState(0);
      const pere = males[Math.min(pereSel, Math.max(0, males.length - 1))];
      const femelles = pere ? actifs.filter(({ r }) => (r.espece === "poule" || r.espece === "caille femelle") && grp(r.espece) === grp(pere.r.espece)) : [];
      // UNE carte par RACE de femelle (pas par poule) : deux poules de la même race donnent le même
      // croisement → on regroupe et on liste les poules concernées sur la carte.
      const groupesFemelles = (() => {
        const map = {};
        femelles.forEach(({ r }) => {
          const cle = normLibelle(r.race || "?");
          if (!map[cle]) map[cle] = { race: r.race || "", poules: [] };
          map[cle].poules.push(r);
        });
        return Object.values(map);
      })();
      const libellePoules = (g) => g.poules.map((r) => (r.nom || "poule") + (Number(r.nombre) > 1 ? " (×" + r.nombre + ")" : "")).join(", ");
      const nbPoules = (g) => g.poules.reduce((s, r) => s + (Number(r.nombre) || 1), 0);
      const alerteGroupe = (g) => {
        if (!pere || !pere.r.lignee) return null;
        const memes = g.poules.filter((r) => r.lignee && normLibelle(r.lignee) === normLibelle(pere.r.lignee)).map((r) => r.nom || "poule");
        return memes.length ? "⚠️ Même lignée que le père (" + memes.join(", ") + ") — risque de consanguinité avec cette/ces poule(s)." : null;
      };
      // Essai libre : deux races du catalogue (même espèce)
      const [espLibre, setEspLibre] = useState("poule");
      const basesLibres = Array.from(new Set(races.filter((r) => r.espece === espLibre).map((r) => splitRaceCouleur(r.race).base))).sort((a, b) => a.localeCompare(b));
      const [libre1, setLibre1] = useState("");
      const [libre2, setLibre2] = useState("");
      const l1 = libre1 || basesLibres[0] || "", l2 = libre2 || basesLibres[1] || basesLibres[0] || "";
      return (
        <div>
          <h2 className="text-lg font-semibold mb-1">🧬 Mes croisements possibles</h2>
          <p className="text-xs text-slate-500 mb-3">Choisis un mâle : une carte par RACE de femelle (les poules de la même race donnent le même croisement — elles sont listées ensemble sur la carte).</p>
          {males.length === 0
            ? <p className="text-sm text-slate-400 mb-6">Aucun coq / mâle actif dans Animaux reproducteurs. Ajoute ton coq (avec sa race) pour simuler ses croisements.</p>
            : <>
              <div className="max-w-xs mb-4">
                <Field label="Père (mâle reproducteur)">
                  <select className={inputClass} value={pereSel} onChange={(e) => setPereSel(Number(e.target.value))}>
                    {males.map(({ r }, k) => <option key={k} value={k}>{r.nom || "Mâle " + (k + 1)} — {r.race || "race ?"} ({r.espece})</option>)}
                  </select>
                </Field>
              </div>
              {!pere.r.race && <p className="text-sm text-amber-600 mb-4">Ce mâle n'a pas de race renseignée — complète sa fiche pour obtenir des estimations.</p>}
              {femelles.length === 0
                ? <p className="text-sm text-slate-400 mb-6">Aucune femelle reproductrice active de la même espèce.</p>
                : <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4 mb-8">
                    {groupesFemelles.map((g, k) => (
                      <CarteCroisement key={k}
                        titre={(pere.r.race || "?") + " × " + (g.race || "?")}
                        sousTitre={"♂ " + (pere.r.nom || "coq") + " × ♀ " + libellePoules(g) + (nbPoules(g) > 1 ? " — " + nbPoules(g) + " poules, même résultat" : "")}
                        racePere={pere.r.race || ""} raceMere={g.race || ""} races={races}
                        alerteLignee={alerteGroupe(g)} />
                    ))}
                  </div>}
            </>}

          <h2 className="text-lg font-semibold mb-1">🔬 Essai libre (deux races du catalogue)</h2>
          <p className="text-xs text-slate-500 mb-3">Pour tester un croisement avant d'acheter un reproducteur.</p>
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 max-w-2xl mb-4">
            <Field label="Espèce">
              <select className={inputClass} value={espLibre} onChange={(e) => { setEspLibre(e.target.value); setLibre1(""); setLibre2(""); }}>
                <option value="poule">Poule / coq</option>
                <option value="caille">Caille</option>
              </select>
            </Field>
            <Field label="Race du père">
              <select className={inputClass} value={l1} onChange={(e) => setLibre1(e.target.value)}>
                {basesLibres.map((b) => <option key={b} value={b}>{b}</option>)}
              </select>
            </Field>
            <Field label="Race de la mère">
              <select className={inputClass} value={l2} onChange={(e) => setLibre2(e.target.value)}>
                {basesLibres.map((b) => <option key={b} value={b}>{b}</option>)}
              </select>
            </Field>
          </div>
          {l1 && l2 && <div className="max-w-xl"><CarteCroisement titre={l1 + " × " + l2} racePere={l1} raceMere={l2} races={races} /></div>}
          <p className="text-xs text-slate-400 mt-6">Estimations indicatives : moyenne des deux races (+ ~5 % de vigueur hybride sur la ponte pour un croisé). La génétique réelle (couleurs, caractères dominants) peut donner des résultats différents.</p>
        </div>
      );
    }

    function Catalogue() {
      const { races, patchLigne, majLigne } = useData();
      const [open, setOpen] = useState(false);
      const [zoom, setZoom] = useState(null);   // race dont on agrandit la photo
      const [fiche, setFiche] = useState(null);  // { race, index } fiche détaillée
      const [editRace, setEditRace] = useState(null);  // { race, index } → formulaire complet (crayon ✏️ de la fiche)
      const [espece, setEspece] = useState("tous");
      const [categorie, setCategorie] = useState("tous");
      const [recherche, setRecherche] = useState("");

      const filtrees = races.map((r, i) => ({ r, i })).filter(({ r }) => {
        // poule & coq partagent les races (stockées en "poule")
        const okEspece = espece === "tous" || (espece === "caille" ? r.espece === "caille" : r.espece === "poule");
        const okCat = categorie === "tous" || r.categorie === categorie;
        const okRech = !recherche || r.race.toLowerCase().includes(recherche.toLowerCase());
        return okEspece && okCat && okRech;
      });

      // Nettoyage : sépare « Race couleur » → race de base + couleur ajoutée aux variétés
      const aNettoyer = races.filter((r) => splitRaceCouleur(r.race).couleur).length;
      function nettoyerRaces() {
        if (!window.confirm("Séparer la couleur du nom pour " + aNettoyer + " race(s) ? Ex. « Leghorn blanche » → race « Leghorn » + couleur « blanche ». Aucune suppression, données conservées.")) return;
        races.forEach((r, i) => {
          const { base, couleur } = splitRaceCouleur(r.race);
          if (!couleur) return;
          // Fusionne : variétés déjà saisies + variétés connues de la race de base + la couleur détectée
          const ref = COULEURS_PAR_RACE[base] || [];
          const merged = Array.from(new Set((r.couleurs || []).concat(ref).concat([couleur])));
          patchLigne("races", i, { race: base, couleurs: merged });
        });
      }

      const btn = (actif) => "px-3 py-1.5 rounded-lg text-sm border " + (actif ? "bg-emerald-600 text-white border-emerald-600" : "bg-white text-slate-600 border-slate-300 hover:bg-slate-50");
      const [vueCat, setVueCat] = useState("races");   // onglet interne : races | plumages | oeufs

      return (
        <div>
          <PageHeader
            title="Catalogue races"
            subtitle={`${races.length} races de référence (poules, coqs, cailles) + fiches plumages & œufs`}
            action={vueCat === "races" ? <AddButton onClick={() => setOpen(true)} label="Ajouter une race" /> : null}
          />

          {/* Onglets internes */}
          <div className="flex gap-1.5 mb-6 flex-wrap border-b border-slate-200">
            {[["races", "📖 Races"], ["plumages", "🎨 Plumages"], ["oeufs", "🥚 Types d'œufs"], ["croisements", "🧬 Croisements"]].map(([id, lbl]) => (
              <button key={id} onClick={() => setVueCat(id)}
                className={"px-3 py-2 text-sm font-medium -mb-px border-b-2 whitespace-nowrap " + (vueCat === id ? "border-emerald-600 text-emerald-700" : "border-transparent text-slate-500 hover:text-slate-700")}>{lbl}</button>
            ))}
          </div>

          {vueCat === "plumages" && <CataloguePlumages />}
          {vueCat === "oeufs" && <CatalogueOeufs />}
          {vueCat === "croisements" && <CatalogueCroisements />}

          {vueCat === "races" && <>
          {aNettoyer > 0 && (
            <div className="bg-amber-50 border border-amber-200 rounded-xl p-3 mb-4 flex items-center justify-between gap-3 flex-wrap">
              <span className="text-sm text-amber-800">{aNettoyer} race(s) mélangent le nom et la couleur (ex. « Leghorn blanche »).</span>
              <button onClick={nettoyerRaces} className="text-sm px-3 py-1.5 rounded-lg bg-amber-600 hover:bg-amber-700 text-white whitespace-nowrap">↺ Séparer race / couleur</button>
            </div>
          )}

          {/* Filtres + recherche */}
          <div className="bg-white rounded-xl shadow-sm border border-slate-100 p-4 mb-5 space-y-3">
            <input
              className={inputClass}
              value={recherche}
              onChange={(e) => setRecherche(e.target.value)}
              placeholder="🔍 Rechercher une race…"
            />
            <div className="flex flex-wrap gap-2 items-center">
              <span className="text-xs text-slate-400 mr-1">Espèce :</span>
              {[["tous", "Toutes"], ["poule", "Poule"], ["coq", "Coq"], ["caille", "Caille"]].map(([v, l]) => (
                <button key={v} onClick={() => setEspece(v)} className={btn(espece === v)}>{l}</button>
              ))}
            </div>
            <div className="flex flex-wrap gap-2 items-center">
              <span className="text-xs text-slate-400 mr-1">Catégorie :</span>
              {[["tous", "Toutes"], ["ponte", "Ponte"], ["chair", "Chair"], ["mixte", "Mixte"], ["ornement", "Ornement"]].map(([v, l]) => (
                <button key={v} onClick={() => setCategorie(v)} className={btn(categorie === v)}>{l}</button>
              ))}
            </div>
          </div>

          <p className="text-sm text-slate-400 mb-3">{filtrees.length} race(s) affichée(s)</p>

          {/* Grille de cartes */}
          <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
            {filtrees.map(({ r, i }) => {
              const couls = couleursDeRace(r);
              return (
                <div key={r.id || i} className="bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden flex flex-col">
                  <RaceImage race={r} onZoom={setZoom} />
                  <button type="button" onClick={() => setFiche({ race: r, index: i })} className="p-4 flex flex-col gap-2 flex-1 text-left hover:bg-slate-50">
                    <div className="flex items-start justify-between gap-2">
                      <h3 className="font-semibold leading-tight">{r.race}</h3>
                      <span className={`shrink-0 px-2 py-0.5 rounded-full text-xs font-medium ${CAT_COLOR[r.categorie] || "bg-slate-100 text-slate-600"}`}>{r.categorie}</span>
                    </div>
                    <p className="text-xs text-slate-500 capitalize">{r.espece === "caille" ? "Caille" : "Poule / coq"}</p>
                    <div className="text-xs text-slate-600 grid grid-cols-2 gap-x-2 gap-y-0.5">
                      <span>🥚 {r.ponte_moyenne_an || "—"} / an</span>
                      <span>⚖️ ♀ {r.poids_femelle_kg} · ♂ {r.poids_male_kg} kg</span>
                      <span>🐣 Mère : {r.qualite_mere}</span>
                      <span>🍗 Chair : {r.aptitude_chair}</span>
                    </div>
                    <p className="text-xs text-slate-500">{r.signes_reconnaissance}</p>
                    {couls.length > 0 && (
                      <p className="text-xs text-slate-600">🎨 {couls.slice(0, 4).join(" · ")}{couls.length > 4 ? " +" + (couls.length - 4) : ""}</p>
                    )}
                    <span className="text-xs text-emerald-600 mt-auto pt-1">Voir la fiche →</span>
                  </button>
                </div>
              );
            })}
          </div>

          {open && (
            <Modal title="Nouvelle race" onClose={() => setOpen(false)}>
              <RaceForm onClose={() => setOpen(false)} />
            </Modal>
          )}

          {fiche && (
            <Modal title={fiche.race.race} onClose={() => setFiche(null)}>
              <FicheRace race={fiche.race} index={fiche.index} onClose={() => setFiche(null)} onEdit={() => { setEditRace(fiche); setFiche(null); }} />
            </Modal>
          )}

          {editRace && (
            <Modal title={"Modifier — " + editRace.race.race} onClose={() => setEditRace(null)}>
              <RaceForm initial={editRace.race} onSave={(rec) => majLigne("races", editRace.index, rec)} onClose={() => setEditRace(null)} />
            </Modal>
          )}

          {/* Visionneuse photo plein écran */}
          {zoom && imageAffichable(zoom.image_url) && (
            <div className="fixed inset-0 bg-black/80 flex flex-col items-center justify-center p-4 z-50" onClick={() => setZoom(null)}>
              <img src={imageAffichable(zoom.image_url)} alt={zoom.race} className="max-w-full max-h-[80vh] object-contain rounded-lg shadow-2xl" onClick={(e) => e.stopPropagation()} />
              <div className="mt-3 text-center text-white" onClick={(e) => e.stopPropagation()}>
                <p className="font-semibold">{zoom.race}</p>
                {zoom.source_image && (
                  <a href={zoom.source_image} target="_blank" rel="noreferrer" className="text-xs text-emerald-300 hover:underline">Source : Wikimedia Commons ↗</a>
                )}
              </div>
              <button onClick={() => setZoom(null)} className="absolute top-4 right-5 text-white/80 hover:text-white text-4xl leading-none">×</button>
            </div>
          )}
          </>}
        </div>
      );
    }

    /* ---------- Animaux reproducteurs ---------- */
    function ReproducteurForm({ onClose, initial, onSave }) {
      const { races, reproducteurs, poussins, ajouterReproducteur } = useData();
      // Lignées déjà utilisées (reproducteurs + lots de jeunes) → suggestions
      const ligneesConnues = Array.from(new Set([].concat((reproducteurs || []).map(r => r.lignee), (poussins || []).map(p => p.lignee)).map(x => (x || "").trim()).filter(Boolean))).sort();
      const [nom, setNom] = useState(initial ? initial.nom : "");
      const [lignee, setLignee] = useState(initial ? (initial.lignee || "") : "");
      const [nombre, setNombre] = useState(initial && initial.nombre != null ? String(initial.nombre) : "1");
      const [espece, setEspece] = useState(initial ? initial.espece : "poule");
      const [race, setRace] = useState(initial ? (initial.race || "") : "");
      const [couleur, setCouleur] = useState(initial ? (initial.couleur || "") : "");
      const [naissance, setNaissance] = useState(initial ? (initial.naissance || "") : "");
      const [arrivee, setArrivee] = useState(initial ? (initial.arrivee || "") : "");
      const [statut, setStatut] = useState(initial ? initial.statut : "actif");
      const [dateFin, setDateFin] = useState(initial ? (initial.dateFin || "") : "");
      const [obs, setObs] = useState(initial ? (initial.obs || "") : "");
      const finNecessaire = statut === "décédé" || statut === "retiré reproduction";

      // Races proposées selon l'espèce : poule & coq → races de poules ; cailles → races de cailles
      const especeRace = espece.indexOf("caille") === 0 ? "caille" : "poule";
      const racesDispo = races.filter((r) => r.espece === especeRace);
      // Liste courte = noms de race « de base » (sans couleur), dédupliqués et triés
      const basesRace = Array.from(new Set(racesDispo.map((r) => splitRaceCouleur(r.race).base))).sort((a, b) => a.localeCompare(b));
      // Couleurs/variétés suggérées pour la race choisie
      const couleursSugg = (() => {
        const set = [];
        racesDispo.filter((r) => splitRaceCouleur(r.race).base === race).forEach((r) => couleursDeRace(r).forEach((c) => set.push(c)));
        if (!set.length && COULEURS_PAR_RACE[race]) COULEURS_PAR_RACE[race].forEach((c) => set.push(c));
        return Array.from(new Set(set));
      })();
      // Réinitialise race + couleur seulement quand l'espèce change après le montage (préserve l'édition)
      const monte = useRef(false);
      useEffect(() => { if (monte.current) { setRace(""); setCouleur(""); } else monte.current = true; }, [especeRace]);

      function submit(e) {
        e.preventDefault();
        const rec = { nom: nom.trim(), nombre: Math.max(1, Number(nombre) || 1), espece, race: race.trim(), couleur: couleur.trim(), lignee: lignee.trim(), naissance, arrivee, statut, dateFin: finNecessaire ? dateFin : "", obs: obs.trim() };
        (onSave || ajouterReproducteur)(rec);
        onClose();
      }
      return (
        <form onSubmit={submit} className="space-y-3">
          <div className="grid grid-cols-2 gap-3">
            <Field label="Nom (ou nom du lot — facultatif)">
              <input className={inputClass} value={nom} onChange={(e) => setNom(e.target.value)} placeholder="ex. Cléo ou « Lot Marans »" />
            </Field>
            <Field label="Espèce">
              <select className={inputClass} value={espece} onChange={(e) => setEspece(e.target.value)}>
                <option value="poule">Poule</option>
                <option value="coq">Coq</option>
                <option value="caille femelle">Caille femelle</option>
                <option value="caille mâle">Caille mâle</option>
              </select>
            </Field>
          </div>
          <div className="grid grid-cols-2 gap-3">
            <Field label="Nombre (lot)">
              <input type="number" min="1" step="1" className={inputClass} value={nombre} onChange={(e) => setNombre(e.target.value)} />
            </Field>
            <div className="flex items-end">
              <p className="text-xs text-slate-400 pb-2">Pour un lot acheté, indique combien d'animaux (ex. 3). Laisse 1 pour un animal individuel.</p>
            </div>
          </div>
          <div className="grid grid-cols-2 gap-3">
            <Field label="Race">
              <input className={inputClass} list="repro-races-list" value={race} onChange={(e) => setRace(e.target.value)} placeholder="cherche… (vide = inconnue)" />
              <datalist id="repro-races-list">{basesRace.map((b) => <option key={b} value={b} />)}</datalist>
            </Field>
            <Field label="Couleur / variété">
              <input className={inputClass} list="repro-couleurs-list" value={couleur} onChange={(e) => setCouleur(e.target.value)} placeholder="à identifier" />
              <datalist id="repro-couleurs-list">{couleursSugg.map((c) => <option key={c} value={c} />)}</datalist>
            </Field>
          </div>
          <div className="grid grid-cols-2 gap-3">
            <Field label="Date de naissance">
              <input type="date" className={inputClass} value={naissance} onChange={(e) => setNaissance(e.target.value)} />
            </Field>
            <Field label="Date d'arrivée dans le cheptel">
              <input type="date" className={inputClass} value={arrivee} onChange={(e) => setArrivee(e.target.value)} />
            </Field>
          </div>
          <Field label="Lignée / famille (anti-consanguinité)">
            <input className={inputClass} list="repro-lignees-list" value={lignee} onChange={(e) => setLignee(e.target.value)} placeholder="ex. Lignée A, descendants de Cléo…" />
            <datalist id="repro-lignees-list">{ligneesConnues.map((l) => <option key={l} value={l} />)}</datalist>
            <p className="text-xs text-slate-400 mt-1">Donne la même lignée aux animaux apparentés. L'appli te prévient si 2 reproducteurs actifs d'une même lignée pourraient être accouplés.</p>
          </Field>
          <div className="grid grid-cols-2 gap-3">
            <Field label="Statut">
              <select className={inputClass} value={statut} onChange={(e) => setStatut(e.target.value)}>
                <option value="actif">Actif</option>
                <option value="malade">Malade</option>
                <option value="décédé">Décédé</option>
                <option value="retiré reproduction">Retiré reproduction</option>
              </select>
            </Field>
            {finNecessaire && (
              <Field label="Date de décès / retrait">
                <input type="date" className={inputClass} value={dateFin} onChange={(e) => setDateFin(e.target.value)} />
              </Field>
            )}
          </div>
          <Field label="Observations">
            <textarea className={inputClass} rows="2" value={obs} onChange={(e) => setObs(e.target.value)} />
          </Field>
          <FormButtons onClose={onClose} />
        </form>
      );
    }

    /* ---------- Achats d'animaux reproducteurs (par lot) ---------- */
    function BreederPurchaseForm({ onClose, initial, onSave }) {
      const { ajouterBreederPurchase, config, setConfig } = useData();
      const TYPES = config.typesAchatRepro || ["reproducteur", "œufs à couver", "poussin/cailleteau", "autre"];
      const ESPECES = config.especes || ["poule", "caille"];
      const [date, setDate] = useState(initial ? initial.date : new Date().toISOString().slice(0, 10));
      const [fournisseur, setFournisseur] = useState(initial ? (initial.fournisseur || "") : "");
      const [typeAchat, setTypeAchat] = useState(initial ? (initial.typeAchat || TYPES[0]) : TYPES[0]);
      const [espece, setEspece] = useState(initial ? (initial.espece || ESPECES[0]) : ESPECES[0]);
      // Détail par lot : nb de lots × (femelles + mâles) par lot, prix par lot
      const [nbLots, setNbLots] = useState(initial && initial.nbLots != null ? String(initial.nbLots) : "1");
      const [femParLot, setFemParLot] = useState(initial && initial.femellesParLot != null ? String(initial.femellesParLot) : "");
      const [malParLot, setMalParLot] = useState(initial && initial.malesParLot != null ? String(initial.malesParLot) : "");
      const [prixParLot, setPrixParLot] = useState(initial ? (initial.prixParLot != null ? String(initial.prixParLot) : (initial.prixTotal != null ? String(initial.prixTotal) : "")) : "");
      const [remise, setRemise] = useState(initial && initial.remise ? String(initial.remise) : "");
      const [description, setDescription] = useState(initial ? (initial.description || "") : "");
      const [obs, setObs] = useState(initial ? (initial.obs || "") : "");
      const fournisseursConnus = (config.fournisseurs || []).slice().sort((a, b) => a.localeCompare(b));

      const nL = Math.max(0, Number(nbLots) || 0);
      const fem = Number(femParLot) || 0, mal = Number(malParLot) || 0;
      const animauxParLot = fem + mal;
      // total animaux = lots × composition ; à défaut (ancien achat sans détail en édition) on garde l'ancien nombre
      const totalAnimaux = animauxParLot > 0 ? nL * animauxParLot : (initial ? (Number(initial.nombre) || 0) : 0);
      const coutTotal = nL * (Number(prixParLot) || 0);
      const prixPaye = Math.max(0, coutTotal - (Number(remise) || 0));
      const coutAnimal = totalAnimaux > 0 ? prixPaye / totalAnimaux : null;

      function submit(e) {
        e.preventDefault();
        const rec = {
          date, fournisseur: fournisseur.trim(), typeAchat, espece,
          nbLots: nL, femellesParLot: fem, malesParLot: mal,
          prixParLot: Number(prixParLot) || 0,
          nombre: totalAnimaux, prixTotal: coutTotal, remise: Number(remise) || 0,
          description: description.trim(), obs: obs.trim(),
        };
        if (rec.fournisseur) setConfig((c) => ({ ...c, fournisseurs: memoriserFournisseur(c, rec.fournisseur) }));
        (onSave || ajouterBreederPurchase)(rec);
        onClose();
      }
      return (
        <form onSubmit={submit} className="space-y-3">
          <div className="grid grid-cols-2 gap-3">
            <Field label="Date d'achat">
              <input type="date" className={inputClass} value={date} onChange={(e) => setDate(e.target.value)} required />
            </Field>
            <Field label="Fournisseur / éleveur">
              <input className={inputClass} list="repro-fournisseurs-list" value={fournisseur} onChange={(e) => setFournisseur(e.target.value)} placeholder="ex. Élevage Dupont" />
              <datalist id="repro-fournisseurs-list">{fournisseursConnus.map((f) => <option key={f} value={f} />)}</datalist>
            </Field>
          </div>
          <div className="grid grid-cols-2 gap-3">
            <Field label="Type d'achat">
              <select className={inputClass} value={typeAchat} onChange={(e) => setTypeAchat(e.target.value)}>
                {TYPES.map((t) => <option key={t} value={t}>{t}</option>)}
              </select>
            </Field>
            <Field label="Espèce">
              <select className={inputClass} value={espece} onChange={(e) => setEspece(e.target.value)}>
                {ESPECES.map((sp) => <option key={sp} value={sp}>{sp}</option>)}
              </select>
            </Field>
          </div>
          {/* Détail par lot */}
          <div className="grid grid-cols-3 gap-3">
            <Field label="Nombre de lots">
              <input type="number" min="1" step="1" className={inputClass} value={nbLots} onChange={(e) => setNbLots(e.target.value)} placeholder="ex. 5" />
            </Field>
            <Field label="Femelles / lot">
              <input type="number" min="0" step="1" className={inputClass} value={femParLot} onChange={(e) => setFemParLot(e.target.value)} placeholder="ex. 3" />
            </Field>
            <Field label="Mâles / lot">
              <input type="number" min="0" step="1" className={inputClass} value={malParLot} onChange={(e) => setMalParLot(e.target.value)} placeholder="ex. 1" />
            </Field>
          </div>
          <div className="grid grid-cols-2 gap-3">
            <Field label="Prix d'un lot (€)">
              <input type="number" step="0.01" min="0" className={inputClass} value={prixParLot} onChange={(e) => setPrixParLot(e.target.value)} placeholder="ex. 24" />
            </Field>
            <Field label="Remise / promo (€)">
              <input type="number" step="0.01" min="0" className={inputClass} value={remise} onChange={(e) => setRemise(e.target.value)} placeholder="0" />
            </Field>
          </div>

          {/* Récapitulatif calculé automatiquement */}
          <div className="rounded-lg bg-slate-50 border border-slate-200 p-3 text-sm space-y-1">
            <p>
              <span className="text-slate-500">Total animaux :</span> <span className="font-medium">{totalAnimaux}</span>
              {animauxParLot > 0 && <span className="text-slate-400"> ({nL} lot{nL > 1 ? "s" : ""} × {animauxParLot}{(fem || mal) ? " · " + (nL * fem) + "♀ / " + (nL * mal) + "♂" : ""})</span>}
            </p>
            <p className="flex flex-wrap gap-x-4 gap-y-1">
              <span><span className="text-slate-500">Coût total :</span> <span className="font-medium">{eur(coutTotal)}</span></span>
              {Number(remise) > 0 && <span><span className="text-slate-500">Remise :</span> −{eur(Number(remise) || 0)}</span>}
              <span><span className="text-slate-500">Prix payé :</span> <span className="font-medium text-emerald-700">{eur(prixPaye)}</span></span>
              {coutAnimal != null && <span><span className="text-slate-500">≈</span> <span className="font-medium">{eur(coutAnimal)} / animal</span></span>}
            </p>
          </div>

          <Field label="Description du lot (facultatif)">
            <input className={inputClass} value={description} onChange={(e) => setDescription(e.target.value)} placeholder="ex. cailles 3♀+1♂, poules Marans…" />
          </Field>
          <Field label="Observation">
            <textarea className={inputClass} rows="2" value={obs} onChange={(e) => setObs(e.target.value)} />
          </Field>
          <FormButtons onClose={onClose} />
        </form>
      );
    }

    function AchatsReproducteurs() {
      const { breederPurchases, majLigne, supprimerLigne, patchLigne } = useData();
      const [open, setOpen] = useState(false);
      const [edit, setEdit] = useState(null);
      const paye = (a) => Math.max(0, (Number(a.prixTotal) || 0) - (Number(a.remise) || 0));
      const lignes = breederPurchases.map((a, i) => ({ a, i })).sort((x, y) => String(y.a.date).localeCompare(String(x.a.date)));
      const totalAnnee = breederPurchases.filter((a) => annee(a.date) === String(ANNEE_COURANTE)).reduce((s, a) => s + paye(a), 0);
      const totalAnimaux = breederPurchases.reduce((s, a) => s + (Number(a.nombre) || 0), 0);
      const totalLots = breederPurchases.reduce((s, a) => s + (Number(a.nbLots) || 1), 0);
      const totalPaye = breederPurchases.reduce((s, a) => s + paye(a), 0);
      const coutMoyenAnimal = totalAnimaux > 0 ? totalPaye / totalAnimaux : null;
      // Détail « X lots × Y (a♀/b♂) » d'un achat
      const detailLot = (a) => {
        const nL = Number(a.nbLots) || 1, fem = Number(a.femellesParLot) || 0, mal = Number(a.malesParLot) || 0;
        const parLot = fem + mal;
        if (parLot <= 0) return nL > 1 ? nL + " lots" : "";
        const sexe = (fem || mal) ? " · " + (nL * fem) + "♀/" + (nL * mal) + "♂" : "";
        return nL + " lot" + (nL > 1 ? "s" : "") + " × " + parLot + sexe;
      };

      return (
        <div>
          <div className="flex justify-end mb-4">
            <AddButton onClick={() => setOpen(true)} label="Enregistrer un achat" />
          </div>
          <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
            <StatCard label={"Dépenses achats " + ANNEE_COURANTE} value={eur(totalAnnee)} color="indigo" />
            <StatCard label="Animaux achetés (total)" value={totalAnimaux} sub={totalLots + " lot(s)"} />
            <StatCard label="Coût moyen / animal" value={coutMoyenAnimal != null ? eur(coutMoyenAnimal) : "—"} color="purple" />
            <StatCard label="Achats enregistrés" value={breederPurchases.length} />
          </div>
          <Table
            resume={(r, k) => { const a = lignes[k].a; return <>{frDate(a.date)} — {a.fournisseur || a.typeAchat || "achat"}<span className="text-slate-400"> · {a.espece || "—"} · {eur(paye(a))}</span></>; }}
            columns={["Date", "Fournisseur / éleveur", "Type", "Espèce", "Animaux (détail)", "Prix payé", "Obs", ""]}
            rows={lignes.map(({ a, i }) => {
              const total = Number(a.nombre) || 0;
              const det = detailLot(a);
              const perAnimal = total > 0 ? paye(a) / total : null;
              return [
                frDate(a.date),
                a.fournisseur || "—",
                a.typeAchat || "—",
                a.espece || "—",
                <div>
                  <span className="font-medium">{total || "—"}</span>
                  {det ? <span className="block text-xs text-slate-400">{det}</span> : null}
                  {a.description ? <span className="block text-xs text-slate-400 italic">{a.description}</span> : null}
                </div>,
                <div className="whitespace-nowrap">
                  {Number(a.remise) > 0
                    ? <span><span className="line-through text-slate-400 mr-1">{eur(Number(a.prixTotal) || 0)}</span><span className="font-medium">{eur(paye(a))}</span></span>
                    : <span className="font-medium">{eur(paye(a))}</span>}
                  {perAnimal != null && <span className="block text-xs text-slate-400">≈ {eur(perAnimal)}/animal</span>}
                </div>,
                <ObsCell texte={a.obs} titre={"Observation — achat " + frDate(a.date)} onSave={(v) => patchLigne("breederPurchases", i, { obs: v })} />,
                <RowActions onEdit={() => setEdit({ index: i, rec: a })} onDelete={() => supprimerLigne("breederPurchases", i)} />,
              ];
            })}
          />
          {breederPurchases.length === 0 && <p className="text-sm text-slate-400 mt-3">Aucun achat enregistré. Exemple : 5 lots de 4 cailles (3♀ + 1♂) à 24 € le lot → l'app calcule le total et le coût par animal.</p>}
          {open && (
            <Modal title="Nouvel achat de reproducteurs" onClose={() => setOpen(false)}>
              <BreederPurchaseForm onClose={() => setOpen(false)} />
            </Modal>
          )}
          {edit && (
            <Modal title="Modifier l'achat" onClose={() => setEdit(null)}>
              <BreederPurchaseForm initial={edit.rec} onSave={(rec) => majLigne("breederPurchases", edit.index, rec)} onClose={() => setEdit(null)} />
            </Modal>
          )}
        </div>
      );
    }

    // Carnet de santé individuel d'un reproducteur : événements datés (maladie, traitement, vaccin…)
    // stockés sur la fiche (`reproducteurs[].sante = [{date, type, description}]`).
    const TYPES_SANTE = ["maladie", "blessure", "traitement", "vaccin", "vermifuge", "mue", "comportement", "guérison", "autre"];
    const SANTE_CLS = { maladie: "bg-red-100 text-red-700", blessure: "bg-orange-100 text-orange-700", traitement: "bg-blue-100 text-blue-700", vaccin: "bg-indigo-100 text-indigo-700", vermifuge: "bg-purple-100 text-purple-700", mue: "bg-amber-100 text-amber-700", comportement: "bg-slate-100 text-slate-600", "guérison": "bg-emerald-100 text-emerald-700", autre: "bg-slate-100 text-slate-600" };
    function CarnetSante({ index, onClose }) {
      const { reproducteurs, patchLigne } = useData();
      const rec = reproducteurs[index] || {};   // lecture fraîche → la liste se met à jour après chaque ajout
      const [date, setDate] = useState(new Date().toISOString().slice(0, 10));
      const [type, setType] = useState("maladie");
      const [description, setDescription] = useState("");
      const entrees = (rec.sante || []).map((e, i) => ({ e, i })).sort((a, b) => (b.e.date || "").localeCompare(a.e.date || ""));
      const ajouter = (ev) => {
        ev.preventDefault();
        if (!description.trim()) return;
        patchLigne("reproducteurs", index, { sante: (rec.sante || []).concat([{ date, type, description: description.trim() }]) });
        setDescription("");
      };
      const retirer = (i) => patchLigne("reproducteurs", index, { sante: (rec.sante || []).filter((_, k) => k !== i) });
      return (
        <div className="space-y-4">
          <form onSubmit={ajouter} className="bg-slate-50 border border-slate-200 rounded-xl p-3 space-y-2">
            <div className="grid grid-cols-2 gap-3">
              <Field label="Date">
                <input type="date" className={inputClass} value={date} onChange={(e) => setDate(e.target.value)} required />
              </Field>
              <Field label="Type">
                <select className={inputClass} value={type} onChange={(e) => setType(e.target.value)}>
                  {TYPES_SANTE.map((t) => <option key={t} value={t}>{t}</option>)}
                </select>
              </Field>
            </div>
            <Field label="Description (symptômes, produit et dose, remarque…)">
              <textarea className={inputClass} rows="2" value={description} onChange={(e) => setDescription(e.target.value)} placeholder="ex. boite légèrement — patte droite ; ou : Vermifuge X, 0,5 ml" />
            </Field>
            <div className="flex justify-end">
              <button type="submit" className="px-4 py-2 text-sm rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white font-medium">+ Ajouter au carnet</button>
            </div>
          </form>
          {entrees.length === 0
            ? <p className="text-sm text-slate-400">Aucun événement de santé enregistré — c'est bon signe 👍</p>
            : <div className="space-y-2 max-h-72 overflow-y-auto pr-1">
                {entrees.map(({ e, i }) => (
                  <div key={i} className="flex items-start gap-2 bg-white border border-slate-100 rounded-lg p-2.5 shadow-sm">
                    <span className={"px-2 py-0.5 rounded-full text-xs font-medium shrink-0 " + (SANTE_CLS[e.type] || SANTE_CLS.autre)}>{e.type}</span>
                    <div className="min-w-0 flex-1">
                      <p className="text-xs text-slate-400">{frDate(e.date)}</p>
                      <p className="text-sm text-slate-700 break-words">{e.description}</p>

    function Reproducteurs() {

        if (filtre === "décédés") return r.statut === "décédé";
        if (filtre === "poule") return r.espece === "poule";
        if (filtre === "coq") return r.espece === "coq";
        if (filtre === "caille femelle") return r.espece === "caille femelle";
        if (filtre === "caille mâle") return r.espece === "caille mâle";
        return true;

      const passeTexte = (r) => !txt || [r.nom, r.espece, r.race, r.statut, r.obs].filter(Boolean).some((v) => String(v).toLowerCase().includes(txt));
      const filtres = reproducteurs.map((r, i) => ({ r, i })).filter(({ r }) => passeFiltre(r) && passeTexte(r));

          {/* Anti-consanguinité : lignées ayant ≥ 2 reproducteurs actifs */}

            columns={["Nom", "Nb", "Espèce", "Race", "Lignée", "Naissance / arrivée", "Âge", "Stade repro", "Statut", "Décès / retrait", "Obs", ""]}
            rows={filtres.map(({ r, i }) => [
              <span className="font-medium">{r.nom || <span className="text-slate-400 font-normal">(lot sans nom)</span>}</span>,

              r.espece,
              <div><span>{r.race || "—"}</span>{r.couleur ? <span className="block text-xs text-slate-400">{r.couleur}</span> : null}</div>,
              r.lignee ? <span className="px-2 py-0.5 rounded-full text-xs bg-slate-100 text-slate-600">{r.lignee}</span> : <span className="text-slate-300">—</span>,
              r.naissance

              <span className="whitespace-nowrap">{ageAnimal(r)}</span>,

              <ObsCell texte={r.obs} titre={"Observation — " + r.nom} onSave={(v) => patchLigne("reproducteurs", i, { obs: v })} />,

                extra={

          {open && (

            </Modal>
          )}
          </>}
        </div>
      );

    /* ---------- Animaux destinés à l'abattoir ---------- */
    function AbattoirForm({ onClose, initial, onSave }) {
      const { races, ajouterAbattoir, config } = useData();
      const [lot, setLot] = useState(initial ? (initial.lot || "") : "");
      const [espece, setEspece] = useState(initial ? initial.espece : "poule");
      const [race, setRace] = useState(initial ? (initial.race || "") : "");
      const [naissance, setNaissance] = useState(initial ? (initial.naissance || "") : "");
      const [nombre, setNombre] = useState(initial ? String(initial.nombre) : "");
      const [statut, setStatut] = useState(initial ? initial.statut : "en croissance");
      const [abattagePrevu, setAbattagePrevu] = useState(initial ? (initial.abattagePrevu || "") : "");
      const [abattageReel, setAbattageReel] = useState(initial ? (initial.abattageReel || "") : "");
      const [poidsVif, setPoidsVif] = useState(initial && initial.poidsVif ? String(initial.poidsVif) : "");
      const [poidsCarcasse, setPoidsCarcasse] = useState(initial && initial.poidsCarcasse ? String(initial.poidsCarcasse) : "");
      const [nbCongele, setNbCongele] = useState(initial && initial.nbCongele != null && initial.nbCongele !== "" ? String(initial.nbCongele) : "");
      const [obs, setObs] = useState(initial ? (initial.obs || "") : "");
      const suggere = abattageSuggere({ naissance, espece }, config);
      const rendement = (Number(poidsVif) > 0 && Number(poidsCarcasse) > 0) ? Math.round((Number(poidsCarcasse) / Number(poidsVif)) * 100) : null;

      function submit(e) {
        e.preventDefault();
        const rec = {
          ...(initial || {}),   // préserve les pesées et champs annexes en édition
          lot: lot.trim(), espece, race, naissance, nombre: Number(nombre) || 0,
          statut, abattagePrevu, abattageReel,
          poidsVif: Number(poidsVif) || "", poidsCarcasse: Number(poidsCarcasse) || "",
          nbCongele: nbCongele === "" ? "" : Math.max(0, Number(nbCongele) || 0),

        };
        (onSave || ajouterAbattoir)(rec);
        onClose();

      return (
        <form onSubmit={submit} className="space-y-3">
          <div className="grid grid-cols-2 gap-3">
            <Field label="Numéro de lot">
              <input className={inputClass} value={lot} onChange={(e) => setLot(e.target.value)} placeholder="ex. 26P01" />
            </Field>
            <Field label="Espèce">
              <select className={inputClass} value={espece} onChange={(e) => setEspece(e.target.value)}>

                <option value="caille">Caille</option>
              </select>
            </Field>
          </div>
          <div className="grid grid-cols-2 gap-3">
            <Field label="Race (si connue)">
              <select className={inputClass} value={race} onChange={(e) => setRace(e.target.value)}>
                <option value="">—</option>
                {races.map((r, i) => <option key={i} value={r.race}>{r.race}</option>)}
              </select>
            </Field>
            <Field label="Date de naissance">
              <input type="date" className={inputClass} value={naissance} onChange={(e) => setNaissance(e.target.value)} />
            </Field>
          </div>
          <div className="grid grid-cols-2 gap-3">
            <Field label="Nombre d'animaux">
              <input type="number" min="0" className={inputClass} value={nombre} onChange={(e) => setNombre(e.target.value)} />
            </Field>
            <Field label="Statut">
              <select className={inputClass} value={statut} onChange={(e) => setStatut(e.target.value)}>
                <option value="en croissance">En croissance</option>
                <option value="prêt">Prêt</option>
                <option value="abattu">Abattu</option>
                <option value="décédé">Décédé</option>
              </select>
            </Field>
          </div>
          <div className="grid grid-cols-2 gap-3">
            <Field label="Abattage prévu">
              <input type="date" className={inputClass} value={abattagePrevu} onChange={(e) => setAbattagePrevu(e.target.value)} />
              {suggere && <p className="text-xs text-slate-400 mt-1">💡 Suggéré : {frDate(suggere)} ({(config.agesAbattage || {})[espece === "caille" ? "caille" : "poule"] || (espece === "caille" ? 8 : 18)} sem — modifiable dans Réglages)
                {!abattagePrevu && <button type="button" onClick={() => setAbattagePrevu(suggere)} className="ml-1 text-emerald-600 hover:underline">utiliser</button>}</p>}
            </Field>
            <Field label="Abattage réel">
              <input type="date" className={inputClass} value={abattageReel} onChange={(e) => setAbattageReel(e.target.value)} />

            </Field>
            <Field label="Poids carcasse moyen (g)">
              <input type="number" min="0" className={inputClass} value={poidsCarcasse} onChange={(e) => setPoidsCarcasse(e.target.value)} placeholder="ex. 1650" />

            <Field label="Rendement">
              <input className={inputClass + " bg-slate-100"} value={rendement != null ? rendement + " %" : "—"} readOnly />

          <Field label="Mis au congélateur (nombre)">
            <input type="number" min="0" className={inputClass} value={nbCongele} onChange={(e) => setNbCongele(e.target.value)} placeholder={statut === "abattu" && nombre ? "ex. " + nombre : ""} />
            <p className="text-xs text-slate-400 mt-1">Le stock congélateur se décompte avec le bouton « −1 » du tableau à chaque sujet consommé.</p>
          </Field>
          <Field label="Observations">
            <textarea className={inputClass} rows="2" value={obs} onChange={(e) => setObs(e.target.value)} />

          <FormButtons onClose={onClose} />
        </form>
