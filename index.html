              <summary className="cursor-pointer select-none px-5 py-3 text-sm font-semibold text-slate-600 flex items-center justify-between gap-2 list-none">
                <span>🙈 Articles masqués <span className="text-slate-400 font-normal">({masques.length})</span></span>
                <span className="text-slate-400 text-xs transition-transform group-open:rotate-180 shrink-0">▼</span>
              </summary>
              <div className="px-5 pb-4">
                <ul className="space-y-1.5">
                  {masques.map((a, i) => (
                    <li key={i} className="flex items-center justify-between gap-2 text-sm text-slate-500">
                      <span className="min-w-0 truncate">{a.article} <span className="text-slate-400">· {a.stock} {a.unite}{a.categorie ? " · " + a.categorie : ""}</span></span>
                      <button onClick={() => setMasque(a.article)} className="px-2.5 py-1 rounded-lg text-xs font-medium border border-slate-300 text-slate-500 hover:bg-slate-50 whitespace-nowrap shrink-0">👁 Réafficher</button>
                    </li>
                  ))}
                </ul>
                <p className="text-xs text-slate-400 mt-2">Ces articles ne comptent plus dans « À racheter » ni dans les alertes du tableau de bord. Leurs mouvements restent visibles dans l'onglet Mouvements.</p>
              </div>
            </details>
          )}

          </>}

          {vue === "depenses" && <>
          {/* Dépenses par mois : graphique + tableau */}
          <h2 className="text-lg font-semibold mb-3">Dépenses par mois</h2>
          <div className="bg-white rounded-xl shadow-sm border border-slate-100 p-4 mb-4 max-w-md">
            <SeriesChart titre="Dépenses consommables (€ / mois)" unit="€" color="#6366f1" data={chartData} />
          </div>
          <Table
            columns={["Mois", "Dépenses"]}
            rows={moisTries.map((m) => [moisFr(m), <span className="font-medium">{eur(st.depMois[m])}</span>])}
          />

          </>}

          {vue === "mouvements" && <>
          {/* Mouvements */}
          <h2 className="text-lg font-semibold mb-3">Mouvements de stock</h2>
          <Table
            resume={(r, k) => { const c = mvts[k].c; return <>{frDate(c.date)} — {c.article} — <span className={c.mouvement === "sortie" ? "text-amber-700" : "text-emerald-700"}>{c.mouvement === "sortie" ? "Sortie" : "Entrée"}</span></>; }}
            columns={["Date", "Article", "Catégorie", "Mouvement", "Quantité", "Prix u.", "Coût", "Fournisseur", "Obs", ""]}
            rows={mvts.map(({ c, i }) => [
              frDate(c.date),
              <span className="font-medium">{c.article}</span>,
              c.categorie,
              c.mouvement === "sortie"
                ? <span className="px-2 py-0.5 rounded-full text-xs font-medium bg-amber-100 text-amber-700">sortie</span>
                : <span className="px-2 py-0.5 rounded-full text-xs font-medium bg-emerald-100 text-emerald-700">entrée</span>,
              <span>{c.quantite} {c.unite}{c.conditionnement ? <span className="block text-xs text-slate-400">{c.conditionnement}</span> : null}</span>,
              c.mouvement === "sortie" ? "—" : eur(c.prixUnitaire),
              c.mouvement === "sortie" ? "—" : (
                Number(c.remise) > 0
                  ? <span className="whitespace-nowrap"><span className="line-through text-slate-400 mr-1">{eur(valReelle(c))}</span><span className="font-medium">{eur(cout(c))}</span></span>
                  : eur(cout(c))
              ),
              c.fournisseur || "—",
              <ObsCell texte={c.obs} titre={"Observation — " + c.article} onSave={(v) => patchLigne("consommables", i, { obs: v })} />,
              <RowActions onEdit={() => setEdit({ index: i, rec: c })} onDelete={() => supprimerLigne("consommables", i)} />,
            ])}
          />
          <p className="text-xs text-slate-400 mt-2">Seules les <span className="font-medium">entrées</span> comptent comme dépenses. Le stock = entrées − sorties par article. Astuce : bouton <span className="font-medium">↘ Sortir</span> pour une sortie rapide.</p>
          </>}

          {fusion && (
            <Modal title="🔀 Fusionner deux articles" onClose={() => setFusion(false)}>
              <FusionArticlesForm articles={st.parArticle.map((a) => a.article)} onClose={() => setFusion(false)} onFusion={fusionnerArticles} />
            </Modal>
          )}

          {open && (
            <Modal title={open === "sortie" ? "Sortie de stock" : "Entrée de stock"} onClose={() => setOpen(null)}>
              <ConsommableForm mouvementInit={open} onClose={() => setOpen(null)} />
            </Modal>
          )}
          {sortie && (
            <Modal title="Sortir du stock" onClose={() => setSortie(null)}>
              <SortieRapideForm article={sortie} onClose={() => setSortie(null)} />
            </Modal>
          )}
          {edit && (
            <Modal title="Modifier le mouvement" onClose={() => setEdit(null)}>
              <ConsommableForm initial={edit.rec} onSave={(rec) => majLigne("consommables", edit.index, rec)} onClose={() => setEdit(null)} />
            </Modal>
          )}
        </div>
      );
    }

    /* ---------- Inventaire matériel ---------- */
    const ETAT_MATERIEL_CLS = {
      "neuf": "bg-emerald-100 text-emerald-700",
      "bon": "bg-blue-100 text-blue-700",
      "à surveiller": "bg-amber-100 text-amber-700",
      "à réparer": "bg-orange-100 text-orange-700",
      "hors service": "bg-red-100 text-red-700",
    };
    function EtatMateriel({ etat }) {
      return <span className={`px-2 py-0.5 rounded-full text-xs font-medium ${ETAT_MATERIEL_CLS[etat] || "bg-slate-100 text-slate-600"}`}>{etat}</span>;
    }
    // Pastilles de répartition des états d'une ligne multi-unités (ex. « 7 bon · 1 hors service »)
    function EtatsLigne({ m }) {
      const rep = repartitionEtats(m);
      const etats = ETATS_MATERIEL.filter((e) => rep[e]);
      if (etats.length <= 1) return <EtatMateriel etat={etats[0] || m.etat} />;
      return (
        <span className="flex flex-wrap gap-1">
          {etats.map((e) => (
            <span key={e} className={`px-2 py-0.5 rounded-full text-xs font-medium whitespace-nowrap ${ETAT_MATERIEL_CLS[e] || "bg-slate-100 text-slate-600"}`}>{rep[e]} {e}</span>
          ))}
        </span>
      );
    }

    function MaterielForm({ onClose, initial, onSave }) {
      const { ajouterMateriel, config, setConfig } = useData();
      const MATERIEL_CATS_C = config.catsMateriel;
      const [dateAchat, setDateAchat] = useState(initial ? initial.dateAchat : new Date().toISOString().slice(0, 10));
      const [article, setArticle] = useState(initial ? initial.article : "");
      const [categorie, setCategorie] = useState(initial ? initial.categorie : MATERIEL_CATS_C[0]);
      const [quantite, setQuantite] = useState(initial ? String(initial.quantite) : "1");
      const [prixUnitaire, setPrixUnitaire] = useState(initial ? String(initial.prixUnitaire) : "");
      const [remise, setRemise] = useState(initial && initial.remise ? String(initial.remise) : "");
      const [etat, setEtat] = useState(initial ? initial.etat : "neuf");
      const [dateHorsService, setDateHorsService] = useState(initial ? (initial.dateHorsService || "") : "");
      const [fournisseur, setFournisseur] = useState(initial ? (initial.fournisseur || "") : "");
      const [seuil, setSeuil] = useState(initial && Number(initial.seuil) > 0 ? String(initial.seuil) : "");
      const [urgent, setUrgent] = useState(initial ? !!initial.urgent : false);
      const [obs, setObs] = useState(initial ? (initial.obs || "") : "");
      const valeurReelle = (Number(quantite) || 0) * (Number(prixUnitaire) || 0);
      const prixPaye = Math.max(0, valeurReelle - (Number(remise) || 0));
      const fournisseursConnus = (config.fournisseurs || []).slice().sort((a, b) => a.localeCompare(b));

      function submit(e) {
        e.preventDefault();
        const rec = {
          dateAchat, article: article.trim(), categorie,
          quantite: Number(quantite) || 0, prixUnitaire: Number(prixUnitaire) || 0,
          remise: Number(remise) || 0,
          etat, dateHorsService: etat === "hors service" ? dateHorsService : "",
          fournisseur: fournisseur.trim(),
          seuil: Number(seuil) || 0, urgent,
          // La ventilation par unité (ex. 1 HS sur 8) se garde telle quelle — elle s'édite via le bouton États du tableau
          ...(initial && initial.etats && initial.etat === etat ? { etats: initial.etats } : {}),
          obs: obs.trim(),
        };
        if (rec.fournisseur) setConfig((c) => ({ ...c, fournisseurs: memoriserFournisseur(c, rec.fournisseur) }));
        (onSave || ajouterMateriel)(rec);
        onClose();
      }
      return (
        <form onSubmit={submit} className="space-y-3">
          <div className="grid grid-cols-2 gap-3">
            <Field label="Date d'achat">
              <input type="date" className={inputClass} value={dateAchat} onChange={(e) => setDateAchat(e.target.value)} required />
            </Field>
            <Field label="État">
              <select className={inputClass} value={etat} onChange={(e) => setEtat(e.target.value)}>
                {ETATS_MATERIEL.map((s) => <option key={s} value={s}>{s}</option>)}
              </select>
            </Field>
          </div>
          <Field label="Article">
            <input className={inputClass} value={article} onChange={(e) => setArticle(e.target.value)} placeholder="ex. Couveuse 120" required />
          </Field>
          <Field label="Catégorie">
            <select className={inputClass} value={categorie} onChange={(e) => setCategorie(e.target.value)}>
              {MATERIEL_CATS_C.map((c) => <option key={c} value={c}>{c}</option>)}
            </select>
          </Field>
          <div className="grid grid-cols-2 gap-3">
            <Field label="Quantité">
              <input type="number" min="0" className={inputClass} value={quantite} onChange={(e) => setQuantite(e.target.value)} />
            </Field>
            <Field label="Prix unitaire (€)">
              <input type="number" step="0.01" min="0" className={inputClass} value={prixUnitaire} onChange={(e) => setPrixUnitaire(e.target.value)} />
            </Field>
          </div>
          <div className="grid grid-cols-3 gap-3">
            <Field label="Valeur réelle (€)">
              <input className={inputClass + " bg-slate-100"} value={eur(valeurReelle)} readOnly />
            </Field>
            <Field label="Remise / promo (€)">
              <input type="number" step="0.01" min="0" className={inputClass} value={remise} onChange={(e) => setRemise(e.target.value)} placeholder="ex. 55.35" />
            </Field>
            <Field label="Prix payé (€)">
              <input className={inputClass + " bg-slate-100 font-medium"} value={eur(prixPaye)} readOnly />
            </Field>
          </div>
          <div className="grid grid-cols-2 gap-3">
            <Field label="Fournisseur">
              <input className={inputClass} list="materiel-fournisseurs-list" value={fournisseur} onChange={(e) => setFournisseur(e.target.value)} placeholder="ex. Gamm Vert" />
              <datalist id="materiel-fournisseurs-list">{fournisseursConnus.map((f) => <option key={f} value={f} />)}</datalist>
            </Field>
            {etat === "hors service" && (
              <Field label="Date de mise hors service">
                <input type="date" className={inputClass} value={dateHorsService} onChange={(e) => setDateHorsService(e.target.value)} />
              </Field>
            )}
          </div>
          <div className="grid grid-cols-2 gap-3">
            <Field label="Seuil d'alerte (en état de marche)">
              <input type="number" min="0" className={inputClass} value={seuil} onChange={(e) => setSeuil(e.target.value)} placeholder="ex. 2 — vide = pas d'alerte" />
            </Field>
            <Field label="Priorité">
              <label className="flex items-center gap-2 text-sm mt-2 cursor-pointer">
                <input type="checkbox" checked={urgent} onChange={(e) => setUrgent(e.target.checked)} />
                ⭐ Urgent (remonte en alertes importantes)
              </label>
            </Field>
          </div>
          <Field label="Observations">
            <textarea className={inputClass} rows="2" value={obs} onChange={(e) => setObs(e.target.value)} />
          </Field>
          <FormButtons onClose={onClose} />
        </form>
      );
    }

    // Ventilation des états d'une ligne multi-unités (ex. 8 thermomètres = 7 bon + 1 hors service).
    // Le total doit faire exactement la quantité de la ligne.
    function EtatsRepartitionForm({ m, onSave, onClose }) {
      const q = Number(m.quantite) || 0;
      const [rep, setRep] = useState(() => { const init = repartitionEtats(m); const o = {}; ETATS_MATERIEL.forEach((e) => { o[e] = init[e] || 0; }); return o; });
      const total = ETATS_MATERIEL.reduce((s, e) => s + (Number(rep[e]) || 0), 0);
      const ok = total === q;
      const setN = (e, v) => setRep((r) => ({ ...r, [e]: v === "" ? "" : Math.max(0, Math.round(Number(v) || 0)) }));
      function submit(ev) {
        ev.preventDefault();
        if (!ok) return;
        const etats = {}; ETATS_MATERIEL.forEach((e) => { const n = Number(rep[e]) || 0; if (n > 0) etats[e] = n; });
        // État principal de la ligne = celui qui compte le plus d'unités (sert au résumé et à l'ancien modèle)
        const principal = ETATS_MATERIEL.slice().sort((a, b) => (etats[b] || 0) - (etats[a] || 0))[0] || m.etat;
        onSave({ etats, etat: principal });
        onClose();
      }
      return (
        <form onSubmit={submit} className="space-y-3">
          <p className="text-sm text-slate-600"><span className="font-medium">{m.article}</span> — {q} unité{q > 1 ? "s" : ""} au total. Indique combien d'unités sont dans chaque état.</p>
          <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
            {ETATS_MATERIEL.map((e) => (
              <Field key={e} label={e}>
                <input type="number" min="0" max={q} className={inputClass} value={rep[e]} onChange={(ev) => setN(e, ev.target.value)} />
              </Field>
            ))}
          </div>
          <p className={"text-sm font-medium " + (ok ? "text-emerald-600" : "text-red-600")}>
            Total : {total} / {q}{ok ? " ✓" : " — ajuste pour arriver à " + q}
          </p>
          <div className="flex justify-end gap-2 pt-2">
            <button type="button" onClick={onClose} className="px-4 py-2 text-sm rounded-lg border border-slate-300 hover:bg-slate-50">Annuler</button>
            <button type="submit" disabled={!ok} className={"px-4 py-2 text-sm rounded-lg text-white font-medium " + (ok ? "bg-emerald-600 hover:bg-emerald-700" : "bg-slate-300 cursor-not-allowed")}>Enregistrer</button>
          </div>
        </form>
      );
    }

    function InventaireMateriel() {
      const { materiel, majMaterielEtat, majLigne, supprimerLigne, patchLigne } = useData();
      const [vue, setVue] = useState("parc");   // onglet interne : parc | traiter
      const [open, setOpen] = useState(false);
      const [edit, setEdit] = useState(null);
      const [etatsEdit, setEtatsEdit] = useState(null);   // { index, m } → modale de ventilation des états
      const st = statsMateriel(materiel);
      const valReelle = (m) => (Number(m.quantite) || 0) * (Number(m.prixUnitaire) || 0);
      const cout = (m) => Math.max(0, valReelle(m) - (Number(m.remise) || 0));   // prix payé (remise déduite)
      // index d'origine conservé pour la modification d'état après tri ; on masque les "remplacé"
      const lignes = materiel.map((m, i) => ({ m, i })).filter(x => x.m.etat !== "remplacé").sort((a, b) => b.m.dateAchat.localeCompare(a.m.dateAchat));
      // Libellé « Thermomètre (1/8) » quand seule une partie des unités de la ligne est concernée
      const libNb = ({ m, nb, q }) => m.article + (q > 1 ? " (" + nb + "/" + q + ")" : "");
      const aTraiter = (titre, items, couleur) => <DashListe titre={titre} items={items.map(libNb)} couleur={couleur} vide="Aucun" />;

      return (
        <div>
          <PageHeader
            title="Inventaire matériel"
            subtitle="Matériel durable — coût rattaché à l'année d'achat uniquement"
            action={<AddButton onClick={() => setOpen(true)} label="Ajouter un matériel" />}
          />

          {/* Résumé chiffré */}
          <div className="grid grid-cols-2 md:grid-cols-3 gap-4 mb-4">
            <StatCard label={"Dépenses matériel " + ANNEE_COURANTE} value={eur(st.depenseAnneeCourante)} color="indigo" />
            <StatCard label="Valeur totale du parc" value={eur(st.valeurTotale)} sub="cumul de tous les achats" />
            <StatCard label="À traiter" value={st.nbAReparer} color="orange" sub="unités à réparer / remplacer / HS" />
          </div>

          {/* Onglets internes */}
          <div className="flex gap-1.5 mb-6 flex-wrap border-b border-slate-200">
            {[["parc", "🔧 Parc"], ["traiter", "🛠️ À traiter" + (st.nbAReparer ? " · " + st.nbAReparer : "")]].map(([id, lbl]) => (
              <button key={id} onClick={() => setVue(id)}
                className={"px-3 py-2 text-sm font-medium -mb-px border-b-2 whitespace-nowrap " + (vue === id ? "border-emerald-600 text-emerald-700" : "border-transparent text-slate-500 hover:text-slate-700")}>{lbl}</button>
            ))}
          </div>

          {vue === "traiter" && <>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
              {aTraiter("À réparer", st.aReparer, "orange")}
              {aTraiter("À remplacer", st.aRemplacer, "orange")}
              {aTraiter("Hors service", st.horsService, "red")}
            </div>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-2">
              <DashListe titre="Sous le seuil d'alerte" couleur="red"
                items={st.sousSeuil.map(({ m, marche }) => m.article + " — " + marche + " en état de marche (seuil " + m.seuil + ")")}
                vide="Aucun matériel sous son seuil" />
            </div>
            <p className="text-xs text-slate-400 mb-2">Seuls les matériels marqués ⭐ urgent remontent dans les « Alertes importantes » du tableau de bord — les autres restent listés ici.</p>
          </>}

          {vue === "parc" && <>
          <Table
            resume={(r, k) => { const m = lignes[k].m; const rep = repartitionEtats(m); const etats = ETATS_MATERIEL.filter(e => rep[e]); return <>{m.urgent ? "⭐ " : ""}<span className="font-medium">{m.article}</span> <span className="text-slate-400">— {etats.map(e => rep[e] + " " + e).join(" · ") || m.etat}</span></>; }}
            columns={["Date d'achat", "Article", "Catégorie", "Qté", "En marche", "Prix u.", "Coût", "État", "Âge", "Obs", "Actions"]}
            rows={lignes.map(({ m, i }) => [
              frDate(m.dateAchat),
              <span className="flex items-center gap-1">
                <button onClick={() => patchLigne("materiel", i, { urgent: !m.urgent })}
                  title={m.urgent ? "Urgent : en panne/sous seuil → alerte importante (clic pour retirer)" : "Marquer urgent (alerte importante si panne/sous seuil)"}
                  className={"text-sm " + (m.urgent ? "" : "opacity-40 hover:opacity-100")}>{m.urgent ? "⭐" : "☆"}</button>
                <span className="font-medium">{m.article}</span>
              </span>,
              m.categorie,
              m.quantite,
              (() => {
                const em = nbEnMarche(m), q = Number(m.quantite) || 0, sous = materielSousSeuil(m);
                return (
                  <span className={"whitespace-nowrap " + (sous ? "text-red-600 font-medium" : (em < q ? "text-amber-600" : "text-slate-600"))}>
                    {em}/{q}{Number(m.seuil) > 0 ? <span className="text-xs text-slate-400"> · seuil {m.seuil}</span> : null}{sous ? " ⚠️" : ""}
                  </span>
                );
              })(),
              eur(m.prixUnitaire),
              Number(m.remise) > 0
                ? <span className="whitespace-nowrap"><span className="line-through text-slate-400 mr-1">{eur(valReelle(m))}</span><span className="font-medium">{eur(cout(m))}</span></span>
                : <span className="font-medium">{eur(cout(m))}</span>,
              (Number(m.quantite) || 0) > 1
                ? <button onClick={() => setEtatsEdit({ index: i, m })} title="Ventiler les états des unités (ex. 1 hors service sur 8)" className="text-left flex items-center gap-1 hover:opacity-80">
                    <EtatsLigne m={m} /><span className="text-slate-400 text-xs">✏️</span>
                  </button>
                : <select value={m.etat} onChange={(e) => majMaterielEtat(i, e.target.value)}
                    className="border border-slate-300 rounded-md px-1.5 py-0.5 text-xs focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    {ETATS_MATERIEL.map((s) => <option key={s} value={s}>{s}</option>)}
                  </select>,
              <span className="whitespace-nowrap">{ageMateriel(m)}</span>,
              <ObsCell texte={m.obs} titre={"Observation — " + m.article} onSave={(v) => patchLigne("materiel", i, { obs: v })} />,
              <RowActions
                onEdit={() => setEdit({ index: i, rec: m })}
                onDelete={() => supprimerLigne("materiel", i)}
                extra={
                  (m.etat === "à réparer" || m.etat === "hors service" || m.etat === "à remplacer") ? (
                    <>
                      <button onClick={() => majMaterielEtat(i, "bon")} title="Marquer réparé" className="px-1.5 py-0.5 rounded hover:bg-emerald-50 text-emerald-600 text-xs">✓</button>
                      <button onClick={() => majMaterielEtat(i, "remplacé")} title="Marquer remplacé" className="px-1.5 py-0.5 rounded hover:bg-slate-100 text-slate-500 text-xs">↻</button>
                    </>
                  ) : null
                } />,
            ])}
          />
          <p className="text-xs text-slate-400 mt-2">
            « Âge » = temps depuis l'achat (figé à la mise hors service si renseignée). Coût compté la seule année d'achat. « En marche » = unités neuves + bonnes + à surveiller ; ⚠️ rouge si au niveau du seuil d'alerte ou en dessous. Sur une ligne à plusieurs unités, clique sur l'État pour ventiler (ex. 1 hors service sur 8). ⭐ = urgent (remonte en alertes importantes). Actions : ✓ marquer réparé · ↻ marquer remplacé (sort des listes) · ✏️ modifier · 🗑 supprimer.
          </p>
          </>}

          {open && (
            <Modal title="Nouveau matériel" onClose={() => setOpen(false)}>
              <MaterielForm onClose={() => setOpen(false)} />
            </Modal>
          )}
          {edit && (
            <Modal title={"Modifier — " + edit.rec.article} onClose={() => setEdit(null)}>
              <MaterielForm initial={edit.rec} onSave={(rec) => majLigne("materiel", edit.index, rec)} onClose={() => setEdit(null)} />
            </Modal>
          )}
          {etatsEdit && (
            <Modal title={"États — " + etatsEdit.m.article} onClose={() => setEtatsEdit(null)}>
              <EtatsRepartitionForm m={etatsEdit.m} onSave={(patch) => patchLigne("materiel", etatsEdit.index, patch)} onClose={() => setEtatsEdit(null)} />
            </Modal>
          )}
        </div>
      );
    }

    /* ---------- Gestion des poulaillers ---------- */
    function PoulaillerForm({ onClose, initial, onSave }) {
      const { ajouterPoulailler, config } = useData();
      // Zones adultes uniquement (les jeunes se gèrent dans « Poussins & cailleteaux »).
      // En édition d'une ancienne ligne sur zone de jeunes, on garde sa valeur pour ne pas la perdre.
      const ZONES_C = (() => {
        const adultes = zonesAdultes(config);
        return (initial && initial.zone && !adultes.includes(initial.zone)) ? [initial.zone].concat(adultes) : adultes;
      })();
      // Coches initiales : nouveau format direct, sinon migration depuis l'ancien champ `action`
      const cochesInit = () => {
        if (initial && initial.coches) {
          const o = { ...initial.coches };
          if (o.vitamines) { o.fortiferm = true; delete o.vitamines; }  // ancien « vitamines » = Fortiferm
          return o;
        }
        const o = {};
        if (initial && initial.action) { const k = LEGACY_ACTION_MAP[initial.action]; if (k) o[k] = true; }
        return o;
      };
      const [date, setDate] = useState(initial ? initial.date : new Date().toISOString().slice(0, 10));
      const [zone, setZone] = useState(initial ? initial.zone : ZONES_C[0]);
      const [coches, setCoches] = useState(cochesInit);
      const [temperature, setTemperature] = useState(initial && initial.temperature != null && initial.temperature !== "" ? String(initial.temperature) : "");
      const [humidite, setHumidite] = useState(initial && initial.humidite != null && initial.humidite !== "" ? String(initial.humidite) : "");
      const [quantites, setQuantites] = useState(initial && initial.quantites ? { ...initial.quantites } : {});
      const [unitesProd, setUnitesProd] = useState(initial && initial.unitesProd ? { ...initial.unitesProd } : {});
      const [obs, setObs] = useState(initial ? (initial.obs || "") : "");

      const restesInterdit = (config.restesInterdits || []).map(normLibelle).includes(normLibelle(zone));
      const toggle = (k) => setCoches((c) => ({ ...c, [k]: !c[k] }));
      const setQ = (k, v) => setQuantites((q) => ({ ...q, [k]: v }));
      // Si la zone interdit les restes, on décoche restes automatiquement
      useEffect(() => { if (restesInterdit) setCoches((c) => (c.restes ? { ...c, restes: false } : c)); }, [zone]);

      const traitementsCoches = TRAITEMENTS.filter((k) => coches[k]);
      // Dose conseillée (ml) = volume de l'abreuvoir DÉDIÉ AUX TRAITEMENTS de la zone × règle de dosage
      const volTrait = volumeTraitementZone(config, zone);
      const doseTrait = doseTraitement(config, volTrait);

      function submit(e) {
        e.preventDefault();
        const cochesClean = {};
        ACTIONS_COCHES.forEach(({ key }) => { if (coches[key]) cochesClean[key] = true; });
        // Quantité par traitement coché — toujours en ml (petites quantités, NON déduites du stock)
        const quantitesClean = {}, unitesClean = {};
        traitementsCoches.forEach((k) => {
          quantitesClean[k] = (quantites[k] === "" || quantites[k] == null) ? "" : (Number(quantites[k]) || 0);
          unitesClean[k] = "ml";
        });
        const rec = {
          ...(initial || {}),
          date, zone, coches: cochesClean,
          temperature: temperature === "" ? "" : (Number(temperature) || 0),
          humidite: humidite === "" ? "" : (Number(humidite) || 0),
          quantites: quantitesClean, unitesProd: unitesClean,
          obs: obs.trim(),
        };
        delete rec.action; delete rec.probleme;  // migration vers coches + suppression « problème »
        (onSave || ajouterPoulailler)(rec);
        // Les traitements (Fortiferm/Cocciferm/Vermiferm) ne sont PAS déduits du stock : quantités trop petites (ml).
        onClose();
      }
      return (
        <form onSubmit={submit} className="space-y-3">
          <div className="grid grid-cols-2 gap-3">
            <Field label="Date">
              <input type="date" className={inputClass} value={date} onChange={(e) => setDate(e.target.value)} required />
            </Field>
            <Field label="Zone">
              <select className={inputClass} value={zone} onChange={(e) => setZone(e.target.value)}>
                {ZONES_C.map((z) => <option key={z} value={z}>{z}</option>)}
              </select>
            </Field>
          </div>
          <div>
            <p className="text-sm font-medium text-slate-600 mb-2">Actions faites (coche tout ce qui a été fait)</p>
            <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
              {ACTIONS_COCHES
                /* « Restes » réservés aux reproducteurs poules : complètement absent ailleurs (pas grisé) */
                .filter(({ restes }) => !(restes && restesInterdit))
                .map(({ key, label, icone }) => (
                  <label key={key} className={"flex items-center gap-2 text-sm px-3 py-2 rounded-lg border cursor-pointer " + (coches[key] ? "bg-emerald-50 border-emerald-300 text-emerald-800" : "border-slate-200 hover:bg-slate-50")}>
                    <input type="checkbox" checked={!!coches[key]} onChange={() => toggle(key)} className="w-4 h-4" />
                    <span>{icone} {label}</span>
                  </label>
                ))}
            </div>
          </div>

          {/* Quantité par traitement coché — en ml. Dose conseillée = abreuvoir « traitement » de la zone. */}
          {traitementsCoches.length > 0 && (
            <div className="rounded-lg border border-slate-100 bg-slate-50 p-3 space-y-2">
              <p className="text-sm font-medium text-slate-600">Quantité par traitement <span className="font-normal text-slate-400">(en ml)</span></p>
              {doseTrait != null
                ? <p className="text-xs text-slate-500">💧 Dose conseillée : <span className="font-medium text-slate-700">{formatMl(doseTrait)}</span> (abreuvoir traitement {volTrait} L)</p>
                : <p className="text-xs text-amber-600">⚠️ Aucun abreuvoir « traitement » réglé pour cette zone — renseigne-le dans Réglages → Abreuvoirs / volumes (coche « Traitt. »).</p>}
              {traitementsCoches.map((k) => {
                const lbl = (ACTIONS_COCHES.find((a) => a.key === k) || {}).label || k;
                return (
                  <div key={k} className="grid grid-cols-[1fr_auto_auto] gap-2 items-center">
                    <span className="text-sm text-slate-700">🧪 {lbl}</span>
                    <span className="flex items-center gap-1">
                      <input type="number" step="0.1" min="0" className={inputClass + " w-24"} value={quantites[k] != null ? quantites[k] : ""} onChange={(e) => setQ(k, e.target.value)} placeholder="ml" />
                      <span className="text-sm text-slate-500">ml</span>
                    </span>
                    {doseTrait != null
                      ? <button type="button" onClick={() => setQ(k, Number(doseTrait.toFixed(1)))} className="text-xs px-2 py-1 rounded-lg border border-emerald-300 text-emerald-700 hover:bg-emerald-50 whitespace-nowrap">dose {formatMl(doseTrait)}</button>
                      : <span />}
                  </div>
                );
              })}
              <p className="text-xs text-slate-400">Ces quantités (en ml) ne sont pas déduites du stock (trop petites).</p>
            </div>
          )}

          <div className="grid grid-cols-2 gap-3">
            <Field label="Température (°C)">
              <input type="number" step="0.1" className={inputClass} value={temperature} onChange={(e) => setTemperature(e.target.value)} placeholder="facultatif" />
            </Field>
            <Field label="Humidité (%)">
              <input type="number" step="1" min="0" max="100" className={inputClass} value={humidite} onChange={(e) => setHumidite(e.target.value)} placeholder="facultatif" />
            </Field>
          </div>
          <Field label="Observation (note tout problème ici)">
            <textarea className={inputClass} rows="2" value={obs} onChange={(e) => setObs(e.target.value)} placeholder="ex. animal isolé, fuite d'eau…" />
          </Field>
          <FormButtons onClose={onClose} />
        </form>
      );
    }

    // Statut d'un nettoyage selon l'intervalle configuré et la dernière date
    function statutNettoyage(interv, dernier) {
      if (!interv) return { code: "libre", reste: null };
      if (!dernier) return { code: "jamais", reste: null };
      const jours = Math.floor((AUJOURDHUI - new Date(dernier)) / 86400000);
      const reste = interv - jours;
      return { code: reste < 0 ? "retard" : (reste <= 1 ? "bientot" : "ok"), reste };
    }

    // ===== Dosage automatique des traitements (Fortiferm / Cocciferm / Vermiferm) =====
    // dose (ml) = volume d'eau (L) × règle.ml / règle.parLitres. Défaut : 3 ml / 5 L.
    function doseTraitement(config, volumeL) {
      const r = (config && config.doseRule) || { ml: 3, parLitres: 5 };
      const v = Number(volumeL);
      if (!v || !r.parLitres) return null;
      return v * (Number(r.ml) || 0) / (Number(r.parLitres) || 5);
    }
    // Formate une dose en ml (1 décimale max), ex. 18 → "18 ml", 10.8 → "10,8 ml", 0.6 → "0,6 ml".
    function formatMl(n) {
      if (n == null) return "—";
      return Number(n).toLocaleString("fr-FR", { maximumFractionDigits: 1 }) + " ml";
    }
    // Volume d'abreuvoir d'une zone (par nom de zone normalisé, sinon par type). Renvoie un nombre ou null.
    function volumeAbreuvoirZone(config, zone) {
      const arr = (config && config.abreuvoirs) || [];
      const a = arr.find((x) => normLibelle(x.zone) === normLibelle(zone));
      return a && a.volume !== "" && a.volume != null ? Number(a.volume) : null;
    }
    // Volume de l'abreuvoir DÉDIÉ AUX TRAITEMENTS d'une zone (le petit). Sinon, à défaut, le 1er abreuvoir de la zone.
    function volumeTraitementZone(config, zone) {
      const arr = (config && config.abreuvoirs) || [];
      const nz = normLibelle(zone);
      const t = arr.find((x) => x.traitement === true && normLibelle(x.zone) === nz && x.actif !== false && x.volume !== "" && x.volume != null);
      if (t) return Number(t.volume);
      return volumeAbreuvoirZone(config, zone);   // pas d'abreuvoir traitement → on retombe sur le volume de la zone
    }
    // Type de jeune (poussins / cailleteaux) → volume du 1er abreuvoir actif de ce type.
    function volumeAbreuvoirType(config, type) {
      const arr = (config && config.abreuvoirs) || [];
      const a = arr.find((x) => normLibelle(x.type) === normLibelle(type) && x.actif !== false && x.volume !== "" && x.volume != null);
      return a ? Number(a.volume) : null;
    }
    // Volume d'abreuvoir d'un lot de jeunes selon son espèce.
    // « espace poussins » et « poussins » (ou « espace cailleteaux » et « cailleteaux ») sont traités
    // comme identiques : on cherche par mot-clé dans le TYPE ou le NOM de zone (peu importe lequel est rempli).
    function volumeAbreuvoirJeune(config, p) {
      const cle = (p && p.espece === "caille") ? "caillet" : "poussin";   // « caillet » couvre cailleteaux / cailletaux / cailleteau
      const arr = (config && config.abreuvoirs) || [];
      const a = arr.find((x) => x.actif !== false && x.volume !== "" && x.volume != null
        && (normLibelle(x.type).includes(cle) || normLibelle(x.zone).includes(cle)));
      return a ? Number(a.volume) : null;
    }
    // Un article est-il marqué « urgent » (alerte importante) ? Comparaison sur nom normalisé.
    function articleEstUrgent(config, article) {
      return ((config && config.articlesUrgents) || []).map(normLibelle).includes(normLibelle(article));
    }
    // Bascule l'état « urgent » d'un article dans la config. Renvoie le nouveau tableau.
    function toggleArticleUrgent(config, article) {
      const liste = ((config && config.articlesUrgents) || []).slice();
      const n = normLibelle(article);
      const i = liste.findIndex((x) => normLibelle(x) === n);
      if (i >= 0) liste.splice(i, 1); else liste.push(article.trim());
      return liste;
    }
    // Article masqué du stock (intitulé mal écrit, doublon…) ? Comparaison sur nom normalisé.
    function articleEstMasque(config, article) {
      return ((config && config.articlesMasques) || []).map(normLibelle).includes(normLibelle(article));
    }
    // Bascule l'état « masqué » d'un article. Renvoie le nouveau tableau.
    function toggleArticleMasque(config, article) {
      const liste = ((config && config.articlesMasques) || []).slice();
      const n = normLibelle(article);
      const i = liste.findIndex((x) => normLibelle(x) === n);
      if (i >= 0) liste.splice(i, 1); else liste.push(String(article).trim());
      return liste;
    }
    // Normalise un libellé (tolère casse / accents / espaces superflus) pour les comparaisons
    function normLibelle(s) {
      return (s == null ? "" : String(s)).trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/\s+/g, " ");
    }
    // Clés d'actions réalisées sur une ligne de soin — gère le nouveau format (coches)
    // ET l'ancien format (champ texte `action`). Renvoie un Set de clés (ex. "eau", "nettoyage").
    function actionsDeLigne(p) {
      const out = new Set();
      const add = (k) => { if (k) out.add(k === "vitamines" ? "fortiferm" : k); };  // ancien « vitamines » = Fortiferm
      if (p.coches && typeof p.coches === "object") {
        Object.keys(p.coches).forEach((k) => { if (p.coches[k]) add(k); });
      } else if (p.action) {
        add(LEGACY_ACTION_MAP[p.action]);
      }
      return out;
    }
    function ligneFaitAction(p, key) { return actionsDeLigne(p).has(key); }
    // Zone « de jeunes » (poussins/cailleteaux) → gérée dans le module Poussins, exclue de Gestion poulailler.
    // Détection par MOT-CLÉ (« poussin », « caillet ») en plus de la liste config : couvre toutes les
    // variantes de nom (« espace poussin », « poussins », « cailleteaux », « cailletaux »…).
    function estZoneJeune(zone, config) {
      const nz = normLibelle(zone);
      if (nz.includes("poussin") || nz.includes("caillet")) return true;   // « caillet » ne matche PAS « espace cailles »
      const set = (config && config.zonesJeunes ? config.zonesJeunes : ["espace poussins"]).map(normLibelle);
      return set.includes(nz);
    }
    // Zones adultes = zones hors zones de jeunes
    function zonesAdultes(config) {
      return (config && config.zones ? config.zones : []).filter((z) => !estZoneJeune(z, config));
    }
    // Espèce d'une zone, détectée par mot-clé dans le nom : "jeune" | "caille" | "poule" | "autre".
    // Sert à regrouper les zones par espèce (Soin du jour) et à afficher l'emoji distinctif —
    // pour ne JAMAIS confondre poules / cailles / poussins / cailleteaux.
    function especeZone(zone, config) {
      if (estZoneJeune(zone, config)) return "jeune";      // poussins & cailleteaux (déjà exclus des soins adultes)
      const nz = normLibelle(zone);
      if (nz.includes("caille")) return "caille";
      if (nz.includes("poul") || nz.includes("coq")) return "poule";  // « poul » couvre poule(s), poulailler, poulet(s)
      return "autre";
    }
    // Emoji d'espèce d'une zone — repère visuel dans les listes/journaux
    function emojiZone(zone, config) {
      return { jeune: "🐥", caille: "🐦", poule: "🐔", autre: "📍" }[especeZone(zone, config)];
    }
    // Liste des nettoyages à prévoir par zone (réutilisé par le tableau de bord)
    function nettoyagesAPrevoir(poulaillers, config) {
      const today = AUJOURDHUI.toISOString().slice(0, 10);
      // Fréquences indexées par nom de zone normalisé → tolère casse/accents/espaces
      const intervParZone = {};
      Object.keys(config.intervalleNettoyage || {}).forEach((k) => { intervParZone[normLibelle(k)] = config.intervalleNettoyage[k]; });
      // Source de vérité = les zones adultes (les zones de jeunes sont gérées dans Poussins & cailleteaux)
      const zonesBase = (config.zones && config.zones.length) ? config.zones : Object.keys(config.intervalleNettoyage || {});
      const zones = zonesBase.filter((z) => !estZoneJeune(z, config));
      return zones.map((zone) => {
        const nz = normLibelle(zone);
        const recs = poulaillers.filter(p => normLibelle(p.zone) === nz && ligneFaitAction(p, "nettoyage"));
        const ns = recs.map(p => p.date).sort();
        const dernier = ns.length ? ns[ns.length - 1] : null;
        // Prochain nettoyage programmé à la main (rappel futur le plus proche posé sur un nettoyage)
        const futurs = recs.map(p => p.rappel).filter(r => r && r >= today).sort();
        const prochainProgramme = futurs.length ? futurs[0] : null;
        const interv = intervParZone[nz];
        const st = statutNettoyage(interv, dernier);
        if (dernier === today) st.code = "fait";   // fait aujourd'hui → jamais "jamais"
        return { zone, dernier, interv, prochainProgramme, ...st };
      }).filter(nz => nz.interv || nz.dernier);  // zones avec une fréquence OU au moins un nettoyage enregistré
    }
    // Rappels intelligents : pour chaque zone de soin × action périodique, calcule la
    // dernière fois faite (depuis les lignes cochées) et la prochaine échéance selon la fréquence.
    // code: "retard" | "aujourdhui" | "avenir" | "jamais".
    function rappelsIntelligents(poulaillers, config) {
      const intervParZone = {};
      Object.keys(config.intervalleNettoyage || {}).forEach((k) => { intervParZone[normLibelle(k)] = config.intervalleNettoyage[k]; });
      const ftNorm = {};
      Object.keys(config.freqTraitements || {}).forEach((z) => { ftNorm[normLibelle(z)] = config.freqTraitements[z]; });
      const zones = (config.zones && config.zones.length) ? config.zones : Object.keys(config.intervalleNettoyage || {});
      // Zone « de soin » adulte = a une fréquence de nettoyage ET n'est pas une zone de jeunes
      const zonesSoin = zones.filter((z) => intervParZone[normLibelle(z)] && !estZoneJeune(z, config));
      const out = [];
      zonesSoin.forEach((zone) => {
        const nz = normLibelle(zone);
        const ftZone = ftNorm[nz] || {};
        // Pas de rappel pour eau / nourriture (gérés à vue). Seulement nettoyage + traitements.
        const suivis = [
          { key: "nettoyage", label: "Nettoyage", freq: intervParZone[nz] },
          { key: "fortiferm", label: "Fortiferm", freq: ftZone.fortiferm != null ? ftZone.fortiferm : 30 },
          { key: "cocciferm", label: "Cocciferm", freq: ftZone.cocciferm != null ? ftZone.cocciferm : 30 },
          { key: "vermiferm", label: "Vermiferm", freq: ftZone.vermiferm != null ? ftZone.vermiferm : 30 },
        ];
        suivis.forEach(({ key, label, freq }) => {
          if (!freq) return;  // 0 = pas de rappel pour cette action
          const dates = poulaillers.filter((p) => normLibelle(p.zone) === nz && ligneFaitAction(p, key)).map((p) => p.date).sort();
          const dernier = dates.length ? dates[dates.length - 1] : null;
          let code, reste = null, prochain = null;
          if (!dernier) { code = "jamais"; }
          else {
            const ecoules = joursDepuis(dernier);
            reste = freq - ecoules;
            prochain = dateDecalee(dernier, freq);
            code = reste < 0 ? "retard" : (reste === 0 ? "aujourdhui" : "avenir");
          }
          out.push({ zone, action: key, label, freq, dernier, prochain, reste, code });
        });
      });
      return out;
    }
    // Alerte d'âge d'un reproducteur selon les seuils (en mois) de config.agesRepro.
    // Renvoie { code, label } ou null si âge inconnu / pas de seuils.
    function alerteAgeRepro(r, config) {
      const seuils = (config.agesRepro || {})[r.espece];
      if (!seuils || !r.naissance) return null;
      const jours = joursDepuis(r.naissance);
      if (jours == null || jours < 0) return null;
      const mois = jours / 30.44;
      const ponte = (r.espece === "poule" || r.espece === "caille femelle");
      if (mois < seuils.min) return { code: "jeune", label: ponte ? "trop jeune pour pondre" : "trop jeune pour reproduire" };
      if (mois <= seuils.optimal) return { code: "optimal", label: ponte ? "âge de ponte optimal" : "âge de reproduction optimal" };
      if (mois <= seuils.declin) return { code: "declin", label: ponte ? "baisse de ponte possible" : "baisse de fertilité possible" };
      return { code: "age", label: "animal âgé à surveiller" };
    }
    // Pastille d'alerte d'âge reproducteur
    function BadgeAgeRepro({ a }) {
      if (!a) return <span className="text-slate-300 text-xs">—</span>;
      const cls = { jeune: "bg-blue-100 text-blue-700", optimal: "bg-emerald-100 text-emerald-700", declin: "bg-amber-100 text-amber-700", age: "bg-red-100 text-red-700" }[a.code] || "bg-slate-100 text-slate-600";
      return <span className={"px-2 py-0.5 rounded-full text-xs font-medium " + cls}>{a.label}</span>;
    }
    // Pastille d'alerte de nettoyage
    function AlerteNettoyage({ st }) {
      if (st.code === "libre") return <span className="text-slate-400 text-xs">libre</span>;
      if (st.code === "fait") return <span className="px-2 py-0.5 rounded-full text-xs font-medium bg-emerald-100 text-emerald-700">✓ fait aujourd'hui</span>;
      if (st.code === "jamais") return <span className="px-2 py-0.5 rounded-full text-xs font-medium bg-red-100 text-red-700">jamais fait</span>;
      if (st.code === "retard") return <span className="px-2 py-0.5 rounded-full text-xs font-medium bg-red-100 text-red-700">⚠️ en retard ({-st.reste} j)</span>;
      if (st.code === "bientot") return <span className="px-2 py-0.5 rounded-full text-xs font-medium bg-amber-100 text-amber-700">à faire bientôt</span>;
      return <span className="px-2 py-0.5 rounded-full text-xs font-medium bg-emerald-100 text-emerald-700">ok (dans {st.reste} j)</span>;
    }

    /* ---------- Identification (bagues, sexage, croisement par sujet) ---------- */
    const COULEURS_BAGUE_HEX = { jaune: "#facc15", vert: "#22c55e", bleu: "#3b82f6", "bleu clair": "#7dd3fc", "bleu fonce": "#1d4ed8", rouge: "#ef4444", blanc: "#f8fafc", noir: "#1e293b", violet: "#a855f7", orange: "#f97316", rose: "#ec4899", gris: "#94a3b8" };
    function PastilleBague({ couleur }) {
      if (!couleur) return <span className="text-slate-300 text-xs">—</span>;
      const hex = COULEURS_BAGUE_HEX[normLibelle(couleur)] || "#e2e8f0";
      return (
        <span className="inline-flex items-center gap-1.5 whitespace-nowrap text-xs">
          <span className="w-3.5 h-3.5 rounded-full border border-slate-300 inline-block shrink-0" style={{ backgroundColor: hex }} />{couleur}
        </span>
      );
    }
    // Couleurs de bagues EN STOCK par taille — normalise l'ancien format (tableau unique) et
    // garantit les 3 tailles. Résultat : { "8": [...], "12": [...], "16": [...] }.
    function palettesBagues(config) {
      const c = config && config.couleursBagues;
      if (Array.isArray(c)) return { "8": [], "12": c.slice(), "16": c.slice() };   // ancien format
      const def = { "8": ["noir", "bleu clair", "bleu foncé", "orange", "rose", "vert", "rouge", "violet", "blanc", "jaune"], "12": ["rouge", "bleu", "vert"], "16": ["jaune", "violet", "vert", "bleu", "rouge"] };
      return { ...def, ...(c || {}) };
    }
    // Couleur de bague d'un lot de jeunes : ROULEMENT automatique, par espèce et dans l'ordre des
    // lots. On tourne sur les couleurs disponibles À LA FOIS en 12 et 16 mm (un sujet du lot peut
    // ainsi garder la couleur du lot même s'il passe de 12 à 16 mm).
    function couleurBagueLot(config, poussins, lotIdx) {
      const pal = palettesBagues(config);
      const commun = (pal["12"] || []).filter((x) => (pal["16"] || []).map(normLibelle).includes(normLibelle(x)));
      const palette = commun.length ? commun : ((pal["16"] || []).length ? pal["16"] : (pal["12"] || []));
      if (!palette.length) return "";
      const esp = (p) => (p.espece === "caille" ? "caille" : "poule");
      const cible = poussins[lotIdx];
      if (!cible) return palette[0];
      const rang = poussins.filter((p, i) => i < lotIdx && esp(p) === esp(cible)).length;
      return palette[rang % palette.length];
    }

    function Identification() {
      const { poussins, sujets, reproducteurs, config, ajouterSujet, patchLigne, supprimerLigne } = useData();
      const [espI, setEspI] = useState("poule");     // poule (poules/coqs) | caille
      const [secI, setSecI] = useState("jeunes");    // jeunes | repro
      const nS = (config.jeunes && config.jeunes.suiviSemaines) || 8;
      const pal = palettesBagues(config);
      // Couleurs proposées selon la taille de bague choisie (mon stock réel) ;
      // sans taille → toutes les couleurs possibles. La couleur déjà posée reste listée même hors stock.
      const couleursPour = (taille, actuelle) => {
        const base = (taille && pal[taille]) ? pal[taille] : Array.from(new Set([].concat(pal["8"] || [], pal["12"] || [], pal["16"] || [])));
        return (actuelle && !base.map(normLibelle).includes(normLibelle(actuelle))) ? [actuelle].concat(base) : base;
      };
      const grpP = (p) => (p.espece === "caille" ? "caille" : "poule");
      const grpR = (esp) => ((esp || "").includes("caille") ? "caille" : "poule");
      const selCls = "border border-slate-300 rounded-md px-1.5 py-0.5 text-xs focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-white";

      // Lots de jeunes de l'espèce qui ont DÉPASSÉ la fenêtre de suivi (nS semaines) — à identifier
      const lotsAges = poussins.map((p, i) => ({ p, i })).filter(({ p }) => {
        if (grpP(p) !== espI || p.statut !== "en croissance") return false;
        const a = ageJeune(p.date);
        return a.jours != null && !a.futur && a.jours > nS * 7;
      });
      const sujetsDe = (lotId) => sujets.map((s, i) => ({ s, i })).filter(({ s }) => s.lot === lotId);
      // Crée une fiche par sujet vivant manquant du lot (numéro auto LOT-01, couleur du lot pré-remplie)
      const creerFiches = (p, i) => {
        const existants = sujetsDe(p.id).length;
        const manque = Math.max(0, (Number(p.nombre) || 0) - existants);
        const coul = couleurBagueLot(config, poussins, i);
        for (let k = 0; k < manque; k++) {
          ajouterSujet({ espece: espI, lot: p.id, numero: p.id + "-" + String(existants + k + 1).padStart(2, "0"), croisement: "", sexe: "?", bagueTaille: "", bagueCouleur: coul, obs: "" });
        }
      };
      const reprosEsp = reproducteurs.map((r, i) => ({ r, i })).filter(({ r }) => r.statut === "actif" && grpR(r.espece) === espI);
      const btnCls = (actif) => "px-3 py-1.5 rounded-lg text-sm border " + (actif ? "bg-emerald-600 text-white border-emerald-600" : "bg-white text-slate-600 border-slate-300 hover:bg-slate-50");

      return (
        <div>
          {/* Espèce puis catégorie */}
          <div className="flex flex-wrap items-center gap-2 mb-3">
            <span className="text-xs text-slate-400">Espèce :</span>
            <button onClick={() => setEspI("poule")} className={btnCls(espI === "poule")}>🐔 Poules / Coqs</button>
            <button onClick={() => setEspI("caille")} className={btnCls(espI === "caille")}>🐦 Cailles</button>
            <span className="text-xs text-slate-400 ml-3">Catégorie :</span>
            <button onClick={() => setSecI("jeunes")} className={btnCls(secI === "jeunes")}>🐥 Jeunes</button>
            <button onClick={() => setSecI("repro")} className={btnCls(secI === "repro")}>🐓 Reproducteurs</button>
          </div>

          {espI === "caille" && !(pal["8"] || []).length && (
            <p className="text-sm text-amber-700 bg-amber-50 border border-amber-200 rounded-xl px-3 py-2 mb-4">🐦 Cailles : aucune couleur de bague 8 mm en stock (Réglages → Soins & rappels → Bagues) — tu peux déjà préparer le sexage et les croisements.</p>
          )}

          {/* Règle des bagues */}
          <p className="text-xs text-slate-500 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 mb-4">
            💡 <span className="font-medium">Règle des bagues :</span> reproducteur = adulte → toujours <span className="font-medium">16 mm</span>. Sujet destiné à l'abattage : <span className="font-medium">12 mm</span> si abattu avant que ses pattes ne grossissent ; si elles deviennent trop grosses, remplace par une <span className="font-medium">16 mm</span> (change simplement la taille ici). Couleur = roulement automatique par lot.
          </p>

          {secI === "jeunes" && <>
            <h2 className="text-lg font-semibold mb-3">🐥 Jeunes à identifier <span className="text-sm font-normal text-slate-400">(lots au-delà de {nS} semaines)</span></h2>
            {lotsAges.length === 0
              ? <p className="text-sm text-slate-400 mb-6">Aucun lot de {espI === "caille" ? "cailleteaux" : "poussins"} n'a dépassé {nS} semaines. Les lots apparaissent ici quand les jeunes sont assez grands pour être distingués et bagués.</p>
              : lotsAges.map(({ p, i }) => {
                  const lignesS = sujetsDe(p.id);
                  const coul = couleurBagueLot(config, poussins, i);
                  const manque = Math.max(0, (Number(p.nombre) || 0) - lignesS.length);
                  const croisOpts = Array.from(new Set(((p.croisements || []).map((c) => c.nom)).concat(suggestionsCroisements(reproducteurs, p.espece)))).filter(Boolean);
                  const dlId = "crois-sujets-" + p.id;
                  return (
                    <div key={p.id} className="mb-6">
                      <div className="flex items-center justify-between gap-2 flex-wrap mb-2">
                        <h3 className="text-sm font-semibold text-slate-600">Lot {p.id} <span className="font-normal text-slate-400">· {ageJeune(p.date).label} · {p.nombre} vivant(s) · couleur du lot :</span> <PastilleBague couleur={coul} /></h3>
                        {manque > 0 && (
                          <button onClick={() => creerFiches(p, i)} className="px-3 py-1.5 rounded-lg text-sm bg-emerald-600 hover:bg-emerald-700 text-white whitespace-nowrap">+ Créer {manque} fiche{manque > 1 ? "s" : ""} sujet{manque > 1 ? "s" : ""}</button>
                        )}
                      </div>
                      <datalist id={dlId}>{croisOpts.map((c) => <option key={c} value={c} />)}</datalist>
                      {lignesS.length === 0
                        ? <p className="text-sm text-slate-400">Clique sur « + Créer » : une fiche par sujet vivant (n° auto, couleur du lot pré-remplie).</p>
                        : <Table
                            resume={(r, k) => { const s = lignesS[k].s; return <><span className="font-medium">{s.numero}</span> · {s.sexe}{s.bagueTaille ? " · " + s.bagueTaille + " mm " + (s.bagueCouleur || "") : " · à baguer"}{s.croisement ? " · 🧬 " + codeCroisement(s.croisement) : ""}</>; }}
                            columns={["N°", "Croisement supposé", "Sexage", "Bague", "Couleur", "Obs", ""]}
                            rows={lignesS.map(({ s, i: si }) => [
                              <input className={selCls + " w-24 font-medium"} value={s.numero} onChange={(e) => patchLigne("sujets", si, { numero: e.target.value })} />,
                              <input className={selCls + " w-40"} list={dlId} value={s.croisement} onChange={(e) => patchLigne("sujets", si, { croisement: e.target.value })} placeholder="ex. Marans × Sussex" />,
                              <select className={selCls} value={s.sexe || "?"} onChange={(e) => patchLigne("sujets", si, { sexe: e.target.value })}>
                                {["?", "mâle", "femelle"].map((x) => <option key={x} value={x}>{x === "mâle" ? "♂ mâle" : x === "femelle" ? "♀ femelle" : "? à confirmer"}</option>)}
                              </select>,
                              <select className={selCls} value={s.bagueTaille || ""} onChange={(e) => patchLigne("sujets", si, { bagueTaille: e.target.value })}>
                                <option value="">à baguer</option>
                                {(espI === "caille" ? ["8"] : ["12", "16"]).map((t) => <option key={t} value={t}>{t} mm</option>)}
                              </select>,
                              <span className="flex items-center gap-1.5">
                                <select className={selCls} value={s.bagueCouleur || ""} onChange={(e) => patchLigne("sujets", si, { bagueCouleur: e.target.value })}>
                                  <option value="">—</option>
                                  {couleursPour(s.bagueTaille, s.bagueCouleur).map((c) => <option key={c} value={c}>{c}</option>)}
                                </select>
                                <PastilleBague couleur={s.bagueCouleur} />
                              </span>,
                              <ObsCell texte={s.obs} titre={"Observation — " + s.numero} onSave={(v) => patchLigne("sujets", si, { obs: v })} />,
                              <RowActions onDelete={() => supprimerLigne("sujets", si)} />,
                            ])}
                          />}
                    </div>
                  );
                })}
            <p className="text-xs text-slate-400">Le croisement supposé propose ceux notés sur le lot + les croisements possibles avec tes reproducteurs. Supprime la fiche d'un sujet abattu/vendu (le lot, lui, se gère dans l'onglet Bébé).</p>
          </>}

          {secI === "repro" && <>
            <h2 className="text-lg font-semibold mb-3">🐓 Reproducteurs <span className="text-sm font-normal text-slate-400">(adultes → bague {espI === "caille" ? "8" : "16"} mm)</span></h2>
            {reprosEsp.length === 0
              ? <p className="text-sm text-slate-400">Aucun reproducteur actif de cette espèce.</p>
              : <Table
                  resume={(r, k) => { const x = reprosEsp[k].r; return <><span className="font-medium">{x.nom}</span> · {x.espece}{x.bagueCouleur ? " · bague " + x.bagueCouleur : " · à baguer"}</>; }}
                  columns={["Nom", "Espèce", "Race", "Taille", "Couleur", "N° bague"]}
                  rows={reprosEsp.map(({ r, i }) => [

                      <select className={selCls} value={r.bagueCouleur || ""} onChange={(e) => patchLigne("reproducteurs", i, { bagueCouleur: e.target.value })}>

                        {couleursPour(espI === "caille" ? "8" : "16", r.bagueCouleur).map((c) => <option key={c} value={c}>{c}</option>)}
                      </select>
                      <PastilleBague couleur={r.bagueCouleur} />
                    </span>,
                    <input className={selCls + " w-24"} value={r.bagueNum || ""} onChange={(e) => patchLigne("reproducteurs", i, { bagueNum: e.target.value })} placeholder="n°" />,
                  ])}
                />}
          </>}
        </div>
      );
    }

    function GestionPoulaillers() {
      const { poulaillers, poussins, config, majLigne, supprimerLigne, patchLigne, ajouterPoulailler } = useData();
      const [vue, setVue] = useState("soins");   // onglet interne : soins | bebe | rappels | journal
      const [open, setOpen] = useState(false);
      const [edit, setEdit] = useState(null);
      const [bebeLot, setBebeLot] = useState(null);   // lot pré-sélectionné quand on ouvre l'onglet Bébé
      const today = AUJOURDHUI.toISOString().slice(0, 10);

      const nettoyages = nettoyagesAPrevoir(poulaillers, config);
      const rappelsIA = rappelsIntelligents(poulaillers, config);
      const retard = rappelsIA.filter(r => r.code === "retard");          // vrais retards (date dépassée)
      const duJour = rappelsIA.filter(r => r.code === "aujourdhui");
      const aPlanifier = rappelsIA.filter(r => r.code === "jamais");      // jamais fait = à planifier, PAS une alerte
      // Rappels manuels (date de rappel posée à la main), hors nettoyage
      const rappels = poulaillers
        .map((p, i) => ({ p, i }))
        .filter(x => x.p.rappel && !ligneFaitAction(x.p, "nettoyage"))
        .sort((a, b) => a.p.rappel.localeCompare(b.p.rappel));

      const lignes = poulaillers.map((p, i) => ({ p, i })).sort((a, b) => b.p.date.localeCompare(a.p.date));

      // Zones de soin ADULTES = zones avec fréquence de nettoyage, hors zones de jeunes (gérées dans Poussins)
      const intervNorm = {};
      Object.keys(config.intervalleNettoyage || {}).forEach((k) => { intervNorm[normLibelle(k)] = config.intervalleNettoyage[k]; });
      const zonesSoin = (config.zones || []).filter((z) => intervNorm[normLibelle(z)] && !estZoneJeune(z, config));

      // Coche rapide d'un soin pour aujourd'hui (crée ou met à jour la ligne du jour de la zone)
      const faitAujourdhui = (zone, key) => poulaillers.some(p => p.date === today && normLibelle(p.zone) === normLibelle(zone) && ligneFaitAction(p, key));
      // PAS de propagation enclos adultes → bébés : nettoyer le poulailler des reproducteurs
      // n'est PAS nettoyer l'espace des poussins. Les bébés ont leurs propres cases ci-dessous.
      function toggleSoin(zone, key) {
        const idx = poulaillers.findIndex(p => p.date === today && normLibelle(p.zone) === normLibelle(zone) && p.coches && !p.action);
        if (idx >= 0) {
          const p = poulaillers[idx];
          patchLigne("poulaillers", idx, { coches: { ...(p.coches || {}), [key]: !(p.coches || {})[key] } });
        } else {
          ajouterPoulailler({ date: today, zone, coches: { [key]: true }, obs: "" });
        }
      }
      // Soin du jour des BÉBÉS par lot — écrit dans p.jours[jour], le MÊME stock que l'onglet
      // Bébé (S1-S8 / J1-J10) → cocher ici = cocher là-bas, instantanément.
      const jeunesActifs = poussins.map((p, i) => ({ p, i })).filter(({ p }) => p.statut === "en croissance");
      const jourBebe = (p) => { const a = ageJeune(p.date); return (a.jours == null || a.futur) ? null : (a.jours + 1); };
      const bebeFait = (p, key) => { const n = jourBebe(p); return n == null ? false : !!(((p.jours || {})[n] || {})[key]); };
      const toggleBebe = (i, p, key) => {
        const n = jourBebe(p); if (n == null) return;
        const d = (p.jours || {})[n] || {};
        patchLigne("poussins", i, { jours: { ...(p.jours || {}), [n]: { ...d, [key]: !d[key] } } });
      };
      const ouvrirBebe = (i) => { setBebeLot(i); setVue("bebe"); };   // accès direct au lot dans l'onglet Bébé
      const actionsLabel = (p) => { const d = ACTIONS_COCHES.filter(a => ligneFaitAction(p, a.key)); return d.length ? d.map(a => a.label).join(", ") : (p.action || "Rappel"); };
      const th = (p) => [p.temperature !== "" && p.temperature != null ? p.temperature + "°" : null, p.humidite !== "" && p.humidite != null ? p.humidite + "%" : null].filter(Boolean).join(" · ") || "—";

      return (
        <div>
          <PageHeader
            title="Gestion du poulailler"
            subtitle="Tout au même endroit : reproducteurs, animaux à grossir et bébés. Soins, nettoyage et traitements mutualisés."
            action={vue !== "bebe" ? <AddButton onClick={() => setOpen(true)} label="Ajouter une action" /> : null}
          />

          {/* Onglets internes */}
          <div className="flex gap-1.5 mb-6 flex-wrap border-b border-slate-200">
            {[["soins", "🩺 Soin du jour"], ["bebe", "🐥 Bébé"], ["identif", "🏷️ Identification"], ["rappels", "🔔 Rappel" + ((retard.length + duJour.length) ? " · " + (retard.length + duJour.length) : "")], ["journal", "📜 Journal"]].map(([id, lbl]) => (
              <button key={id} onClick={() => setVue(id)}
                className={"px-3 py-2 text-sm font-medium -mb-px border-b-2 whitespace-nowrap " + (vue === id ? "border-emerald-600 text-emerald-700" : "border-transparent text-slate-500 hover:text-slate-700")}>{lbl}</button>
            ))}
          </div>

          {vue === "soins" && <>
          {/* Soin rapide du jour par zone (cases à cocher) — eau / nourriture / nettoyage,
              + « Restes » réservés aux reproducteurs poules. Les traitements (Fortiferm/Cocciferm/
              Vermiferm) sont volontairement absents ici : ils se saisissent dans le Journal. */}
          <h2 className="text-lg font-semibold mb-3">Soin du jour — {frDate(today)}</h2>
          {/* Zones adultes regroupées PAR ESPÈCE : les poules d'un côté, les cailles de l'autre
              (les bébés — poussins & cailleteaux — ont leur propre section plus bas, par lot). */}
          {[["poule", "🐔 Poules"], ["caille", "🐦 Cailles"], ["autre", "📍 Autres zones"]].map(([esp, titre]) => {
            const zs = zonesSoin.filter((z) => especeZone(z, config) === esp);
            if (!zs.length) return null;
            return (
              <div key={esp} className="mb-5">
                <h3 className="text-sm font-semibold text-slate-500 mb-2">{titre}</h3>
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                  {zs.map((zone) => {
                    const restesOk = !(config.restesInterdits || []).map(normLibelle).includes(normLibelle(zone));
                    const quick = ACTIONS_COCHES.filter(a => ["eau", "nourriture", "nettoyage"].includes(a.key) || (a.key === "restes" && restesOk));
                    return (
                      <div key={zone} className="bg-white rounded-xl shadow-sm border border-slate-100 p-4">
                        <p className="text-sm font-medium text-slate-700 mb-2">{emojiZone(zone, config)} {zone}</p>
                        <div className="flex flex-wrap gap-2">
                          {quick.map((a) => {
                            const on = faitAujourdhui(zone, a.key);
                            return (
                              <button key={a.key} onClick={() => toggleSoin(zone, a.key)}
                                className={"px-2.5 py-1 rounded-full text-xs font-medium border " + (on ? "bg-emerald-100 text-emerald-700 border-emerald-300" : "bg-white text-slate-500 border-slate-300 hover:bg-slate-50")}>
                                {on ? "✓ " : ""}{a.icone} {a.label}
                              </button>
                            );
                          })}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}
          <p className="text-xs text-slate-400 mb-6">Les traitements (Fortiferm, Cocciferm, Vermiferm) et leurs quantités se notent dans le <span className="font-medium">Journal</span> (bouton « Ajouter une action »). Les cases ci-dessus ne concernent QUE les adultes — les bébés ont leurs propres cases ci-dessous.</p>

          {/* Soin du jour des BÉBÉS — une case par lot, reliée au suivi (S1-S8 / J1-J10) de l'onglet Bébé */}
          {jeunesActifs.length > 0 && <>
            <h2 className="text-lg font-semibold mb-3">🐥 Bébés — soin du jour (par lot)</h2>
            {/* Lots de jeunes regroupés PAR ESPÈCE : poussins (poules) ≠ cailleteaux (cailles) */}
            {[["poule", "🐤 Poussins (bébés poules)"], ["caille", "🐥 Cailleteaux (bébés cailles)"]].map(([esp, titre]) => {
              const lots = jeunesActifs.filter(({ p }) => (p.espece === "caille" ? "caille" : "poule") === esp);
              if (!lots.length) return null;
              return (
                <div key={esp} className="mb-4">
                  <h3 className="text-sm font-semibold text-slate-500 mb-2">{titre} <span className="font-normal text-slate-400">· {lots.length} lot{lots.length > 1 ? "s" : ""}</span></h3>
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    {lots.map(({ p, i }) => {
                      const n = jourBebe(p);
                      return (
                        <div key={i} className="bg-white rounded-xl shadow-sm border border-slate-100 p-4">
                          <div className="flex items-center justify-between gap-2 mb-2">
                            <p className="text-sm font-medium text-slate-700 min-w-0 truncate">{p.id || labelJeune(p.espece)} <span className="font-normal text-slate-400">· {labelJeune(p.espece)}{n != null ? " · J" + n : ""}</span></p>
                            <button onClick={() => ouvrirBebe(i)} className="text-xs text-emerald-600 hover:underline whitespace-nowrap shrink-0">→ Bébé</button>
                          </div>
                          {n == null
                            ? <p className="text-xs text-slate-400">Hors fenêtre de suivi.</p>
                            : <div className="flex flex-wrap gap-2">
                                {[["eau", "💧 Eau"], ["nourriture", "🌾 Nourriture"], ["nettoyage", "🧹 Nettoyage"]].map(([k, lbl]) => {
                                  const on = bebeFait(p, k);
                                  return (
                                    <button key={k} onClick={() => toggleBebe(i, p, k)}
                                      className={"px-2.5 py-1 rounded-full text-xs font-medium border " + (on ? "bg-emerald-100 text-emerald-700 border-emerald-300" : "bg-white text-slate-500 border-slate-300 hover:bg-slate-50")}>
                                      {on ? "✓ " : ""}{lbl}
                                    </button>
                                  );
                                })}
                              </div>}
                        </div>
                      );
                    })}
                  </div>
                </div>
              );
            })}
            <p className="text-xs text-slate-400 mb-6">Une coche ici remplit directement le jour correspondant du lot dans l'onglet <span className="font-medium">Bébé</span> (suivi S1-S8) — et inversement. Ces cases sont indépendantes des enclos adultes. « → Bébé » ouvre le suivi détaillé (température, mortalité…).</p>
          </>}

    // Pastille de statut (reproducteurs & abattoir)

    /* ---------- Poussins / cailleteaux ---------- */
    // Badge d'étape automatique selon l'âge (depuis la naissance)
    function EtapeJeune({ birthDate }) {
      const a = ageJeune(birthDate);
      if (a.futur) return <span className="px-2 py-0.5 rounded-full text-xs font-medium bg-red-100 text-red-700">⚠️ date future</span>;
      if (!a.etape) return <span className="text-slate-300">—</span>;

    }

    // Code court d'un croisement supposé : « Marans × Sussex » → « MAR×SUS » (3 lettres de chaque côté)
    function codeCroisement(nom) {
      const parts = String(nom || "").split(/[x×]/i).map((s) => s.trim()).filter(Boolean);
      const abr = (s) => s.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-zA-Z]/g, "").slice(0, 3).toUpperCase() || "?";
      if (parts.length < 2) return abr(parts[0] || nom);
      return abr(parts[0]) + "×" + abr(parts[1]);
    }
    // Croisements possibles pour un lot de jeunes, calculés depuis MES reproducteurs actifs :
    // chaque mâle × chaque race de femelle (de la même espèce que le lot).
    function suggestionsCroisements(reproducteurs, especeLot) {
      const grpLot = especeLot === "caille" ? "caille" : "poule";
      const grpDe = (esp) => ((esp || "").includes("caille") ? "caille" : "poule");
      const actifs = (reproducteurs || []).filter((r) => r.statut === "actif" && r.race && grpDe(r.espece) === grpLot);
      const males = actifs.filter((r) => r.espece === "coq" || r.espece === "caille mâle");
      const femRaces = Array.from(new Set(actifs.filter((r) => r.espece === "poule" || r.espece === "caille femelle").map((r) => r.race)));
      const out = [];
      males.forEach((m) => femRaces.forEach((f) => { const nom = m.race + " × " + f; if (!out.includes(nom)) out.push(nom); }));
      return out;
    }
    // Pastille d'un croisement supposé : code court + nombre éventuel (nom complet au survol)
    function BadgeCroisement({ c }) {
      return (
        <span title={c.nom + (c.nombre ? " — " + c.nombre + " jeune(s)" : "")}
          className="px-2 py-0.5 rounded-full text-xs font-medium bg-purple-100 text-purple-700 whitespace-nowrap">
          🧬 {codeCroisement(c.nom)}{c.nombre ? " ×" + c.nombre : ""}
        </span>
      );
    }

            <input className={inputClass} list="poussin-lignees-list" value={lignee} onChange={(e) => setLignee(e.target.value)} placeholder="ex. lignée des parents (Cléo × Daphnis)" />
            <datalist id="poussin-lignees-list">{ligneesConnues.map((l) => <option key={l} value={l} />)}</datalist>

          <div>

            {croisements.map((c, k) => (
              <div key={k} className="flex gap-2 mb-2">
                <input list="croisements-sugg-list" className={inputClass + " flex-1 min-w-0"} value={c.nom}
                  onChange={(e) => majCrois(k, "nom", e.target.value)} placeholder="ex. Marans × Sussex" />
                <input type="number" min="0" className={inputClass + " w-20"} value={c.nombre}
                  onChange={(e) => majCrois(k, "nombre", e.target.value)} placeholder="nb" title="Nombre de jeunes concernés (facultatif)" />

            <p className="text-xs text-slate-400 mt-1">Choisis dans la liste (croisements possibles avec tes reproducteurs) ou écris librement. Le lot affiche un code court, ex. <span className="font-medium">MAR×SUS</span> = Marans × Sussex.</p>
          </div>

            <textarea className={inputClass} rows="2" value={obs} onChange={(e) => setObs(e.target.value)} />
          </Field>
          <FormButtons onClose={onClose} />

    // Décale une date ISO de n jours
    function dateDecalee(iso, n) {
      const d = new Date(String(iso).slice(0, 10)); d.setDate(d.getDate() + n);
      return d.toISOString().slice(0, 10);
    }

    // Soins & traitements d'un LOT de jeunes (poussins/cailleteaux), calculés par lot jusqu'à nS semaines.
    // Renvoie l'âge, le volume d'abreuvoir, la dose, et l'état nettoyage + Fortiferm/Cocciferm/Vermiferm.
    function soinsJeuneLot(p, config) {
      const a = ageJeune(p.date);
      const nS = (config.jeunes && config.jeunes.suiviSemaines) || 8;
      // Lot « actif » pour les rappels : en croissance ET dans la fenêtre 0 → nS semaines (8 sem par défaut)
      const actif = p.statut === "en croissance" && a.jours != null && !a.futur && a.jours <= nS * 7;
      const volume = volumeAbreuvoirJeune(config, p);
      const dose = doseTraitement(config, volume);
      const fj = config.freqJeunes || {};
      // Dernier nettoyage = jour coché le plus récent dans p.jours
      let dernierNett = null;
      Object.keys(p.jours || {}).forEach((n) => {
        const d = (p.jours || {})[n];
        if (d && d.nettoyage) { const dt = dateDecalee(p.date, Number(n) - 1); if (!dernierNett || dt > dernierNett) dernierNett = dt; }
      });
      const calc = (dernier, freq) => {
        if (!freq) return { code: "off", dernier, freq, prochain: null, reste: null };
        if (!dernier) return { code: "jamais", dernier: null, freq, prochain: null, reste: null };
        const ecoules = joursDepuis(dernier);
        const reste = freq - ecoules;
        return { code: reste < 0 ? "retard" : (reste === 0 ? "aujourdhui" : "avenir"), dernier, freq, prochain: dateDecalee(dernier, freq), reste };
      };
      const tr = p.traitements || {};
      return {
        age: a, actif, volume, dose,
        nettoyage: calc(dernierNett, fj.nettoyage),
        fortiferm: calc(tr.fortiferm || null, fj.fortiferm),
        cocciferm: calc(tr.cocciferm || null, fj.cocciferm),
        vermiferm: calc(tr.vermiferm || null, fj.vermiferm),
      };
    }

    // Formulaire détail d'un jour de suivi (J1–J10)

      const sem = Math.floor((jour - 1) / 7) + 1;
      function submit(e) {
        e.preventDefault();

          ...d, eau, nourriture, nettoyage,
          temp: temp === "" ? "" : Number(temp), humidite: humidite === "" ? "" : Number(humidite),
          vivants: vivants === "" ? "" : Number(vivants), morts: Number(morts) || 0,
          comportement: comportement.trim(), alimentation: alimentation.trim(), obs: obs.trim(), probleme: probleme.trim(),
        };
        patchLigne("poussins", lotIndex, { jours: { ...(p.jours || {}), [jour]: maj } });
        onClose();
      }
      const chkLbl = (on, set, txt) => (
        <label className={"flex items-center gap-2 text-sm px-3 py-2 rounded-lg border cursor-pointer " + (on ? "bg-emerald-50 border-emerald-300 text-emerald-800" : "border-slate-200 hover:bg-slate-50")}>
          <input type="checkbox" checked={on} onChange={(e) => set(e.target.checked)} className="w-4 h-4" /><span>{txt}</span>
        </label>
      );
      return (
        <form onSubmit={submit} className="space-y-3">
          <p className="text-sm text-slate-500">S{sem} · J {jour} · {frDate(dateDecalee(p.date, jour - 1))}</p>
