    // Nombre d'œufs récoltés (tous destinations) d'une collecte — gère ancien + nouveau modèle.
    function nbRecolte(c) { return c.destination ? (Number(c.nombre) || 0) : (Number(c.recoltes) || 0); }
    // Taux de ponte d'une espèce sur les `jours` derniers jours = œufs / (pondeuses × jours).
    function tauxPonte(collectes, espece, pondeuses, jours, finISO) {
      if (!pondeuses || !jours) return null;
      const fin = finISO || AUJOURDHUI_ISO;
      const debut = dateDecalee(fin, -(jours - 1));
      let oeufs = 0;
      collectes.forEach((c) => {
        if (c.espece !== espece) return;
        const d = (c.date || "").slice(0, 10);
        if (d >= debut && d <= fin) oeufs += nbRecolte(c);
      });
      return { oeufs, jours, pondeuses, taux: oeufs / (pondeuses * jours) };
    }
    // Prévision de ponte selon l'ÂGE des pondeuses (seuils config.agesRepro) × ponte de leur race.
    // Facteur d'âge : trop jeune 0 · âge optimal 1 · déclin 0,7 · âgée 0,4. Race inconnue → base
    // moyenne (poule 250 œufs/an, caille 300). Renvoie { oeufsJour, nb, detail:[{nom,n,facteur,parJour}] }.
    function previsionPonte(reproducteurs, races, config, grp) {
      const espF = grp === "caille" ? "caille femelle" : "poule";
      const cherche = (nom) => races.find((r) => r.race === nom) || races.find((r) => splitRaceCouleur(r.race).base === nom) || null;
      let oeufsJour = 0, nb = 0; const detail = [];
      (reproducteurs || []).filter((r) => r.statut === "actif" && r.espece === espF).forEach((r) => {
        const n = Math.max(1, Number(r.nombre) || 1);
        nb += n;
        const a = alerteAgeRepro(r, config);
        const facteur = !a ? 1 : (a.code === "jeune" ? 0 : (a.code === "optimal" ? 1 : (a.code === "declin" ? 0.7 : 0.4)));
        const race = cherche(r.race || "");
        const ponteAn = (race && Number(race.ponte_moyenne_an)) || (grp === "caille" ? 300 : 250);
        const parJour = (ponteAn / 365) * facteur * n;
        oeufsJour += parJour;
        detail.push({ nom: r.nom || "(lot)", n, facteur, parJour, age: a ? a.code : null });
      });
      return { oeufsJour, nb, detail };
    }
    // Date d'abattage SUGGÉRÉE d'un lot de consommation : naissance + config.agesAbattage (semaines)
    function abattageSuggere(a, config) {
      if (!a.naissance) return null;
      const sem = ((config && config.agesAbattage) || {})[a.espece === "caille" ? "caille" : "poule"] || (a.espece === "caille" ? 8 : 18);
      return dateDecalee(a.naissance, sem * 7);
    }
    // REGISTRE D'ÉLEVAGE : événements réglementaires reconstruits depuis les données existantes —
    // entrées (naissances, achats), sorties (abattages), mortalité (jeunes + reproducteurs),
    // traitements (soins des zones + traitements des lots de jeunes). Tri du plus récent au plus ancien.
    function lignesRegistre({ poussins, reproducteurs, abattoir, poulaillers, breederPurchases }) {
      const out = [];
      const push = (date, cat, nature, espece, nombre, detail) => { if (date) out.push({ date: String(date).slice(0, 10), cat, nature, espece: espece || "—", nombre: (nombre === "" || nombre == null) ? "" : Number(nombre) || 0, detail: detail || "" }); };
      const espJ = (p) => (p.espece === "caille" ? "caille" : "poule");
      const lblTrait = (k) => ((ACTIONS_COCHES.find((a) => a.key === k) || {}).label || k);
      (poussins || []).forEach((p) => {
        push(p.date, "Entrée", "Naissance", espJ(p), p.nes !== "" && p.nes != null ? p.nes : p.nombre, "Lot " + (p.id || "—"));
        Object.keys(p.jours || {}).forEach((n) => {
          const m = Number(((p.jours || {})[n] || {}).morts) || 0;
          if (m > 0) push(dateDecalee(p.date, Number(n) - 1), "Mortalité", "Perte jeunes", espJ(p), m, "Lot " + (p.id || "—") + " · J" + n);
        });
        Object.keys(p.traitements || {}).forEach((k) => push(p.traitements[k], "Traitement", lblTrait(k), espJ(p), "", "Lot " + (p.id || "—") + " (jeunes)"));
      });
      (breederPurchases || []).forEach((b) => push(b.date, "Entrée", "Achat", b.espece, b.nombre, (b.type || "achat") + (b.fournisseur ? " — " + b.fournisseur : "")));
      (abattoir || []).forEach((a) => { if (a.abattageReel) push(a.abattageReel, "Sortie", "Abattage", a.espece, a.nombre, "Lot " + (a.lot || "—")); });
      (reproducteurs || []).forEach((r) => { if (r.statut === "décédé" && r.dateFin) push(r.dateFin, "Mortalité", "Décès reproducteur", r.espece, r.nombre || 1, r.nom || ""); });
      (poulaillers || []).forEach((pl) => {
        TRAITEMENTS.filter((k) => ligneFaitAction(pl, k)).forEach((k) => {
          const q = pl.quantites && pl.quantites[k];
          push(pl.date, "Traitement", lblTrait(k), "—", "", (pl.zone || "") + (q !== "" && q != null ? " · " + q + " ml" : ""));
        });
      });
      out.sort((a, b) => b.date.localeCompare(a.date));
      return out;
    }
    // Impression du registre (fenêtre dédiée → PDF via « imprimer »)
    function imprimerRegistre(lignes, config) {
      const el = (config && config.elevage) || {};
      const esc = (s) => String(s == null ? "" : s).replace(/</g, "&lt;");
      const rows = lignes.map((l) => "<tr><td>" + frDate(l.date) + "</td><td>" + esc(l.cat) + "</td><td>" + esc(l.nature) + "</td><td>" + esc(l.espece) + "</td><td>" + (l.nombre === "" ? "" : l.nombre) + "</td><td>" + esc(l.detail) + "</td></tr>").join("");
      const w = window.open("", "_blank");
      if (!w) { alert("Autorise les fenêtres pop-up pour imprimer le registre."); return; }
      w.document.write("<html><head><title>Registre d'élevage</title><style>body{font-family:-apple-system,Segoe UI,sans-serif;font-size:12px;margin:24px;color:#0f172a}h1{font-size:18px;margin:0 0 4px}p{color:#475569;margin:2px 0}table{width:100%;border-collapse:collapse;margin-top:12px}td,th{border:1px solid #cbd5e1;padding:4px 6px;text-align:left;vertical-align:top}th{background:#f1f5f9}</style></head><body>" +
        "<h1>Registre d'élevage</h1>" +
        "<p>" + esc(el.nom || "") + (el.detenteur ? " — détenteur : " + esc(el.detenteur) : "") + "</p>" +
        (el.adresse ? "<p>" + esc(el.adresse) + "</p>" : "") +
        "<p>Édité le " + frDate(new Date().toISOString().slice(0, 10)) + " · " + lignes.length + " événement(s)</p>" +
        "<table><thead><tr><th>Date</th><th>Catégorie</th><th>Nature</th><th>Espèce</th><th>Nb</th><th>Détail</th></tr></thead><tbody>" + rows + "</tbody></table>" +
        "</body></html>");
      w.document.close(); w.focus();
      setTimeout(() => w.print(), 300);
    }
    // Lignées « à risque » de consanguinité : lignées (non vides) ayant ≥ 2 reproducteurs ACTIFS
    // → à ne pas accoupler entre eux. Renvoie [{ lignee, noms:[] }].
    function ligneesRisque(reproducteurs) {
      const par = {};
      reproducteurs.forEach((r) => {
        if (r.statut !== "actif") return;
        const lg = (r.lignee || "").trim();
        if (!lg) return;
        (par[lg] = par[lg] || []).push(r.nom || r.espece || "?");
      });
      return Object.keys(par).filter((lg) => par[lg].length >= 2).map((lg) => ({ lignee: lg, noms: par[lg] }));
    }

    /* ============================================================
       PAGES
       ============================================================ */
    function Dashboard() {
      const { lots, suivis, consommables, materiel, poulaillers, config, collectes, poussins, reproducteurs, abattoir, lotsStock, breederPurchases, races } = useData();
      const allerA = useContext(NavContext);
      const sc = statsConsommables(consommables);
      const sm = statsMateriel(materiel);
      const today = AUJOURDHUI.toISOString().slice(0, 10);

      // --- Aperçu calendrier : événements d'aujourd'hui + 7 prochains jours (mêmes données que la page Calendrier) ---
      const evCal = evenementsCalendrier({ lots, poulaillers, poussins, reproducteurs, abattoir }, config);
      const semaine = [];
      for (let k = 0; k <= 7; k++) {
        const d = dateDecalee(today, k);
        if ((evCal[d] || []).length) semaine.push({ date: d, evs: evCal[d] });
      }
      const nbEvSemaine = semaine.reduce((s, j) => s + j.evs.length, 0);

      // --- Tâches du jour (poulaillers : nettoyages + rappels) ---
      const np = nettoyagesAPrevoir(poulaillers, config);
      const rIA = rappelsIntelligents(poulaillers, config);
      const rIAnz = rIA.filter(r => r.action !== "nettoyage");  // le nettoyage est géré par les cartes np
      const rappelsManuels = poulaillers.filter(p => p.rappel && !ligneFaitAction(p, "nettoyage"));
      // « Jamais fait » N'EST PAS un retard (zone existante mais jamais traitée → à planifier, pas une alerte).
      const enRetard = []
        .concat(np.filter(n => n.code === "retard").map(n => "Nettoyer " + n.zone + " (retard " + (-n.reste) + " j)"))
        .concat(rIAnz.filter(r => r.code === "retard").map(r => r.label + " — " + r.zone + " (retard " + (-r.reste) + " j)"))
        .concat(rappelsManuels.filter(r => r.rappel < today).map(r => "Rappel — " + r.zone + " (" + frDate(r.rappel) + ")"));
      const aFaire = []
        .concat(np.filter(n => n.code === "bientot").map(n => "Nettoyer " + n.zone))
        .concat(rIAnz.filter(r => r.code === "aujourdhui").map(r => r.label + " — " + r.zone))
        .concat(rappelsManuels.filter(r => r.rappel === today).map(r => "Rappel — " + r.zone));
      const aVenir = rIAnz.filter(r => r.code === "avenir").sort((a, b) => (a.prochain || "").localeCompare(b.prochain || ""))
        .map(r => r.label + " — " + r.zone + " (" + frDate(r.prochain) + ")")
        .concat(rappelsManuels.filter(r => r.rappel > today).sort((a, b) => a.rappel.localeCompare(b.rappel)).map(r => "Rappel — " + r.zone + " (" + frDate(r.rappel) + ")"))
        .slice(0, 8);

      // --- Rappel récolte des œufs pour la PROCHAINE couvée, par couveuse (cailles / poules séparées) ---
      // On doit commencer à récolter ~14 j (conservation max) avant l'éclosion, en intégrant une marge
      // (l'éclosion peut déborder de quelques jours). Début = durée − conservation + delta (ex. poule 21−14+2 = J9).
      const conservationOeufs = Number(config.conservationOeufs) || 14;
      const deltaEclosion = Number(config.deltaEclosion) || 0;
      const recolteAVenir = [];   // débuts de récolte futurs → « Prochains rappels »
      lots.filter(l => l.statut === "en couveuse" && l.dateDebut).forEach(l => {
        const duree = DUREE[l.espece] || 21;
        const jour = joursDepuis(l.dateDebut);
        if (jour == null || jour < 0) return;
        const debutRecolte = Math.max(0, duree - conservationOeufs + deltaEclosion);   // même calcul que le Calendrier
        const finRecolte = duree + deltaEclosion;                       // jusqu'à l'éclosion (+ marge)
        const dateDebutRecolte = dateDecalee(l.dateDebut, debutRecolte);
        if (jour === debutRecolte) {
          aFaire.push("🥚 Récolte prochaine couvée — " + couveuseLbl(l.couveuse) + " (" + l.espece + ") : COMMENCE AUJOURD'HUI — ramasse les œufs pour la relance (conservation < " + conservationOeufs + " j)");
        } else if (jour > debutRecolte && jour <= finRecolte) {
          aFaire.push("🥚 Récolte prochaine couvée en cours — " + couveuseLbl(l.couveuse) + " (" + l.espece + ", J" + jour + "/" + duree + ") : continue de ramasser (depuis le " + frDate(dateDebutRecolte) + ")");
        } else if (jour < debutRecolte) {
          recolteAVenir.push("🥚 Début récolte prochaine couvée — " + couveuseLbl(l.couveuse) + " (" + l.espece + ") le " + frDate(dateDebutRecolte));
        }
      });
      recolteAVenir.forEach(m => aVenir.push(m));   // visibles dans « Prochains rappels »

      // --- Alertes ---
      // Seuls les articles à racheter ET marqués « urgent » remontent en alerte importante (les autres restent dans l'inventaire).
      const stocksUrgents = sc.parArticle.filter(a => a.bas && articleEstUrgent(config, a.article) && !articleEstMasque(config, a.article)).map(a => a.article + " (" + a.stock + " " + a.unite + ")");
      // Matériel : seules les lignes marquées ⭐ urgent remontent en alerte importante (comme les
      // consommables) ; le reste est visible dans Inventaire matériel → À traiter. « (1/8) » = 1 unité sur 8.
      const libMat = ({ m, nb, q }, suffixe) => m.article + (q > 1 ? " (" + nb + "/" + q + ")" : "") + " — " + suffixe;
      const materielTraiter = []
        .concat(sm.aReparer.filter(x => x.m.urgent).map(x => libMat(x, "à réparer")))
        .concat(sm.aRemplacer.filter(x => x.m.urgent).map(x => libMat(x, "à remplacer")))
        .concat(sm.horsService.filter(x => x.m.urgent).map(x => libMat(x, "hors service")))
        .concat(sm.sousSeuil.filter(x => x.m.urgent).map(x => x.m.article + " — " + x.marche + " en état de marche (seuil " + x.m.seuil + ")"));
      // Alertes d'âge des reproducteurs actifs (trop jeunes ou âgés)
      const alertesRepro = reproducteurs
        .filter(r => r.statut === "actif")
        .map(r => ({ r, a: alerteAgeRepro(r, config) }))
        .filter(x => x.a && (x.a.code === "jeune" || x.a.code === "age"))
        .map(x => x.r.nom + " (" + x.r.espece + ") — " + x.a.label);
      // Alerte planning : incubations poule et caille programmées à moins de 4 jours d'écart
      const enCouveuse = lots.filter(l => l.statut === "en couveuse" && l.dateDebut);
      const ecartCouvaison = [];
      enCouveuse.filter(l => l.espece === "poule").forEach((lp) => {
        enCouveuse.filter(l => l.espece === "caille").forEach((lc) => {
          const d = Math.abs(Math.round((Date.parse(lp.dateDebut) - Date.parse(lc.dateDebut)) / 86400000));
          if (d < 4) ecartCouvaison.push(lp.id + " (poule) & " + lc.id + " (caille) : " + d + " j d'écart — viser ≥ 4 j");
        });
      });
      // Alertes couvaison : relevés hors normes / norme manquante / jour hors durée (lots en couveuse)
      const alertesCouv = [];
      lots.filter(l => l.statut === "en couveuse").forEach((l) => {
        const releves = suivis.filter(s => s.lot === l.id).slice().sort((a, b) => a.jour - b.jour);
        alertesCouvaison(l, releves, config).alertes.forEach((m) => alertesCouv.push(l.id + " : " + m));
      });
      // --- Taux de ponte (7 derniers jours) + détection de baisse vs les 7 jours précédents ---
      const chept = config.cheptel || cheptel;
      const pontePoule7 = tauxPonte(collectes, "poule", chept.poules, 7);
      const ponteCaille7 = tauxPonte(collectes, "caille", chept.caillesF, 7);
      const pontePoulePrev = tauxPonte(collectes, "poule", chept.poules, 7, dateDecalee(AUJOURDHUI_ISO, -7));
      const ponteCaillePrev = tauxPonte(collectes, "caille", chept.caillesF, 7, dateDecalee(AUJOURDHUI_ISO, -7));
      const baissePonte = [];
      const checkBaisse = (cur, prev, nom) => { if (cur && prev && prev.taux > 0 && cur.taux < prev.taux * 0.7) baissePonte.push("Baisse de ponte " + nom + " : " + Math.round(cur.taux * 100) + " %/j vs " + Math.round(prev.taux * 100) + " %/j"); };
      checkBaisse(pontePoule7, pontePoulePrev, "poules");
      checkBaisse(ponteCaille7, ponteCaillePrev, "cailles");

      // --- Lignées à risque de consanguinité (≥ 2 reproducteurs actifs d'une même lignée) ---
      const alertesLignee = ligneesRisque(reproducteurs).map((g) => g.lignee + " : " + g.noms.join(", ") + " — éviter de les accoupler");

      const nbAlertes = enRetard.length + stocksUrgents.length + materielTraiter.length + alertesRepro.length + ecartCouvaison.length + alertesCouv.length + baissePonte.length + alertesLignee.length;

      // --- Œufs / récolte ---
      const so = statsOeufs(collectes, lotsStock, lots, config);
      const batchesD = lotsStock.map((b) => agregLotStock(b, collectes));

      // --- Coûts & rentabilité (année en cours) ---
      const anStr = String(ANNEE_COURANTE);
      const estAn = (d) => (d || "").slice(0, 4) === anStr;
      const depConsoAn = (statsConsommables(consommables).depAnnee || {})[anStr] || 0;   // aliment + conso
      const depMatAn = statsMateriel(materiel).depenseAnneeCourante || 0;
      const depReproAn = (breederPurchases || []).filter((a) => estAn(a.date)).reduce((s, a) => s + Math.max(0, (Number(a.prixTotal) || 0) - (Number(a.remise) || 0)), 0);
      const totalDepAn = depConsoAn + depMatAn + depReproAn;
      const oeufsAn = collectes.filter((c) => estAn(c.date)).reduce((s, c) => s + nbRecolte(c), 0);
      const poussinsNesAn = poussins.filter((p) => estAn(p.date)).reduce((s, p) => s + (Number(p.nes != null && p.nes !== "" ? p.nes : p.nombre) || 0), 0);
      const prixOeuf = Number(config.prixOeuf) || 0;
      const coutParOeuf = oeufsAn > 0 ? depConsoAn / oeufsAn : null;          // coût aliment par œuf récolté
      const coutParPoussin = poussinsNesAn > 0 ? totalDepAn / poussinsNesAn : null;
      const valeurOeufsAn = oeufsAn * prixOeuf;

      // --- Animaux ---
      const lotsActifs = lots.filter(l => l.statut !== "terminé");
      const reproParStatut = (st) => reproducteurs.filter(r => r.statut === st).reduce((s, r) => s + (Number(r.nombre) || 1), 0);
      const reproActifs = reproParStatut("actif");
      const reproMalades = reproParStatut("malade");
      const reproDecedes = reproParStatut("décédé");
      const reproRetraites = reproParStatut("retiré reproduction");
      const consoTotal = abattoir.reduce((s, a) => s + (Number(a.nombre) || 0), 0);

      // --- Poussins / cailleteaux (séparés) ---
      const jeunesActifs = poussins.map((p, i) => ({ p, i })).filter(({ p }) => p.statut === "en croissance");
      const jeunesPoussins = jeunesActifs.filter(({ p }) => p.espece !== "caille");
      const jeunesCailleteaux = jeunesActifs.filter(({ p }) => p.espece === "caille");
      const vivants = (arr) => arr.reduce((s, { p }) => s + (Number(p.nombre) || 0), 0);
      const morts = (arr) => arr.reduce((s, { p }) => s + (Number(p.morts) || 0), 0);
      const nJ = (config.jeunes && config.jeunes.suiviJours) || 10;
      const nS = (config.jeunes && config.jeunes.suiviSemaines) || 8;
      // Alertes + tâches du jour des jeunes
      const alJeune = [], tachesJeunes = [];
      jeunesActifs.forEach(({ p }) => {
        const a = ageJeune(p.date);
        const nom = (p.id || labelJeune(p.espece));
        if (a.futur) { alJeune.push("⚠️ Date incohérente : " + nom + " (naissance future)"); return; }
        if (a.jours == null) return;
        if ((Number(p.morts) || 0) > 0) alJeune.push("Mortalité : " + nom + " (" + p.morts + " mort(s))");
        if (a.jours <= 10) alJeune.push("Lot très jeune (J " + a.jours + ") : " + nom + " — démarrage sensible");
        if (a.jours >= (nS * 7 - 7) && a.jours <= nS * 7) alJeune.push("Fin de suivi bientôt : " + nom + " (S" + a.sem + ")");
        if (a.jours > nS * 7) alJeune.push("Prêt à transférer : " + nom + " (S" + a.sem + ")");
        // Tâche du jour (période détaillée J1–JnJ) : eau/nourriture/nettoyage non cochés
        if (a.jours >= 0 && a.jours <= nJ - 1) {
          const dj = (p.jours || {})[a.jours + 1] || {};
          const manque = [!dj.eau && "eau", !dj.nourriture && "nourriture"].filter(Boolean);   // nettoyage géré par les rappels du lot
          if (manque.length) tachesJeunes.push("J " + (a.jours + 1) + " · " + nom + " : " + manque.join(" / "));
        }
        // Rappels du lot (nettoyage + Fortiferm/Cocciferm/Vermiferm) → colonnes « Actions du jour ».
        // Le nettoyage est quotidien : après avoir coché le nettoyage du jour, le prochain apparaît en « à venir ».
        const sj = soinsJeuneLot(p, config);
        if (sj.actif) {
          [["nettoyage", "Nettoyer"], ["fortiferm", "Fortiferm"], ["cocciferm", "Cocciferm"], ["vermiferm", "Vermiferm"]].forEach(([k, lbl]) => {
            const e = sj[k];
            const ds = (k !== "nettoyage" && sj.dose != null) ? " · " + formatMl(sj.dose) : "";
            if (e.code === "retard") enRetard.push("🐥 " + lbl + " · " + nom + " (retard " + (-e.reste) + " j)" + ds);
            else if (e.code === "aujourdhui") aFaire.push("🐥 " + lbl + " · " + nom + ds);
            else if (e.code === "avenir") aVenir.push("🐥 " + lbl + " · " + nom + " (" + frDate(e.prochain) + ")" + ds);
          });
        }
      });
      aVenir.sort((a, b) => a.localeCompare(b));

      return (
        <div>
          <PageHeader title="Tableau de bord" subtitle={"Aujourd'hui : " + frDate(today) + " — l'essentiel est ouvert, le reste se déplie. Un ⚠️ sur un volet replié signale une anomalie."}
            action={<button onClick={() => allerA("calendrier")} className="inline-flex items-center gap-1 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium px-3 py-2 rounded-lg shadow-sm whitespace-nowrap">📅 Calendrier</button>} />

          {/* ===== VISIBLES D'EMBLÉE ===== */}

          {/* Actions du jour (le plus important : à faire + retards) */}
          <Section titre={"✅ Actions du jour" + (aFaire.length ? " · " + aFaire.length : "")} defaut={true} alerte={enRetard.length}>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              <DashListe titre="🔴 En retard" couleur="red" items={enRetard} vide="Rien en retard 👍" />
              <DashListe titre="🟠 Aujourd'hui / bientôt" couleur="orange" items={aFaire} vide="Rien d'urgent" />
            </div>
          </Section>

          {/* Cette semaine : aperçu du calendrier (aujourd'hui + 7 jours), événements cliquables */}
          <Section titre={"📅 Cette semaine" + (nbEvSemaine ? " · " + nbEvSemaine : "")} defaut={true}>
            {semaine.length === 0
              ? <p className="text-sm text-slate-400">Rien de prévu dans les 7 prochains jours.</p>
              : <div className="space-y-3">
                  {semaine.map((j) => (
                    <div key={j.date}>
                      <p className={"text-xs font-medium mb-1 " + (j.date === today ? "text-emerald-600" : "text-slate-500")}>{j.date === today ? "Aujourd'hui — " + frDate(j.date) : frDate(j.date)}</p>
                      <ul className="ml-1 space-y-1">
                        {j.evs.map((e, k) => (
                          <li key={k}>
                            <button onClick={() => e.page && allerA(e.page)} className="flex items-center gap-2 text-sm text-slate-700 w-full text-left hover:text-emerald-700">
                              <span>{e.icon}</span><span className="min-w-0">{e.label}</span>{e.page && <span className="text-slate-300 text-xs">›</span>}
                            </button>
                          </li>
                        ))}
                      </ul>
                    </div>
                  ))}
                </div>}
            <button onClick={() => allerA("calendrier")} className="mt-3 text-sm font-medium text-emerald-600 hover:underline">Ouvrir le calendrier complet →</button>
          </Section>

          {/* Œufs (suivi quotidien important) */}
          <Section titre="🥚 Œufs" defaut={true} alerte={baissePonte.length}>
            {/* Taux de ponte sur 7 jours = œufs récoltés / pondeuses / jour */}
            <p className="text-xs text-slate-500 mb-2 font-medium">Taux de ponte (7 derniers jours)</p>
            <div className="grid grid-cols-2 gap-4 mb-4">
              <StatCard label={"🐔 Poules (" + chept.poules + " pondeuses)"} value={pontePoule7 ? Math.round(pontePoule7.taux * 100) + " %/j" : "—"} color={baissePonte.some(b => /poules/.test(b)) ? "orange" : "emerald"} sub={pontePoule7 ? pontePoule7.oeufs + " œufs / 7 j" : ""} />
              <StatCard label={"🐦 Cailles (" + chept.caillesF + " pondeuses)"} value={ponteCaille7 ? Math.round(ponteCaille7.taux * 100) + " %/j" : "—"} color={baissePonte.some(b => /cailles/.test(b)) ? "orange" : "emerald"} sub={ponteCaille7 ? ponteCaille7.oeufs + " œufs / 7 j" : ""} />
            </div>

            {/* Prévision de ponte selon l'ÂGE des pondeuses (fiches reproducteurs : naissance + race) */}
            {(() => {
              const prevP = previsionPonte(reproducteurs, races, config, "poule");
              const prevC = previsionPonte(reproducteurs, races, config, "caille");
              if (!prevP.nb && !prevC.nb) return null;
              const carte = (label, prev, reel) => {
                const prevu7 = Math.round(prev.oeufsJour * 7);
                const enBaisse = reel && prevu7 > 0 && reel.oeufs < prevu7 * 0.6;
                return <StatCard label={label} value={prev.nb ? "~" + prevu7 + " œufs / 7 j" : "—"}
                  color={enBaisse ? "orange" : "indigo"}
                  sub={(reel ? "réel : " + reel.oeufs : "pas de récolte") + " · " + prev.nb + " pondeuse(s) selon l'âge" + (enBaisse ? " ⚠️ réel bien plus bas" : "")} />;
              };
              return <>
                <p className="text-xs text-slate-500 mb-2 font-medium">🔮 Prévision de ponte selon l'âge <span className="font-normal text-slate-400">(fiches reproducteurs : naissance × race × seuils d'âge des Réglages)</span></p>
                <div className="grid grid-cols-2 gap-4 mb-4">
                  {carte("🐔 Poules — prévu", prevP, pontePoule7)}
                  {carte("🐦 Cailles — prévu", prevC, ponteCaille7)}
                </div>
              </>;
            })()}

            {/* Détails (stocks, consommation, lots) — repliés pour garder le tableau de bord lisible */}
            <Section titre="📂 Détail des œufs (stocks, consommation, lots)">
              <p className="text-xs text-slate-500 mb-2 font-medium">Par espèce</p>
              <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                <OeufsBloc titre="Consommés (total)" poule={so.consoPoule} caille={so.consoCaille} couleur="orange" />
                <OeufsBloc titre="Stock actif" poule={so.stockPoule} caille={so.stockCaille} couleur="emerald" />
                <OeufsBloc titre="En couveuse" poule={so.couvPoule} caille={so.couvCaille} couleur="indigo" />
              </div>

              <div className="grid grid-cols-3 gap-4 mt-4">
                <StatCard label="Consommés (mois)" value={so.consoMois} color="orange" />
                <StatCard label={"Consommés " + ANNEE_COURANTE} value={so.consoAn} color="orange" />
                <StatCard label="Économie estimée (an)" value={eur(so.economieAn)} color="purple" />
              </div>

              {/* Lots en cours de stockage */}
              <p className="text-xs text-slate-500 mb-2 mt-4 font-medium">Lots en cours de stockage</p>
              <DashListe couleur="emerald" titre="En stock"
                items={batchesD.filter((b) => b.statut === "en stock").map((b) => b.id + " · " + b.espece + " · " + b.total + " œufs · " + (b.premiere ? frDate(b.premiere) : "—") + " → " + (b.derniere ? frDate(b.derniere) : "—"))}
                vide="Aucun lot en stock" />

              {/* Lots en couvaison */}
              <p className="text-xs text-slate-500 mb-2 mt-4 font-medium">Lots en couvaison</p>
              <DashListe couleur="indigo" titre="En couveuse"
                items={lots.filter((l) => l.statut === "en couveuse").map((l) => l.id + " · " + l.espece + " · " + l.nbOeufs + " œufs · mis le " + frDate(l.dateDebut))}
                vide="Aucun lot en couveuse" />

              <p className="text-xs text-slate-400 mt-3">Stock actif = œufs en lot « en stock » ; en couveuse = œufs des lots d'incubation en cours ; consommés = collectes « consommation ». Poules et cailles comptées séparément.</p>
            </Section>
          </Section>

          {/* ===== REPLIÉS (⚠️ si anomalie) ===== */}

          {/* Alertes importantes — repliée par défaut ; le badge ⚠️ prévient s'il y en a */}
          <Section titre={"🚨 Alertes importantes" + (nbAlertes ? " · " + nbAlertes : "")} alerte={nbAlertes}>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
              <DashListe titre="Stocks urgents à racheter" couleur="orange" items={stocksUrgents} vide="Aucun stock urgent" />
              <DashListe titre="Matériel urgent à traiter" couleur="red" items={materielTraiter} vide="Aucun (le non-urgent reste dans Inventaire matériel → À traiter)" />
              <DashListe titre="Âge reproducteurs" couleur="red" items={alertesRepro} vide="Aucune alerte d'âge" />
              <DashListe titre="Écart couvaison poule/caille" couleur="orange" items={ecartCouvaison} vide="Écarts ≥ 4 j OK" />
              <DashListe titre="Couvaison hors normes" couleur="red" items={alertesCouv} vide="Relevés conformes aux normes" />
              <DashListe titre="🥚 Baisse de ponte" couleur="orange" items={baissePonte} vide="Ponte stable" />
              <DashListe titre="🧬 Consanguinité (lignées)" couleur="red" items={alertesLignee} vide="Aucun risque détecté" />
            </div>
          </Section>

          {/* Prochains rappels — repliée par défaut */}
          <Section titre={"🔵 Prochains rappels" + (aVenir.length ? " · " + aVenir.length : "")}>
            <DashListe titre="À venir" couleur="slate" items={aVenir} vide="Aucun rappel programmé" />
          </Section>

          {/* (Le volet Couvaison a été retiré du tableau de bord : les couveuses, courbes et fiche de
              référence vivent dans Récolte des œufs → Stats couvaison ; les anomalies T°/H% remontent
              déjà dans « Alertes importantes ». ) */}

          {/* Animaux & jeunes (fusion reproducteurs/cheptel + poussins/cailleteaux) */}
          <Section titre="🐓 Animaux & jeunes" alerte={alJeune.length}>
            <p className="text-xs text-slate-500 mb-2 font-medium">Reproducteurs & cheptel</p>
            <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-4">
              <StatCard label="Poules" value={(config.cheptel || cheptel).poules} />
              <StatCard label="Coqs" value={(config.cheptel || cheptel).coqs} color="orange" />
              <StatCard label="Cailles ♀" value={(config.cheptel || cheptel).caillesF} />
              <StatCard label="Cailles ♂" value={(config.cheptel || cheptel).caillesM} color="orange" />
            </div>
            {/* Statuts des reproducteurs (les non-actifs sortent du compte « actifs ») */}
            <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-5">
              <StatCard label="Reproducteurs actifs" value={reproActifs} color="emerald" />
              <StatCard label="Malades" value={reproMalades} color="orange" />
              <StatCard label="Décédés" value={reproDecedes} color="red" />
              <StatCard label="Retraités" value={reproRetraites} color="slate" />
            </div>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-5">
              <StatCard label="Animaux consommation" value={consoTotal} color="purple" />
            </div>

            <p className="text-xs text-slate-500 mb-2 font-medium">Poussins & cailleteaux{jeunesActifs.length ? " · " + jeunesActifs.length + " lot(s)" : ""}</p>
            {(tachesJeunes.length > 0 || alJeune.length > 0) && (
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <DashListe titre="Tâches du jour (jeunes)" couleur="emerald" items={tachesJeunes} vide="Tout est fait 👍" />
                <DashListe titre="Alertes jeunes" couleur="orange" items={alJeune} vide="—" />
              </div>
            )}
            <div className="grid grid-cols-2 md:grid-cols-4 gap-4">

              <StatCard label="Total jeunes vivants" value={vivants(jeunesPoussins) + vivants(jeunesCailleteaux)} color="purple" />
              <StatCard label="Pertes" value={morts(jeunesPoussins) + morts(jeunesCailleteaux)} color="orange" />
            </div>
            <p className="text-xs text-slate-400 mt-3">Détail par lot et suivi quotidien dans <span className="font-medium">Gestion du poulailler → onglet Bébé</span>.</p>
          </Section>

          {/* Stocks & matériel (fusion) */}
          <Section titre={"🧺 Stocks & matériel" + (sc.nbARacheter ? " · " + sc.nbARacheter + " à racheter" : "")}>
            <p className="text-xs text-slate-500 mb-2 font-medium">Consommables</p>
            <div className="grid grid-cols-2 md:grid-cols-3 gap-4 mb-5">
              <StatCard label="Valeur du stock" value={eur(sc.valeurStock)} />
              <StatCard label={"Dépenses conso. " + ANNEE_COURANTE} value={eur(sc.depAnnee[String(ANNEE_COURANTE)] || 0)} color="indigo" />
              <StatCard label="À racheter" value={sc.nbARacheter} color="orange" />
            </div>
            <p className="text-xs text-slate-500 mb-2 font-medium">Matériel</p>
            <div className="grid grid-cols-2 md:grid-cols-3 gap-4">
              <StatCard label="Valeur du parc" value={eur(sm.valeurTotale)} />
              <StatCard label={"Dépenses matériel " + ANNEE_COURANTE} value={eur(sm.depenseAnneeCourante)} color="indigo" />
              <StatCard label="À traiter" value={sm.nbAReparer} color="orange" />
            </div>
            <p className="text-xs text-slate-400 mt-3">Détails dans les onglets <span className="font-medium">Inventaire consommables</span> / <span className="font-medium">matériel</span> ; les articles ⭐ urgents et le matériel à traiter remontent dans « Alertes importantes ».</p>
          </Section>

          {/* COÛTS & RENTABILITÉ (année en cours) */}
          <Section titre={"💶 Coûts & rentabilité " + ANNEE_COURANTE}>
            <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
              <StatCard label="Dépenses totales" value={eur(totalDepAn)} color="red" sub="aliment + matériel + achats" />
              <StatCard label="Aliment / consommables" value={eur(depConsoAn)} color="orange" />
              <StatCard label="Matériel (année)" value={eur(depMatAn)} color="orange" />
              <StatCard label="Achats reproducteurs" value={eur(depReproAn)} color="orange" />
            </div>
            <p className="text-xs text-slate-500 mb-2 mt-4 font-medium">Production & coût de revient</p>
            <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
              <StatCard label="Œufs récoltés" value={oeufsAn} />
              <StatCard label="Poussins/cailleteaux nés" value={poussinsNesAn} color="indigo" />
              <StatCard label="Coût aliment / œuf" value={coutParOeuf != null ? eur(coutParOeuf) : "—"} color="purple" sub={prixOeuf ? "valeur œuf : " + eur(prixOeuf) : ""} />
              <StatCard label="Coût / poussin né" value={coutParPoussin != null ? eur(coutParPoussin) : "—"} color="purple" sub="toutes dépenses" />
            </div>
            <p className="text-xs text-slate-400 mt-3">Estimations {ANNEE_COURANTE} : « coût aliment / œuf » = dépenses consommables ÷ œufs récoltés ; « coût / poussin né » = toutes les dépenses ÷ poussins nés. Valeur d'un œuf modifiable dans Réglages.{valeurOeufsAn ? " Valeur des œufs récoltés : " + eur(valeurOeufsAn) + "." : ""}</p>
          </Section>

          {/* STATISTIQUES DÉTAILLÉES */}
          <Section titre="📈 Statistiques détaillées">
            <StatsDetaillees />
          </Section>
        </div>
      );
    }

    // Section déroulante du tableau de bord (native <details>, simple et mobile-friendly).
    // `alerte` (nombre) → pastille ⚠️ visible UNIQUEMENT quand la section est repliée
    // (incite à l'ouvrir pour voir l'anomalie).
    function Section({ titre, defaut, alerte, children }) {
      return (
        <details open={!!defaut} className="bg-white rounded-xl shadow-sm border border-slate-100 mb-4 group">
          <summary className="cursor-pointer select-none px-5 py-4 font-semibold text-slate-800 flex items-center justify-between gap-2 list-none">
            <span className="flex items-center gap-2 min-w-0">
              <span>{titre}</span>
              {alerte ? <span className="group-open:hidden inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium bg-red-100 text-red-700 animate-pulse">⚠️ {alerte}</span> : null}
            </span>
            <span className="text-slate-400 text-xs transition-transform group-open:rotate-180 shrink-0">▼</span>
          </summary>
          <div className="px-5 pb-5">{children}</div>
        </details>
      );
    }

    // Petite carte "liste" pour le résumé inventaires du tableau de bord
    function DashListe({ titre, items, couleur, vide }) {
      const point = { red: "bg-red-500", orange: "bg-orange-500", slate: "bg-slate-400", emerald: "bg-emerald-500" }[couleur] || "bg-orange-500";
      return (
        <div className="bg-white rounded-xl shadow-sm border border-slate-100 p-5">
          <p className="text-sm text-slate-500 mb-2">{titre} <span className="text-slate-400">({items.length})</span></p>
          {items.length === 0
            ? <p className="text-sm text-slate-400">{vide || "—"}</p>
            : <ul className="space-y-1">
                {items.map((t, i) => (
                  <li key={i} className="text-sm text-slate-700 flex items-center gap-2">
                    <span className={`inline-block w-1.5 h-1.5 rounded-full ${point}`}></span>{t}
                  </li>
                ))}
              </ul>}
        </div>
      );
    }

    // Bloc œufs : total + ventilation poule / caille
    function OeufsBloc({ titre, poule, caille, couleur }) {
      const cls = { emerald: "text-emerald-600", indigo: "text-indigo-600", orange: "text-orange-500", purple: "text-purple-600" }[couleur] || "text-emerald-600";
      return (
        <div className="bg-white rounded-xl shadow-sm border border-slate-100 p-5">
          <p className="text-sm text-slate-500 mb-1">{titre}</p>
          <p className={`text-3xl font-bold ${cls}`}>{(Number(poule) || 0) + (Number(caille) || 0)}</p>
          <div className="flex gap-4 mt-2 text-sm text-slate-600">
            <span>🐔 Poules <span className="font-medium">{poule}</span></span>
            <span>🐦 Cailles <span className="font-medium">{caille}</span></span>
          </div>
        </div>
      );
    }

    // Pastille couveuse — repère visuel constant : C1 = jaune pastel (couveuse jaune),
    // C2 = vert pastel (couveuse verte). Utilisée partout où une couveuse est affichée.
    const COUVEUSE_CLS = { 1: "bg-yellow-100 text-yellow-800 border-yellow-200", 2: "bg-emerald-100 text-emerald-800 border-emerald-200" };
    const couveuseEmoji = (num) => (Number(num) === 2 ? "🟢" : "🟡");
    // Libellé texte avec emoji, pour les listes/rappels en texte simple
    const couveuseLbl = (num) => couveuseEmoji(num) + " Couveuse " + num;
    function CouveuseBadge({ num, court }) {
      const n = Number(num) || 1;
      return (
        <span className={"px-2 py-0.5 rounded-full text-xs font-medium border whitespace-nowrap " + (COUVEUSE_CLS[n] || "bg-slate-100 text-slate-600 border-slate-200")}>
          {couveuseEmoji(n)} {court ? "C" + n : "Couveuse " + n}
        </span>
      );
    }

    // Trouve le lot en cours d'une couveuse + ses relevés triés + valeurs actuelles
    function infosCouveuse(num, lots, suivis) {
      const lot = lots.find(l => l.couveuse === num && l.statut !== "terminé");
      if (!lot) return { lot: null };
      const releves = suivis.filter(s => s.lot === lot.id).slice().sort((a, b) => a.jour - b.jour);
      const dernier = releves[releves.length - 1];
      const total = DUREE[lot.espece];
      const jourActuel = Math.max(0, Math.min(joursEcoules(lot.dateDebut), total));
      return { lot, releves, dernier, total, jourActuel };
    }

    // Récapitulatif d'un lot calculé UNIQUEMENT depuis le suivi (mirages + éclosions).
    // Aucune saisie en double : tout vient des données déjà entrées dans Suivi journalier.
    function recapSuivi(lot, mirages, eclosions) {
      if (!lot) return null;
      const ms = mirages.filter(m => m.lot === lot.id).slice().sort((a, b) => a.numero - b.numero);
      const es = eclosions.filter(e => e.lot === lot.id);
      const somme = (arr, champ) => arr.reduce((s, x) => s + (Number(x[champ]) || 0), 0);
      const dernierMirage = ms[ms.length - 1];                 // dernier état connu (mirage 2 si présent)
      const fecondes = dernierMirage ? (Number(dernierMirage.fecondes) || 0) : null;
      const nbOeufs = Number(lot.nbOeufs) || 0;
      const nes = es.length ? somme(es, "nes") : null;
      const tauxFec = (fecondes != null && nbOeufs > 0) ? Math.round((fecondes / nbOeufs) * 100) : null;
      const tauxEcl = (nes != null && fecondes) ? Math.round((nes / fecondes) * 100) : null;
      const tauxGlobal = (nes != null && nbOeufs > 0) ? Math.round((nes / nbOeufs) * 100) : null;  // réussite globale = nés / œufs incubés
      return {
        nbOeufs,
        clairs: ms.length ? somme(ms, "clairs") : null,
        retires: ms.length ? somme(ms, "retires") : null,
        fecondes,
        nes,
        nonEclos: es.length ? somme(es, "nonEclos") : null,
        tauxFec, tauxEcl, tauxGlobal,
        hasMirage: ms.length > 0, hasEclosion: es.length > 0,
      };
    }

    // Carte détaillée d'une couveuse (Récolte des œufs → Stats couvaison) : infos + mini-récap + 2 graphiques
    function IncubatorCard({ num }) {
      const { lots, suivis, mirages, eclosions, config } = useData();
      const { lot, releves, dernier, total, jourActuel } = infosCouveuse(num, lots, suivis);
      const cap = lot ? CAPACITE[lot.espece] : null;
      const recap = recapSuivi(lot, mirages, eclosions);
      const rv = (v) => (v == null ? "—" : v);
      return (
        <div className="bg-white rounded-xl shadow-sm p-6 border border-slate-100">
          <div className="flex justify-between items-center mb-4">
            <h3 className={"text-lg font-semibold px-3 py-1 rounded-lg border " + (COUVEUSE_CLS[Number(num)] || "bg-slate-100 text-slate-600 border-slate-200")}>{couveuseEmoji(num)} Couveuse {num}</h3>
            {lot ? <StatusBadge statut={lot.statut} /> : <span className="text-xs text-slate-400">Vide</span>}
          </div>
          {lot ? (
            <div className="space-y-3 text-sm">
              <div className="grid grid-cols-2 gap-y-1">
                <div><span className="text-slate-500">Lot en cours :</span> <span className="font-medium">{lot.id}</span></div>
                <div><span className="text-slate-500">Espèce :</span> <span className="font-medium">{lot.espece}</span></div>
                <div><span className="text-slate-500">Jour actuel :</span> <span className="font-medium">J {jourActuel} / {total}</span></div>
                <div><span className="text-slate-500">Capacité :</span> <span className="font-medium">{lot.nbOeufs} / {cap}</span></div>
                <div><span className="text-slate-500">Température :</span> <span className="font-medium">{dernier ? dernier.temp + " °C" : "—"}</span></div>
                <div><span className="text-slate-500">Humidité :</span> <span className="font-medium">{dernier ? dernier.humidite + " %" : "—"}</span></div>
              </div>
              <ProgressBar jour={jourActuel} total={total} />

              {/* Mini-récapitulatif des résultats — calculé depuis le suivi journalier */}
              <div className="rounded-lg border border-slate-100 bg-slate-50 p-3">
                <div className="flex items-center justify-between mb-2">
                  <span className="text-xs font-semibold text-slate-600">Récapitulatif (suivi journalier)</span>
                  <span className="text-[11px] text-slate-400">{lot.id} · {lot.espece}</span>
                </div>
                <div className="grid grid-cols-3 gap-y-1 text-xs text-slate-600">
                  <div><span className="text-slate-400">En couveuse</span><br /><span className="font-medium">{recap.nbOeufs || "—"}</span></div>
                  <div><span className="text-slate-400">Clairs</span><br /><span className="font-medium">{rv(recap.clairs)}</span></div>
                  <div><span className="text-slate-400">Retirés</span><br /><span className="font-medium">{rv(recap.retires)}</span></div>
                  <div><span className="text-slate-400">Fécondés</span><br /><span className="font-medium text-emerald-600">{rv(recap.fecondes)}</span></div>
                  <div><span className="text-slate-400">Nés</span><br /><span className="font-medium text-emerald-600">{rv(recap.nes)}</span></div>
                  <div><span className="text-slate-400">Non éclos</span><br /><span className="font-medium">{rv(recap.nonEclos)}</span></div>
                </div>
                <div className="flex gap-2 mt-2 pt-2 border-t border-slate-200 text-xs">
                  <span className="px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700">Fécondation : {recap.tauxFec != null ? recap.tauxFec + " %" : "—"}</span>
                  <span className="px-2 py-0.5 rounded-full bg-blue-100 text-blue-700">Éclosion : {recap.tauxEcl != null ? recap.tauxEcl + " %" : "—"}</span>
                </div>
                {!recap.hasMirage && !recap.hasEclosion && (
                  <p className="text-[11px] text-slate-400 mt-2">En attente d'un mirage ou d'une éclosion dans le suivi journalier.</p>
                )}
              </div>

              <div className="grid grid-cols-1 gap-3 pt-1">
                <LineChart titre="Température (°C)" unit="°" color="#dc2626" xMax={total}
                  points={releves.map(s => ({ x: s.jour, y: s.temp }))}
                  ligne={serieCible(config, lot.espece, total, "tempCible")}
                  band={serieBande(config, lot.espece, total, "tempMin", "tempMax")} />
                <LineChart titre="Humidité (%)" unit="%" color="#2563eb" xMax={total}
                  points={releves.map(s => ({ x: s.jour, y: s.humidite }))}
                  band={serieBande(config, lot.espece, total, "humMin", "humMax")} />
              </div>

              {/* Comparaison relevés réels vs norme du jour */}
              {(() => {
                const lignes = releves.slice().sort((a, b) => b.jour - a.jour).slice(0, 8);
                if (!lignes.length) return <p className="text-[11px] text-slate-400">Aucun relevé journalier pour comparer aux normes.</p>;
                return (
                  <div className="rounded-lg border border-slate-100 overflow-x-auto">
                    <table className="w-full text-xs">
                      <thead className="text-slate-400 text-left"><tr>
                        <th className="px-2 py-1">J</th><th className="px-2 py-1">T° / cible</th><th className="px-2 py-1">H% / norme</th><th className="px-2 py-1">Statut</th>
                      </tr></thead>
                      <tbody>
                        {lignes.map((s) => {
                          const n = normeJour(config, lot.espece, s.jour);
                          if (!n.found) return <tr key={s.jour} className="border-t border-slate-100"><td className="px-2 py-1 font-medium">J{s.jour}</td><td className="px-2 py-1">{s.temp}°</td><td className="px-2 py-1">{s.humidite}%</td><td className="px-2 py-1"><span className="text-amber-600">norme ?</span></td></tr>;
                          const bt = bornesTemp(n);
                          const st = statutIntervalle(s.temp, bt.min, bt.max);
                          const sh = statutIntervalle(s.humidite, n.humMin, n.humMax);
                          const pire = (st === "haut" || sh === "haut") ? "haut" : ((st === "bas" || sh === "bas") ? "bas" : ((st === "?" || sh === "?") ? "?" : "ok"));
                          return (
                            <tr key={s.jour} className="border-t border-slate-100">
                              <td className="px-2 py-1 font-medium">J{s.jour}</td>
                              <td className="px-2 py-1">{s.temp}° <span className="text-slate-400">/ {n.tempCible}°</span></td>
                              <td className="px-2 py-1">{s.humidite}% <span className="text-slate-400">/ {n.humMin}-{n.humMax}%</span></td>
                              <td className="px-2 py-1"><PastilleStatut statut={pire} /></td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                );
              })()}

              {/* Alertes du lot (dernier relevé vs norme) */}
              {(() => {
                const a = alertesCouvaison(lot, releves, config);
                if (!a.alertes.length) return <p className="text-[11px] text-emerald-600">✓ Dernier relevé conforme aux normes (J{a.jour}).</p>;
                return (
                  <div className="rounded-lg border border-red-200 bg-red-50 p-2">
                    {a.alertes.map((m, i) => <p key={i} className="text-[11px] text-red-700">⚠️ {m}</p>)}
                  </div>
                );
              })()}

              {(() => {
                const p = (normeEspece(config, lot.espece).params) || {};
                const bits = [];
                if (p.retournementJusqua) bits.push("Retournement → J " + p.retournementJusqua);
                if (p.mirage1) bits.push("Mirage 1 J " + p.mirage1);
                if (p.mirage2) bits.push("Mirage 2 J " + p.mirage2);
                if (p.ventilation) bits.push("Ventilation : " + p.ventilation);
                return bits.length ? <p className="text-[11px] text-slate-400">📋 Repères ({lot.espece}) : {bits.join(" · ")}</p> : null;
              })()}
            </div>
          ) : (
            <p className="text-slate-400 text-sm">Aucun lot en cours.</p>
          )}
        </div>
      );
    }

    // Génère le calendrier jour par jour d'une couvaison à partir d'une norme (config.normes[espece])
    function calendrierCouvaison(norme) {
      const duree = Number(norme.duree) || 21;
      const p = norme.params || {};
      const phases = (norme.phases || []).slice().sort((a, b) => a.jusqua - b.jusqua);
      const humBasse = phases[0] ? phases[0].hum : null;
      const humHaute = phases.length ? phases[phases.length - 1].hum : humBasse;
      const temp = phases[0] ? phases[0].temp : null;
      const arret = Number(p.retournementJusqua) || 0;
      const m1 = Number(p.mirage1) || 0, m2 = Number(p.mirage2) || 0;
      const rows = [];
      for (let j = 0; j <= duree + 1; j++) {
        const actions = [];
        if (j === 0) actions.push("Mise en couveuse");
        if (j === m1) actions.push("Mirage 1 (M1)");
        if (j === m2) actions.push("Mirage 2 (M2)");
        if (j === arret) actions.push("Arrêt du retournement");
        if (j === arret + 1 && arret) actions.push("Arrêt d'ouverture");
        if (j === duree - 1) actions.push("1ers perçages possibles");
        if (j === duree) actions.push("Éclosion");
        if (j === duree + 1) actions.push("Laisser sécher (24h)");
        if (!actions.length && j >= 1 && j < arret) actions.push("Retournement automatique");
        rows.push({ j, temp, hum: j >= arret ? humHaute : humBasse, actions: actions.join(" · ") });
      }
      return rows;
    }

    // Fiche de référence couvaison (calendriers dérivés des normes + repères mémo)
    function FicheCouvaison() {
      const { config } = useData();
      const normes = config.normes || {};
      const especes = Object.keys(normes).filter((e) => e === "poule" || e === "caille").concat(Object.keys(normes).filter((e) => e !== "poule" && e !== "caille"));
      const calTable = (esp) => {
        const rows = calendrierCouvaison(normes[esp]);
        return (
          <div className="bg-white rounded-xl border border-slate-100 shadow-sm p-3 overflow-x-auto">
            <p className="text-sm font-semibold text-slate-700 mb-2 capitalize">Calendrier — {esp} <span className="text-xs font-normal text-slate-400">(pointe des œufs vers le bas)</span></p>
            <table className="w-full text-xs">
              <thead className="text-slate-400 text-left"><tr><th className="px-2 py-1">Jour</th><th className="px-2 py-1">T°C</th><th className="px-2 py-1">H%</th><th className="px-2 py-1">Actions</th></tr></thead>
              <tbody>
                {rows.map((r) => (
                  <tr key={r.j} className={"border-t border-slate-100 " + (r.actions ? "" : "text-slate-400")}>
                    <td className="px-2 py-1 whitespace-nowrap font-medium">J+{r.j}</td>
                    <td className="px-2 py-1 whitespace-nowrap">{r.temp != null ? r.temp + "°" : "—"}</td>
                    <td className="px-2 py-1 whitespace-nowrap">{r.hum != null ? r.hum + "%" : "—"}</td>
                    <td className="px-2 py-1">{r.actions || "—"}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        );
      };
      const blocRef = (titre, lignes) => (
        <div className="bg-white rounded-xl border border-slate-100 shadow-sm p-4">
          <p className="text-sm font-semibold text-slate-700 mb-2">{titre}</p>
          <table className="w-full text-xs">
            <tbody>
              {lignes.map(([a, b], i) => (
                <tr key={i} className="border-t border-slate-100 first:border-0">
                  <td className="px-2 py-1.5 font-medium text-slate-600 align-top whitespace-nowrap">{a}</td>
                  <td className="px-2 py-1.5 text-slate-500">{b}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
      return (
        <div className="space-y-4">
          <div className="grid md:grid-cols-2 gap-4">
            {especes.map((e) => <div key={e}>{calTable(e)}</div>)}
          </div>
          <div className="grid md:grid-cols-2 gap-4">
            {blocRef("Signes d'un bon développement au mirage", [
              ["J+7 (poules & cailles)", "Réseau de veines rouges et point noir mobile."],
              ["J+14 poules / J+10 cailles", "Tache sombre sur plus de la moitié de l'œuf."],
              ["Fin d'incubation", "Chambre à air bien visible ; poussin/cailleteau occupant presque tout l'œuf."],
            ])}
            {blocRef("Conservation des œufs avant incubation", [
              ["Température", "12 à 18 °C"],
              ["Humidité", "70 à 80 %"],
              ["Durée idéale", "< 7 jours"],
              ["Durée maximale", "10 à 14 jours"],
              ["Retournement", "1 à 2 ×/jour · pointe vers le bas"],
            ])}
          </div>
          {blocRef("Causes d'échecs fréquentes", [

          <p className="text-xs text-slate-400">Calendriers générés depuis tes normes (Réglages → Normes de couvaison). Règle de planning : viser ≥ 4 jours d'écart entre une mise en incubation de poules et de cailles.</p>

    // (L'ancienne page « Couveuses » a été supprimée : ses cartes IncubatorCard et la fiche de
    // référence vivent dans Récolte des œufs → Stats couvaison.)

    // Formulaire : nouvelle couvaison (n° de lot généré automatiquement)
    function CouvaisonForm({ onClose, initial, onSave }) {
      const { genLotId, ajouterLot } = useData();
      const [espece, setEspece] = useState(initial ? initial.espece : "poule");

      function submit(e) {

          </div>
          <div className="grid grid-cols-2 gap-3">
            <Field label="Couveuse utilisée">
              <select className={inputClass} value={couveuse} onChange={(e) => setCouveuse(e.target.value)}>
                <option value="1">Couveuse 1</option>
                <option value="2">Couveuse 2</option>
              </select>
            </Field>
            <Field label="Date de mise en couveuse">
              <input type="date" className={inputClass} value={dateDebut} onChange={(e) => setDateDebut(e.target.value)} required />
            </Field>
          </div>
          <div className="grid grid-cols-2 gap-3">
            <Field label="Nombre d'œufs">
              <input type="number" min="0" className={inputClass} value={nbOeufs} onChange={(e) => setNbOeufs(e.target.value)} placeholder="ex. 110" />
            </Field>
            <Field label="Statut">
              <select className={inputClass} value={statut} onChange={(e) => setStatut(e.target.value)}>
                <option value="en couveuse">En couveuse</option>
                <option value="en stockage">En stockage</option>
                <option value="terminé">Terminé</option>
              </select>
            </Field>
          </div>
          <Field label="Observations">

      );
    }

    // Formulaire : collecte / stockage des œufs avant couvaison
    // Badge de destination d'une collecte d'œufs
    function DestBadge({ destination }) {
      const map = {
        "stock": "bg-amber-100 text-amber-700",
        "consommation": "bg-orange-100 text-orange-700",
        "couvaison": "bg-blue-100 text-blue-700",
      };
      const lbl = { stock: "stock", consommation: "consommation", couvaison: "couvaison" }[destination] || destination || "—";
      return <span className={`px-2 py-0.5 rounded-full text-xs font-medium whitespace-nowrap ${map[destination] || "bg-slate-100 text-slate-600"}`}>{lbl}</span>;
    }

    // Badge de statut d'un lot de stock d'œufs
    function StatutLotStock({ statut }) {
      const map = {
        "en stock": "bg-amber-100 text-amber-700",
        "mis en couveuse": "bg-blue-100 text-blue-700",
        "terminé": "bg-slate-200 text-slate-600",
        "archivé": "bg-slate-100 text-slate-500",
      };
      return <span className={`px-2 py-0.5 rounded-full text-xs font-medium whitespace-nowrap ${map[statut] || "bg-slate-100 text-slate-600"}`}>{statut}</span>;
    }

    function CollecteForm({ onClose, initial, onSave }) {
      const { ajouterCollecte, ajouterLotStock, genLotStockId, lotsStock } = useData();
      const destInit = initial ? (initial.destination === "couvaison" ? "stock" : (initial.destination || ((Number(initial.stockes) || 0) > 0 ? "stock" : ((Number(initial.consommation) || 0) > 0 ? "consommation" : "stock")))) : "stock";
      const nbInit = initial ? (initial.nombre != null ? initial.nombre : (initial.recoltes != null ? initial.recoltes : "")) : "";
      const [date, setDate] = useState(initial ? initial.date : new Date().toISOString().slice(0, 10));
      const [espece, setEspece] = useState(initial ? initial.espece : "poule");
      const [nombre, setNombre] = useState(String(nbInit));
      const [destination, setDestination] = useState(destInit);
      const [lotStock, setLotStock] = useState(initial ? (initial.lotStock || initial.lot || initial.lotFutur || "") : "");
      const [nouveauLot, setNouveauLot] = useState("");   // texte si on crée un nouveau lot
      const [obs, setObs] = useState(initial ? (initial.obs || "") : "");

      // Lots de stock actifs de l'espèce choisie (où ajouter la récolte)
      const lotsDispo = lotsStock.filter((l) => l.espece === espece && l.statut === "en stock");
      const choixLot = lotStock === "__new__" || (!lotsDispo.find((l) => l.id === lotStock) && lotStock !== "") ? lotStock : lotStock;

      function submit(e) {
        e.preventDefault();
        let lotId = "";
        if (destination === "stock") {
          if (lotStock === "__new__") {
            lotId = (nouveauLot.trim() || genLotStockId(espece, date));
          } else {
            lotId = lotStock;
          }
          if (!lotId) lotId = genLotStockId(espece, date);
          // Crée le lot de stock s'il n'existe pas encore
          if (!lotsStock.find((l) => l.id === lotId)) {
            ajouterLotStock({ id: lotId, espece, statut: "en stock", dateCouvaison: "", lotCouvaison: "", obs: "" });
          }
        }
        const rec = { date, espece, nombre: Number(nombre) || 0, destination, lotStock: destination === "stock" ? lotId : "", obs: obs.trim() };
        (onSave || ajouterCollecte)(rec);
        onClose();
      }
      return (
        <form onSubmit={submit} className="space-y-3">
          <div className="grid grid-cols-2 gap-3">
            <Field label="Date de récolte">
              <input type="date" className={inputClass} value={date} onChange={(e) => setDate(e.target.value)} required />
            </Field>
            <Field label="Espèce">
              <select className={inputClass} value={espece} onChange={(e) => { setEspece(e.target.value); setLotStock(""); }}>
                <option value="poule">Poule</option>
                <option value="caille">Caille</option>
              </select>
            </Field>
          </div>
          <div className="grid grid-cols-2 gap-3">
            <Field label="Nombre d'œufs">
              <input type="number" min="0" className={inputClass} value={nombre} onChange={(e) => setNombre(e.target.value)} placeholder="ex. 12" required />
            </Field>
            <Field label="Destination">
              <select className={inputClass} value={destination} onChange={(e) => setDestination(e.target.value)}>
                <option value="stock">Stock (lot d'œufs)</option>
                <option value="consommation">Consommation</option>
              </select>
            </Field>
          </div>
          {destination === "stock" && (
            <>
              <Field label="Lot de stock">
                <select className={inputClass} value={lotStock} onChange={(e) => setLotStock(e.target.value)}>
                  <option value="">— choisir —</option>
                  {lotsDispo.map((l) => <option key={l.id} value={l.id}>{l.id}</option>)}
                  <option value="__new__">➕ Nouveau lot…</option>
                </select>
              </Field>
              {lotStock === "__new__" && (
                <Field label="Numéro du nouveau lot">
                  <input className={inputClass} value={nouveauLot} onChange={(e) => setNouveauLot(e.target.value)} placeholder={genLotStockId(espece, date)} />
                  <span className="text-xs text-slate-400">Laisse vide pour générer automatiquement ({genLotStockId(espece, date)}).</span>
                </Field>
              )}
            </>
          )}
          <Field label="Observations">
            <textarea className={inputClass} rows="2" value={obs} onChange={(e) => setObs(e.target.value)} />
          </Field>
          <FormButtons onClose={onClose} />
        </form>
      );
    }

    // Formulaire : mettre un lot de stock en couveuse
    function CouvaisonDepuisStockForm({ batch, onClose }) {
      const { mettreLotEnCouvaison } = useData();
      const [couveuse, setCouveuse] = useState("1");
      const [date, setDate] = useState(new Date().toISOString().slice(0, 10));
      function submit(e) {

            <div><span className="text-slate-500">Total œufs :</span> <span className="font-medium">{batch.total}</span></div>
            <div><span className="text-slate-500">Période de récolte :</span> {batch.premiere ? frDate(batch.premiere) : "—"} → {batch.derniere ? frDate(batch.derniere) : "—"}</div>
            <div className="mt-1 text-xs text-slate-400">{batch.collectes.length} collecte(s) : {batch.collectes.map((c) => frDate(c.date) + " (" + c.nombre + ")").join(", ")}</div>
          </div>
          <div className="grid grid-cols-2 gap-3">
            <Field label="Couveuse">
              <select className={inputClass} value={couveuse} onChange={(e) => setCouveuse(e.target.value)}>
                <option value="1">Couveuse 1</option>
                <option value="2">Couveuse 2</option>
              </select>
            </Field>
            <Field label="Date de mise en couveuse">
              <input type="date" className={inputClass} value={date} onChange={(e) => setDate(e.target.value)} required />
            </Field>
          </div>
          <p className="text-xs text-slate-400">Un lot de couvaison sera créé avec ces {batch.total} œufs. Le lot de stock passera en « mis en couveuse » et quittera le stock actif.</p>
          <FormButtons onClose={onClose} />
        </form>
      );
    }

    // Badge d'âge des œufs stockés (idéal ≤7 j, max 14 j)
    function AgeOeufs({ date }) {
      const a = Math.max(0, Math.floor((AUJOURDHUI - new Date(date)) / 86400000));
      const cls = a > 14 ? "bg-red-100 text-red-700" : (a > 7 ? "bg-amber-100 text-amber-700" : "bg-emerald-100 text-emerald-700");
      return <span className={`px-2 py-0.5 rounded-full text-xs font-medium ${cls}`}>{a > 14 ? "⚠️ " : ""}{a} j</span>;
    }

    function Lots() {
      const { lots, collectes, config, lotsStock, ajouterLotStock, genLotStockId, mettreLotEnCouvaison, majLigne, supprimerLigne, patchLigne } = useData();
      const [openLot, setOpenLot] = useState(false);
      const [openCol, setOpenCol] = useState(false);
      const [openGraph, setOpenGraph] = useState(false);
      const [editLot, setEditLot] = useState(null);   // { index, rec }
      const [editCol, setEditCol] = useState(null);
      const [openCouv, setOpenCouv] = useState(null); // lot de stock à mettre en couveuse
      const [ongletL, setOngletL] = useState("recoltes");   // onglet interne : recoltes | couveuse

      const so = statsOeufs(collectes, lotsStock, lots, config);
      const batchesAgg = lotsStock.map((b, i) => ({ ...agregLotStock(b, collectes), _idx: i }));
      const batchesActifs = batchesAgg.filter((b) => b.statut === "en stock");
      const ageJ = (d) => (d ? Math.max(0, Math.floor((AUJOURDHUI - new Date(d)) / 86400000)) : null);
      // Séries par date (depuis les événements normalisés) pour les graphiques
      const parDate = {};
      so.ev.forEach((e) => {
        const d = parDate[e.date] || (parDate[e.date] = { recoltes: 0, consommation: 0, stock: 0, couvaison: 0 });
        d.recoltes += e.nombre; d[e.destination] = (d[e.destination] || 0) + e.nombre;
      });
      const datesTri = Object.keys(parDate).sort();
      const serie = (champ) => datesTri.map((d) => ({ label: frDate(d), y: parDate[d][champ] || 0 }));
      // Toutes les récoltes triées du PLUS RÉCENT au plus ancien (la saisie du jour arrive en haut) ;
      // l'index d'origine est conservé pour l'édition/suppression.
      const colTriees = collectes.map((c, i) => ({ c, i })).sort((a, b) => b.c.date.localeCompare(a.c.date));
      // Affichage d'une collecte (gère ancien + nouveau modèle)
      const vue = (c) => c.destination
        ? { nombre: Number(c.nombre) || 0, dest: c.destination, lot: c.lotStock || c.lot || "", stock: c.destination === "stock" }
        : { nombre: Number(c.recoltes) || 0, dest: null, conso: Number(c.consommation) || 0, stk: Number(c.stockes) || 0, lot: c.lotFutur || "", stock: (Number(c.stockes) || 0) > 0 };

      return (
        <div>
          <PageHeader title="Récolte des œufs" subtitle="Récoltes (consommation / couvaison / stock) + lots en couveuse" />

          {/* Onglets internes */}
          <div className="flex gap-1.5 mb-6 flex-wrap border-b border-slate-200">
            {[["recoltes", "🥚 Récoltes"], ["couveuse", "🐣 Lots en couveuse"], ["suivi", "🌡️ Suivi couvaison"], ["stats", "📊 Stats couvaison"]].map(([id, lbl]) => (
              <button key={id} onClick={() => setOngletL(id)}
                className={"px-3 py-2 text-sm font-medium -mb-px border-b-2 whitespace-nowrap " + (ongletL === id ? "border-emerald-600 text-emerald-700" : "border-transparent text-slate-500 hover:text-slate-700")}>{lbl}</button>
            ))}
          </div>

          {ongletL === "suivi" && <Suivi />}

          {ongletL === "stats" && <>
          <h2 className="text-lg font-semibold mb-3">📊 Stats de couvaison</h2>
          {/* Cartes couveuses + courbes T°/H% (déplacées ici depuis le tableau de bord) */}
          <div className="grid md:grid-cols-2 gap-4 mb-6">
            <IncubatorCard num={1} />
            <IncubatorCard num={2} />
          </div>
          <div className="mb-6">
            <Section titre="📋 Fiche de référence couvaison"><FicheCouvaison /></Section>
          </div>
          <StatsDetaillees couvaisonSeule />
          </>}

          {ongletL === "couveuse" && <>
          {/* Partie A — lots */}
          <div className="flex items-center justify-between mb-3">
            <h2 className="text-lg font-semibold">Lots mis en couveuse</h2>
            <AddButton onClick={() => setOpenLot(true)} label="Ajouter une couvaison" />
          </div>
          <Table
            resume={(r, i) => { const l = lots[i]; const inc = infoIncub(l); const j = l.statut === "en stockage" ? "" : (inc.futur ? " · à venir" : " · " + inc.label); return <><span className="font-medium">{l.id}</span> — {l.espece === "caille" ? "Cailles" : "Poules"} — {l.nbOeufs} œufs<span className="text-slate-400">{j}</span></>; }}
            columns={["N° Lot", "Espèce", "Couveuse", "Mise en couveuse", "Œufs", "Jour actuel", "Éclosion prévue", "Statut", ""]}
            rows={lots.map((l, i) => {
              const inc = infoIncub(l);
              return [
                <span className="font-medium">{l.id}</span>,
                l.espece,
                <CouveuseBadge num={l.couveuse} />,
                frDate(l.dateDebut),
                l.nbOeufs,
                l.statut === "en stockage" ? "—" : (inc.futur ? <span className="text-slate-500">à venir</span> : inc.label),
                l.statut === "en stockage" ? "—" : frDate(dateEclosion(l.dateDebut, l.espece)),
                <StatusBadge statut={l.statut} />,
                <RowActions onEdit={() => setEditLot({ index: i, rec: l })} onDelete={() => supprimerLigne("lots", i)} />,
              ];
            })}
          />

          </>}

          {ongletL === "recoltes" && <>
          {/* Partie B — récolte des œufs (par destination) */}
          <div className="flex items-center justify-between mb-3 gap-2 flex-wrap">
            <h2 className="text-lg font-semibold">Récoltes</h2>
            <div className="flex gap-2">
              <button
                onClick={() => setOpenGraph(true)}
                className="inline-flex items-center gap-1 bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 text-sm font-medium px-3 py-2 rounded-lg shadow-sm whitespace-nowrap"
              >
                📈 Graphiques
              </button>
              <AddButton onClick={() => setOpenCol(true)} label="Ajouter une récolte" />
            </div>
          </div>

          {/* Résumé œufs par espèce : seul le STOCK actif est compté en stock */}
          <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
            <OeufsBloc titre={"Stock actif (" + batchesActifs.length + " lot(s))"} poule={so.stockPoule} caille={so.stockCaille} couleur="emerald" />
            <OeufsBloc titre="En couveuse" poule={so.couvPoule} caille={so.couvCaille} couleur="indigo" />
            <OeufsBloc titre="Consommés (total)" poule={so.consoPoule} caille={so.consoCaille} couleur="orange" />
          </div>

          {/* Lots de stock (agrégés) */}
          <h3 className="text-sm font-semibold text-slate-600 mb-2">Lots de stock</h3>
          {batchesAgg.length === 0
            ? <p className="text-sm text-slate-400 mb-4">Aucun lot de stock. Ajoute une récolte avec destination « stock ».</p>
            : <div className="space-y-3 mb-4">
                {batchesAgg.map((b) => (
                  <div key={b.id} className="bg-white rounded-xl border border-slate-100 shadow-sm p-4">
                    <div className="flex items-start justify-between gap-2 flex-wrap">
                      <div>
                        <div className="flex items-center gap-2">
                          <span className="font-semibold">{b.id}</span>
                          <span className="text-xs text-slate-400">{b.espece}</span>
                          <StatutLotStock statut={b.statut} />
                        </div>
                        <div className="text-sm text-slate-600 mt-1"><span className="font-medium text-emerald-600">{b.total} œufs</span> · {b.collectes.length} récolte(s)</div>
                        <div className="text-xs text-slate-400">
                          Récolte : {b.premiere ? frDate(b.premiere) : "—"} → {b.derniere ? frDate(b.derniere) : "—"}
                          {b.premiere != null && <> · plus vieux {ageJ(b.premiere)} j · plus jeune {ageJ(b.derniere)} j</>}
                          {b.statut === "mis en couveuse" && b.lotCouvaison && <> · → lot couveuse <span className="font-medium">{b.lotCouvaison}</span></>}
                        </div>
                      </div>
                      <div className="flex gap-2 flex-wrap">
                        {b.statut === "en stock" && b.total > 0 && (
                          <button onClick={() => setOpenCouv(b)} className="px-2.5 py-1 rounded-lg text-xs font-medium bg-emerald-600 hover:bg-emerald-700 text-white whitespace-nowrap">→ Mettre en couvaison</button>
                        )}
                        {b.statut === "en stock" && (
                          <button onClick={() => patchLigne("lotsStock", b._idx, { statut: "archivé" })} className="px-2.5 py-1 rounded-lg text-xs border border-slate-300 hover:bg-slate-50 whitespace-nowrap">Archiver</button>
                        )}
                        <button onClick={() => { if (window.confirm("Supprimer le lot " + b.id + " ? (les récoltes liées ne sont pas supprimées)")) supprimerLigne("lotsStock", b._idx); }} className="px-1.5 py-0.5 rounded hover:bg-red-50 text-red-500">🗑</button>
                      </div>

                    <details className="mt-2">

                      <table className="w-full text-sm mt-2">
                        <thead className="text-slate-500 text-left"><tr><th className="px-2 py-1 font-medium">Date</th><th className="px-2 py-1 font-medium">Œufs</th><th className="px-2 py-1 font-medium">Âge</th><th className="px-2 py-1 font-medium">Obs</th></tr></thead>
                        <tbody>
                          {b.collectes.slice().sort((x, y) => x.date.localeCompare(y.date)).map((c, k) => (
                            <tr key={k} className="border-t border-slate-100">
                              <td className="px-2 py-1">{frDate(c.date)}</td>
                              <td className="px-2 py-1">{c.nombre}</td>
                              <td className="px-2 py-1"><AgeOeufs date={c.date} /></td>

                    </details>

            columns={["Date", "Espèce", "Nombre", "Destination", "Lot stock", "Âge", "Obs", ""]}
            rows={colTriees.map(({ c, i }) => {

    // Formulaire de saisie d'un relevé journalier
    function SuiviForm({ onClose, initial, onSave }) {
      const { lots, ajouterSuivi } = useData();

      const [temp, setTemp] = useState(initial ? String(initial.temp) : "");
      const [humidite, setHumidite] = useState(initial ? String(initial.humidite) : "");
      const [eau, setEau] = useState(initial ? !!initial.eau : false);
      const [obs, setObs] = useState(initial ? (initial.obs || "") : "");

      // Pré-remplit le jour d'incubation à partir du lot et de la date choisis (saisie seulement)
      useEffect(() => {
        if (initial) return;
        const l = lots.find((x) => x.id === lot);
        if (l && date) {
          const d = Math.floor((new Date(date) - new Date(l.dateDebut)) / 86400000);
          if (!isNaN(d) && d >= 0) setJour(String(d));
        }
      }, [lot, date]);

      function submit(e) {

          lot, date,
          jour: Number(jour) || 0,
          temp: Number(temp) || 0,

    function Suivi() {

      const lotDe = (id) => lots.find(l => l.id === id) || {};
      // Jour d'incubation d'un événement à partir du lot et de la date
      const jourEvt = (lotId, date) => {
        const l = lots.find(x => x.id === lotId);
        if (l && date) {
          const d = Math.floor((new Date(date) - new Date(l.dateDebut)) / 86400000);
          if (!isNaN(d) && d >= 0) return d;
        }
        return null;
      };

      // Fusion des relevés + mirages + éclosions en une seule liste d'événements
      // (_src = collection d'origine, _idx = index dans cette collection → édition/suppression)
      const evts = [];
      suivis.forEach((s, i) => evts.push({
        _src: "suivis", _idx: i, _rec: s,

          <Table

            columns={["Date", "Couv.", "Lot", "Espèce", "Jour", "Type", "Temp.", "Hum.", "Clairs", "Féc.", "Ret.", "Nés", "N.écl.", "Obs", ""]}
            rows={evtsFiltres.map(ev => {
              const l = lotDe(ev.lot);
              return [
                frDate(ev.date),
                l.couveuse ? <CouveuseBadge num={l.couveuse} court /> : "—",
                <span className="font-medium">{ev.lot}</span>,

                ev.eau ? <span className="whitespace-nowrap" title="Eau ajoutée ce jour">{tiret(ev.humidite)} 💧</span> : tiret(ev.humidite),
                tiret(ev.clairs),
                ev.fecondes != null ? <span className="text-emerald-600 font-medium">{ev.fecondes}</span> : "—",
                tiret(ev.retires),
                ev.nes != null ? <span className="text-emerald-600 font-medium">{ev.nes}</span> : "—",
                tiret(ev.nonEclos),
                <ObsCell texte={ev.obs} titre={"Observation — " + ev.lot} onSave={(v) => patchLigne(ev._src, ev._idx, { obs: v })} />,
                <RowActions
                  onEdit={() => setEdit({ src: ev._src, index: ev._idx, rec: ev._rec })}
                  onDelete={() => supprimerLigne(ev._src, ev._idx)} />,
              ];
            })}
          />
          <p className="text-xs text-slate-400 mt-2">
            Types d'événement : relevé quotidien · mirage 1 · mirage 2 · éclosion. 💧 à côté de l'humidité = eau ajoutée dans la couveuse ce jour-là. Les courbes des couveuses (onglet Stats couvaison) sont calculées à partir des relevés ci-dessus.

              <EclosionForm onClose={() => setOpen(null)} />

          {edit && edit.src === "suivis" && (

              <SuiviForm initial={edit.rec} onSave={(rec) => majLigne("suivis", edit.index, rec)} onClose={() => setEdit(null)} />

          {edit && edit.src === "mirages" && (

            </Modal>

          {edit && edit.src === "eclosions" && (
            <Modal title="Modifier l'éclosion" onClose={() => setEdit(null)}>
              <EclosionForm initial={edit.rec} onSave={(rec) => majLigne("eclosions", edit.index, rec)} onClose={() => setEdit(null)} />
            </Modal>
          )}
        </div>
      );
    }
