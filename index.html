  <script>
    // PLUS de service worker : il causait des bugs de cache / mises à jour invisibles sur iPhone.
    // L'app se charge désormais TOUJOURS en direct depuis le réseau (comme un site normal) → les
    // mises à jour s'affichent immédiatement. On désinstalle tout SW existant + on vide ses caches.
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations()
        .then(function (rs) { rs.forEach(function (r) { r.unregister(); }); })
        .catch(function () {});
    }
    if (window.caches && caches.keys) {
      caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); }).catch(function () {});
    }
  </script>

    const AUJOURDHUI_ISO = (() => {

    function joursDepuis(dateStr) {
      if (!dateStr) return null;
      const a = Date.parse(String(dateStr).slice(0, 10));   // minuit UTC de la date
      const b = Date.parse(AUJOURDHUI_ISO);
      if (isNaN(a)) return null;
      return Math.round((b - a) / 86400000);

      return { futur: false, jour: jc, total, label: "J " + jc + " / " + total };

    const MOIS_COURANT = AUJOURDHUI.toISOString().slice(0, 7);   // "AAAA-MM"
    const annee = (iso) => (iso || "").slice(0, 4);
    const moisDe = (iso) => (iso || "").slice(0, 7);
    const eur = (n) => (Number(n) || 0).toLocaleString("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
    const moisFr = (ym) => {
      const noms = ["janv.", "févr.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."];
      const [y, m] = ym.split("-");
      return noms[parseInt(m, 10) - 1] + " " + y;
    };

    // Statistiques consommables : stock par article + dépenses (entrées) par mois/an.
    function statsConsommables(consommables) {
      const map = {};   // article -> agrégat
      consommables.forEach((c) => {
        const q = Number(c.quantite) || 0;
        const a = map[c.article] || (map[c.article] = { article: c.article, categorie: c.categorie, unite: c.unite, entrees: 0, sorties: 0, seuil: 0, prixRef: 0 });
        if (c.mouvement === "sortie") a.sorties += q;
        else { a.entrees += q; if (Number(c.prixUnitaire) > 0) a.prixRef = Number(c.prixUnitaire); }
        if (Number(c.seuil) > 0) a.seuil = Number(c.seuil);
        if (c.unite) a.unite = c.unite;
      });
      const parArticle = Object.keys(map).map((k) => {
        const a = map[k];
        const stock = a.entrees - a.sorties;
        return { ...a, stock, bas: a.seuil > 0 && stock <= a.seuil };
      }).sort((x, y) => x.article.localeCompare(y.article));

      const depMois = {}, depAnnee = {};
      consommables.forEach((c) => {
        if (c.mouvement === "sortie") return;                 // seules les entrées sont des dépenses
        // Dépense = prix réellement payé = (quantité × prix unitaire) − remise
        const cout = Math.max(0, (Number(c.quantite) || 0) * (Number(c.prixUnitaire) || 0) - (Number(c.remise) || 0));
        if (!cout) return;
        depMois[moisDe(c.date)] = (depMois[moisDe(c.date)] || 0) + cout;
        depAnnee[annee(c.date)] = (depAnnee[annee(c.date)] || 0) + cout;
      });
      const valeurStock = parArticle.reduce((s, a) => s + Math.max(0, a.stock) * a.prixRef, 0);
      const nbARacheter = parArticle.filter((a) => a.bas).length;
      return { parArticle, depMois, depAnnee, valeurStock, nbARacheter };
    }

    // ===== Mini-agent « Mémoire inventaire » =====
    // Propose automatiquement l'ancien fournisseur / article / seuil / unité / conditionnement.
    // Mémoire stockée dans config.memoireArticles (clé = nom d'article normalisé).
    function memArticleKey(nom) { return normLibelle(nom); }
    // Cherche un article déjà saisi : 1) correspondance exacte normalisée, sinon 2) le plus ressemblant (inclusion).
    function suggererArticle(config, nom) {
      const mem = (config && config.memoireArticles) || {};
      const k = memArticleKey(nom);
      if (!k) return null;
      if (mem[k]) return mem[k];
      // ressemblance : une clé contient l'autre (ex. "granulé poussin" ~ "granulé poussin 20 kg")
      const cands = Object.keys(mem).filter((mk) => mk.includes(k) || k.includes(mk));
      if (!cands.length) return null;
      cands.sort((a, b) => Math.abs(a.length - k.length) - Math.abs(b.length - k.length));
      return mem[cands[0]];
    }
    // Distance d'édition (Levenshtein) entre deux libellés normalisés — détecte les fautes de frappe.
    function distanceEdition(a, b) {
      a = normLibelle(a); b = normLibelle(b);
      if (a === b) return 0;
      const m = a.length, n = b.length;
      if (!m) return n; if (!n) return m;
      let prev = Array.from({ length: n + 1 }, (_, j) => j);
      for (let i = 1; i <= m; i++) {
        const cur = [i];
        for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
        prev = cur;
      }
      return prev[n];
    }
    // Article existant dont le nom est TRÈS proche du nom tapé (faute de frappe probable) mais pas identique.
    // Tolérance : 1 lettre d'écart (2 pour les noms longs). Renvoie le nom existant, ou null.
    function articleProche(config, consommables, nom) {
      const n = normLibelle(nom);
      if (n.length < 4) return null;
      const noms = new Set();
      (consommables || []).forEach((c) => { if (c.article) noms.add(String(c.article).trim()); });
      Object.values((config && config.memoireArticles) || {}).forEach((a) => { if (a && a.article) noms.add(String(a.article).trim()); });
      let best = null, bestD = Infinity;
      for (const cand of noms) {
        const cn = normLibelle(cand);
        if (cn === n) return null;   // article déjà connu tel quel → rien à signaler
        const d = distanceEdition(cn, n);
        const tol = Math.max(cn.length, n.length) >= 8 ? 2 : 1;
        if (d <= tol && d < bestD) { best = cand; bestD = d; }
      }
      return best;
    }
    // Renvoie une nouvelle config avec l'article mémorisé/mis à jour + le fournisseur ajouté à la liste auto.
    function memoriserArticle(config, rec) {
      const out = { ...config };
      const nom = (rec.article || "").trim();
      if (nom) {
        const entree = {
          article: nom,
          categorie: rec.categorie || "",
          unite: rec.unite || "",
          conditionnement: rec.conditionnement || "",
          seuil: (rec.seuil === "" || rec.seuil == null) ? "" : Number(rec.seuil) || 0,
          fournisseur: (rec.fournisseur || "").trim(),
        };
        out.memoireArticles = { ...(config.memoireArticles || {}), [memArticleKey(nom)]: entree };
      }
      out.fournisseurs = memoriserFournisseur(config, rec.fournisseur);
      return out;
    }
    // Ajoute un fournisseur à la liste auto s'il est nouveau (insensible à la casse/accents). Renvoie le tableau.
    function memoriserFournisseur(config, f) {
      const liste = ((config && config.fournisseurs) || []).slice();
      const nom = (f || "").trim();
      if (nom && !liste.some((x) => normLibelle(x) === normLibelle(nom))) liste.push(nom);
      return liste;
    }

    // Statistiques matériel : coût rattaché UNIQUEMENT à l'année d'achat (jamais recompté).
    // Répartition des états d'une ligne de matériel : { etat: nb d'unités }.
    // Une ligne peut regrouper plusieurs unités identiques (ex. 8 thermomètres) dont les états
    // diffèrent (7 bon + 1 hors service). Rétro-compatible : sans m.etats, tout est dans m.etat.
    function repartitionEtats(m) {
      const q = Number(m.quantite) || 0;
      const out = {};
      if (m.etats && typeof m.etats === "object") {
        let reste = q;
        ETATS_MATERIEL.forEach((e) => {
          const n = Math.min(reste, Math.max(0, Math.round(Number(m.etats[e]) || 0)));
          if (n > 0) { out[e] = n; reste -= n; }
        });
        if (reste > 0) out[m.etat || "bon"] = (out[m.etat || "bon"] || 0) + reste;  // unités non ventilées → état principal
        return out;
      }
      if (q > 0) out[m.etat || "bon"] = q;
      return out;
    }
    // Unités en état de marche = neuf + bon + à surveiller
    function nbEnMarche(m) {
      const r = repartitionEtats(m);
      return (r["neuf"] || 0) + (r["bon"] || 0) + (r["à surveiller"] || 0);
    }
    // Sous le seuil d'alerte (même logique que les consommables : seuil > 0 et unités en marche <= seuil)
    function materielSousSeuil(m) {
      const s = Number(m.seuil) || 0;
      return s > 0 && nbEnMarche(m) <= s;
    }
    function statsMateriel(materiel) {
      const depAnnee = {};
      let valeurTotale = 0;
      // Listes PAR UNITÉ : { m, nb, q } = nb unités concernées sur q au total (ex. 1 HS sur 8)
      const aReparer = [], horsService = [], aRemplacer = [], sousSeuil = [];
      let nbAReparer = 0;
      materiel.forEach((m) => {
        const valeurReelle = (Number(m.quantite) || 0) * (Number(m.prixUnitaire) || 0);
        const paye = Math.max(0, valeurReelle - (Number(m.remise) || 0));  // prix réellement payé (remise déduite)
        valeurTotale += valeurReelle;                                       // « valeur réelle » du parc conservée
        depAnnee[annee(m.dateAchat)] = (depAnnee[annee(m.dateAchat)] || 0) + paye;
        if (m.etat === "remplacé") return;   // ligne sortie du parc : plus d'alerte
        const rep = repartitionEtats(m);
        const q = Number(m.quantite) || 0;
        const push = (arr, etat) => { const nb = rep[etat] || 0; if (nb > 0) { arr.push({ m, nb, q }); nbAReparer += nb; } };
        push(aReparer, "à réparer"); push(horsService, "hors service"); push(aRemplacer, "à remplacer");
        if (materielSousSeuil(m)) sousSeuil.push({ m, marche: nbEnMarche(m) });
      });
      return {
        depAnnee, valeurTotale, depenseAnneeCourante: depAnnee[String(ANNEE_COURANTE)] || 0,
        aReparer, horsService, aRemplacer, sousSeuil, nbAReparer,
      };
    }

    // Normalise les collectes en événements œufs {date, espece, nombre, destination, lotStock}.
    // Gère le nouveau modèle (destination + lotStock), l'intermédiaire (lot/couvaison) et l'ancien (recoltes/consommation/stockes).
    function evtsOeufs(collectes) {
      const out = [];
      collectes.forEach((c, idx) => {
        if (c.destination) {
          out.push({ date: c.date, espece: c.espece, nombre: Number(c.nombre) || 0, destination: c.destination, lotStock: c.lotStock || c.lot || "", _idx: idx });
        } else {
          const conso = Number(c.consommation) || 0, stk = Number(c.stockes) || 0, rec = Number(c.recoltes) || 0;
          const reste = Math.max(0, rec - conso - stk);
          if (conso > 0) out.push({ date: c.date, espece: c.espece, nombre: conso, destination: "consommation", lotStock: "", _idx: idx });
          if (stk > 0) out.push({ date: c.date, espece: c.espece, nombre: stk, destination: "stock", lotStock: c.lotFutur || "", _idx: idx });
          if (reste > 0) out.push({ date: c.date, espece: c.espece, nombre: reste, destination: "stock", lotStock: "", _idx: idx });
        }
      });
      return out;
    }

    // Statistiques œufs, ventilées poule / caille. Anti-double-comptage :
    // - consommé ≠ stock ≠ couveuse ;
    // - stock ACTIF = collectes "stock" dont le lot est "en stock" ;
    // - couveuse = œufs des LOTS D'INCUBATION en cours (statut "en couveuse"), pas des collectes.
    function statsOeufs(collectes, lotsStock, lots, config) {
      const ev = evtsOeufs(collectes);
      const statutLot = {}; (lotsStock || []).forEach((l) => { statutLot[l.id] = l.statut; });
      const lotActif = (e) => (statutLot[e.lotStock] || "en stock") === "en stock";   // sans lot connu → considéré actif
      const today = AUJOURDHUI.toISOString().slice(0, 10);
      const mois = MOIS_COURANT, an = String(ANNEE_COURANTE);
      const som = (pred) => ev.filter(pred).reduce((s, e) => s + e.nombre, 0);
      const prix = Number(config.prixOeuf) || 0;

      // Consommation (collectes destination "consommation")
      const consoPoule = som((e) => e.destination === "consommation" && e.espece === "poule");
      const consoCaille = som((e) => e.destination === "consommation" && e.espece === "caille");
      const consoAn = som((e) => e.destination === "consommation" && annee(e.date) === an);

      // Stock actif (collectes "stock" d'un lot encore "en stock")
      const stockPoule = som((e) => e.destination === "stock" && lotActif(e) && e.espece === "poule");
      const stockCaille = som((e) => e.destination === "stock" && lotActif(e) && e.espece === "caille");

      // Couveuse = lots d'incubation en cours (statut "en couveuse")
      const lotsCouv = (lots || []).filter((l) => l.statut === "en couveuse");
      const couvPoule = lotsCouv.filter((l) => l.espece === "poule").reduce((s, l) => s + (Number(l.nbOeufs) || 0), 0);
      const couvCaille = lotsCouv.filter((l) => l.espece === "caille").reduce((s, l) => s + (Number(l.nbOeufs) || 0), 0);

      const consoParMois = {};
      ev.filter((e) => e.destination === "consommation").forEach((e) => { consoParMois[moisDe(e.date)] = (consoParMois[moisDe(e.date)] || 0) + e.nombre; });

      return {
        ev,
        recoltesJour: som((e) => e.date === today),
        consoJour: som((e) => e.destination === "consommation" && e.date === today),
        couvaisonJour: som((e) => e.destination === "couvaison" && e.date === today),
        consoMois: som((e) => e.destination === "consommation" && moisDe(e.date) === mois),
        consoAn, economieAn: consoAn * prix,
        // par espèce + totaux
        consoPoule, consoCaille, consoTotal: consoPoule + consoCaille,
        stockPoule, stockCaille, stockActif: stockPoule + stockCaille,
        couvPoule, couvCaille, enCouvaison: couvPoule + couvCaille,
        consoParMois,
      };
    }

    // Renvoie une URL d'image AFFICHABLE si possible, sinon null.
    // - lien "File:xxx.jpg"  → converti en image directe (Special:FilePath)
    // - lien direct .jpg/.png → tel quel
    // - lien "Category:xxx"   → null (pas d'image directe → on affichera une vignette + le lien source)
    function imageAffichable(url) {
      if (!url) return null;
      if (/^data:image\//.test(url)) return url;   // photo perso téléversée (stockée en base64)
      const f = url.match(/\/wiki\/File:(.+)$/);
      if (f) return "https://commons.wikimedia.org/wiki/Special:FilePath/" + f[1];
      if (/\.(jpe?g|png|gif|webp)$/i.test(url)) return url;
      return null;
    }
    // Lit une photo choisie par l'utilisateur, la réduit (max 700 px) et la compresse en JPEG
    // → chaîne base64 assez légère pour le localStorage / la synchro. cb(dataUrl).
    function lireImageCompressee(file, cb) {
      if (!file || !/^image\//.test(file.type)) return;
      const img = new Image();
      img.onload = () => {
        const max = 700;
        const ratio = Math.min(1, max / Math.max(img.width, img.height));
        const cv = document.createElement("canvas");
        cv.width = Math.max(1, Math.round(img.width * ratio));
        cv.height = Math.max(1, Math.round(img.height * ratio));
        cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
        URL.revokeObjectURL(img.src);
        cb(cv.toDataURL("image/jpeg", 0.8));
      };
      img.src = URL.createObjectURL(file);
    }
    // Champ « photo » réutilisable : bouton 📷 (téléverse + compresse), aperçu, suppression.
    function PhotoPicker({ value, onChange }) {
      const src = imageAffichable(value);
      return (
        <div className="flex items-center gap-3">
          {src
            ? <img src={src} alt="aperçu" className="w-16 h-16 object-cover rounded-lg border border-slate-200 bg-slate-50" />
            : <span className="w-16 h-16 flex items-center justify-center rounded-lg border border-dashed border-slate-300 text-2xl text-slate-300">📷</span>}
          <div className="flex flex-col gap-1">
            <label className="px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium cursor-pointer text-center whitespace-nowrap">
              📷 Choisir une photo
              <input type="file" accept="image/*" className="hidden" onChange={(e) => { const f = e.target.files && e.target.files[0]; if (f) lireImageCompressee(f, onChange); e.target.value = ""; }} />
            </label>
            {src && <button type="button" onClick={() => onChange("")} className="text-xs text-red-500 hover:underline">Supprimer la photo</button>}
          </div>
        </div>
      );
    }

    /* ============================================================
       COUCHE DONNÉES (Context + localStorage)
       Aujourd'hui : stockage local du navigateur.
       Demain : on remplacera le contenu de DataProvider par des appels Supabase,
       sans toucher aux pages (elles utilisent juste useData()).
       ============================================================ */
    const DataContext = createContext(null);
    const useData = () => useContext(DataContext);

    // Clés localStorage centralisées (servent au stockage ET à l'export/import)
    const STORE_KEYS = {
      lots:          "cheptel_lots_v1",
      suivis:        "cheptel_suivis_v1",
      mirages:       "cheptel_mirages_v1",
      eclosions:     "cheptel_eclosions_v1",
      races:         "cheptel_races_v3",
      reproducteurs: "cheptel_reproducteurs_v1",
      abattoir:      "cheptel_abattoir_v1",
      collectes:     "cheptel_collectes_v1",
      consommables:  "cheptel_consommables_v1",
      materiel:      "cheptel_materiel_v1",
      poulaillers:   "cheptel_poulaillers_v1",
      poussins:      "cheptel_poussins_v1",
      lotsStock:     "cheptel_lotsstock_v1",
      breederPurchases: "cheptel_breeder_purchases_v1",
      sujets:        "cheptel_sujets_v1",   // identification individuelle (bagues, sexage, croisement)
      config:        "cheptel_config_v1",
    };
    const sujetsSeed = [];

    // Export : télécharge un fichier JSON contenant toutes les collections
    function exporterDonnees(store) {
      const data = { _app: "cheptel", _version: 1, _exportedAt: new Date().toISOString() };
      Object.keys(STORE_KEYS).forEach((k) => { data[k] = store[k]; });
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "cheptel-sauvegarde-" + new Date().toISOString().slice(0, 10) + ".json";
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
    }

    // Import : relit un fichier JSON exporté, écrit dans localStorage puis recharge
    function importerDonnees(file) {
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          let n = 0;
          Object.keys(STORE_KEYS).forEach((k) => {
            if (k === "config") {
              if (data.config && typeof data.config === "object") { localStorage.setItem(STORE_KEYS.config, JSON.stringify(data.config)); n++; }
            } else if (Array.isArray(data[k])) {
              localStorage.setItem(STORE_KEYS[k], JSON.stringify(data[k])); n++;
            }
          });
          if (!n) { alert("Aucune donnée Cheptel reconnue dans ce fichier."); return; }
          alert("Import réussi (" + n + " tables). L'application va se recharger.");
          location.reload();
        } catch (e) {
          alert("Fichier JSON invalide : " + e.message);
        }
      };
      reader.readAsText(file);
    }

    /* ============================================================
       SYNCHRONISATION CLOUD (Supabase) — hybride : local + cloud, avec connexion
       Le local reste la source en session ; le cloud est la copie synchronisée.
       Toutes les données sont stockées dans 1 ligne (type='snapshot') par utilisateur.
       ============================================================ */
    const SUPABASE_URL = "https://efyxufdtrgcgzpfhrmwh.supabase.co";
    const SUPABASE_KEY = "sb_publishable_Bc6FUEQBIsF7ciMiREHJVw_N99uh1jp";
    let _sb = null;
    function getSb() {
      if (!_sb && window.supabase) {
        _sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      }
      return _sb;
    }
    // Construit l'instantané complet depuis le localStorage
    function snapshotLocal() {
      const snap = {};
      Object.keys(STORE_KEYS).forEach((k) => {
        try { const v = localStorage.getItem(STORE_KEYS[k]); if (v != null) snap[k] = JSON.parse(v); } catch (e) {}
      });
      return snap;
    }
    // ===== État de sauvegarde (pour l'indicateur global de la barre latérale) =====
    // status : "local" (pas de compte cloud) · "pending" (modif en attente) · "saving" · "saved" · "error"
    const _syncListeners = new Set();
    let _syncState = { status: "local", at: (function () { try { return localStorage.getItem("cheptel_lastSync"); } catch (e) { return null; } })() };
    function _setSync(status, at) {
      _syncState = { status, at: at !== undefined ? at : _syncState.at };
      _syncListeners.forEach((fn) => { try { fn(_syncState); } catch (e) {} });
    }
    function useSyncState() {
      const [s, setS] = useState(_syncState);
      useEffect(() => { _syncListeners.add(setS); setS(_syncState); return () => { _syncListeners.delete(setS); }; }, []);
      return s;
    }
    // Alerte (une seule fois par session) si l'écriture locale échoue (mémoire pleine, navigation privée…).
    // Évite l'échec SILENCIEUX : l'utilisatrice est prévenue que ses saisies ne sont pas gardées.
    let _saveKO = false;
    function signalerSauvegardeKO(e) {
      try { console.error("Cheptel: échec d'écriture localStorage", e); } catch (x) {}
      if (_saveKO) return; _saveKO = true;
      _setSync("error");
      try { window.alert("⚠️ Enregistrement impossible sur cet appareil (mémoire pleine, ou navigation privée).\n\nTes nouvelles saisies ne sont PAS gardées. Exporte tout de suite tes données : menu ☰ → bouton ⬇️."); } catch (x) {}
    }

    // « il y a X » à partir d'une date ISO
    function tempsRelatif(iso) {
      if (!iso) return "—";
      const s = Math.max(0, Math.round((Date.now() - Date.parse(iso)) / 1000));
      if (s < 60) return "à l'instant";
      const m = Math.round(s / 60); if (m < 60) return "il y a " + m + " min";
      const h = Math.round(m / 60); if (h < 24) return "il y a " + h + " h";
      const j = Math.round(h / 24); return "il y a " + j + " j";
    }

    // Envoie l'instantané local vers le cloud (upsert de la ligne snapshot)
    async function pushCloud() {
      const c = getSb(); if (!c) { _setSync("local"); return false; }
      try {
        const { data: { user } } = await c.auth.getUser(); if (!user) { _setSync("local"); return false; }
        _setSync("saving");
        const snap = snapshotLocal();
        const { data: existing } = await c.from("cheptel_data").select("id").eq("type", "snapshot").limit(1);
        if (existing && existing.length) {
          await c.from("cheptel_data").update({ data: snap, updated_at: new Date().toISOString() }).eq("id", existing[0].id);
        } else {
          await c.from("cheptel_data").insert({ type: "snapshot", data: snap });
        }
        const iso = new Date().toISOString();
        try { localStorage.setItem("cheptel_lastSync", iso); } catch (e) {}
        _setSync("saved", iso);
        return true;
      } catch (e) { _setSync("error"); return false; }
    }
    // Récupère l'instantané cloud → écrit dans localStorage. Renvoie true si trouvé.
    async function pullCloud() {
      const c = getSb(); if (!c) return false;
      const { data } = await c.from("cheptel_data").select("data,updated_at").eq("type", "snapshot").limit(1);
      if (data && data.length && data[0].data) {
        const snap = data[0].data;
        Object.keys(STORE_KEYS).forEach((k) => {
          if (snap[k] !== undefined) { try { localStorage.setItem(STORE_KEYS[k], JSON.stringify(snap[k])); } catch (e) {} }
        });
        const iso = new Date().toISOString();
        try { localStorage.setItem("cheptel_lastSync", iso); } catch (e) {}
        _setSync("saved", iso);
        return true;
      }
      return false;
    }
    // Push différé (anti-rafale) déclenché après chaque modification
    let _pushTimer = null;
    function pushCloudDiffere() {
      if (!getSb()) return;          // mode local : pas de cloud, l'indicateur reste « local »
      _setSync("pending");
      clearTimeout(_pushTimer);
      _pushTimer = setTimeout(() => { pushCloud().catch(() => _setSync("error")); }, 1500);
    }

    // Petit hook : un état persistant dans localStorage (une "collection")
    function useCollection(cle, graine) {
      const [data, setData] = useState(() => {
        try {
          const brut = localStorage.getItem(cle);
          if (brut) return JSON.parse(brut);
        } catch (e) {}
        return graine;
      });
      useEffect(() => {
        try { localStorage.setItem(cle, JSON.stringify(data)); } catch (e) { signalerSauvegardeKO(e); }
      }, [data]);
      const ajouter = (item) => setData((prev) => prev.concat([item]));
      return [data, ajouter, setData];
    }

    // Génère le prochain numéro de lot pour une espèce/année : 26P01, 26P02, 26C01…
    function genLotId(lots, espece, dateIso) {
      const an = String(new Date(dateIso).getFullYear()).slice(-2);
      const prefixe = an + (espece === "poule" ? "P" : "C");
      const nums = lots
        .filter((l) => l.id && l.id.indexOf(prefixe) === 0)
        .map((l) => parseInt(l.id.slice(prefixe.length), 10) || 0);
      const suivant = (nums.length ? Math.max.apply(null, nums) : 0) + 1;
      return prefixe + String(suivant).padStart(2, "0");
    }

    // Numéro de lot de STOCK : 26P001, 26C001… (3 chiffres pour le distinguer des lots couveuse)
    function genLotStockId(lotsStock, espece, dateIso) {
      const an = String(new Date(dateIso || Date.now()).getFullYear()).slice(-2);
      const prefixe = an + (espece === "poule" ? "P" : "C");
      const nums = lotsStock
        .filter((l) => l.id && l.id.indexOf(prefixe) === 0)
        .map((l) => parseInt(l.id.slice(prefixe.length), 10) || 0);
      const suivant = (nums.length ? Math.max.apply(null, nums) : 0) + 1;
      return prefixe + String(suivant).padStart(3, "0");
    }

    // Numéro de lot de NAISSANCE (poussins/cailleteaux) : 26PN01, 26CN01…
    function genPoussinId(poussins, espece, dateIso) {
      const an = String(new Date(dateIso || Date.now()).getFullYear()).slice(-2);
      const prefixe = an + (espece === "caille" ? "C" : "P") + "N";
      const nums = poussins
        .filter((p) => p.id && p.id.indexOf(prefixe) === 0)
        .map((p) => parseInt(p.id.slice(prefixe.length), 10) || 0);
      const suivant = (nums.length ? Math.max.apply(null, nums) : 0) + 1;
      return prefixe + String(suivant).padStart(2, "0");
    }

    // Agrège un lot de stock avec ses collectes (total, période)
    function agregLotStock(b, collectes) {
      const cs = collectes.filter((c) => c.destination === "stock" && (c.lotStock || "") === b.id);
      const dates = cs.map((c) => c.date).filter(Boolean).sort();
      return { ...b, collectes: cs, total: cs.reduce((s, c) => s + (Number(c.nombre) || 0), 0), premiere: dates[0] || null, derniere: dates[dates.length - 1] || null };
    }

    function DataProvider({ children }) {
      const [lots, ajouterLot, setLots]        = useCollection(STORE_KEYS.lots, lotsSeed);
      const [suivis, ajouterSuivi, setSuivis]  = useCollection(STORE_KEYS.suivis, suivisSeed);
      const [mirages, ajouterMirage, setMirages] = useCollection(STORE_KEYS.mirages, miragesSeed);
      const [eclosions, ajouterEclosion, setEclosions] = useCollection(STORE_KEYS.eclosions, eclosionsSeed);
      const [races, ajouterRace, setRaces]     = useCollection(STORE_KEYS.races, racesSeed);
      const [reproducteurs, ajouterReproducteur, setReproducteurs] = useCollection(STORE_KEYS.reproducteurs, reproducteursSeed);
      const [abattoir, ajouterAbattoir, setAbattoir] = useCollection(STORE_KEYS.abattoir, abattoirSeed);
      const [collectes, ajouterCollecte, setCollectes] = useCollection(STORE_KEYS.collectes, collectesSeed);
      const [consommables, ajouterConsommable, setConsommables] = useCollection(STORE_KEYS.consommables, consommablesSeed);
      const [materiel, ajouterMateriel, setMateriel] = useCollection(STORE_KEYS.materiel, materielSeed);
      const [poulaillers, ajouterPoulailler, setPoulaillers] = useCollection(STORE_KEYS.poulaillers, poulaillersSeed);
      const [poussins, ajouterPoussin, setPoussins] = useCollection(STORE_KEYS.poussins, poussinsSeed);
      const [lotsStock, ajouterLotStock, setLotsStock] = useCollection(STORE_KEYS.lotsStock, lotsStockSeed);
      const [breederPurchases, ajouterBreederPurchase, setBreederPurchases] = useCollection(STORE_KEYS.breederPurchases, breederPurchasesSeed);
      const [sujets, ajouterSujet, setSujets] = useCollection(STORE_KEYS.sujets, sujetsSeed);

      // Base de données / réglages : objet config persistant, fusionné avec les défauts
      const [config, setConfig] = useState(() => {
        try { const b = localStorage.getItem(STORE_KEYS.config); if (b) return mergeConfig(configDefaut, JSON.parse(b)); } catch (e) {}
        return configDefaut;
      });
      useEffect(() => { try { localStorage.setItem(STORE_KEYS.config, JSON.stringify(config)); } catch (e) { signalerSauvegardeKO(e); } }, [config]);

      // Setters par clé → CRUD générique (modifier / supprimer / patch) sur toutes les tables
      const setters = {
        lots: setLots, suivis: setSuivis, mirages: setMirages, eclosions: setEclosions,
        races: setRaces, reproducteurs: setReproducteurs, abattoir: setAbattoir,
        collectes: setCollectes, consommables: setConsommables, materiel: setMateriel,
        poulaillers: setPoulaillers, poussins: setPoussins, lotsStock: setLotsStock,
        breederPurchases: setBreederPurchases, sujets: setSujets,
      };

      const store = {
        lots, ajouterLot,
        suivis, ajouterSuivi,
        mirages, ajouterMirage,
        eclosions, ajouterEclosion,
        races, ajouterRace,
        reproducteurs, ajouterReproducteur,
        abattoir, ajouterAbattoir,
        collectes, ajouterCollecte,
        consommables, ajouterConsommable,
        materiel, ajouterMateriel,
        poulaillers, ajouterPoulailler,
        poussins, ajouterPoussin,
        lotsStock, ajouterLotStock,
        breederPurchases, ajouterBreederPurchase,
        sujets, ajouterSujet,
        config, setConfig, resetConfig: () => setConfig(configDefaut),
        majLigne: (cle, index, item) => setters[cle]((prev) => prev.map((x, i) => (i === index ? item : x))),
        patchLigne: (cle, index, patch) => setters[cle]((prev) => prev.map((x, i) => (i === index ? { ...x, ...patch } : x))),
        supprimerLigne: (cle, index) => setters[cle]((prev) => prev.filter((_, i) => i !== index)),
        majMaterielEtat: (index, etat) => setMateriel((prev) => prev.map((m, i) => (i === index ? { ...m, etat, etats: null } : m))),  // état global → efface la ventilation par unité
        genLotId: (espece, dateIso) => genLotId(lots, espece, dateIso),
        genLotStockId: (espece, dateIso) => genLotStockId(lotsStock, espece, dateIso),
        genPoussinId: (espece, dateIso) => genPoussinId(poussins, espece, dateIso),
        // Met un lot de stock en couveuse : crée le lot d'incubation + bascule le lot de stock
        mettreLotEnCouvaison: (batchId, espece, total, couveuse, dateCouvaison) => {
          const lotId = genLotId(lots, espece, dateCouvaison);
          ajouterLot({ id: lotId, espece, couveuse: Number(couveuse) || 1, dateDebut: dateCouvaison, nbOeufs: Number(total) || 0, statut: "en couveuse", obs: "Issu du lot de stock " + batchId });
          setLotsStock((prev) => prev.map((b) => (b.id === batchId ? { ...b, statut: "mis en couveuse", dateCouvaison, lotCouvaison: lotId } : b)));
          return lotId;
        },
      };

      // Auto-synchronisation cloud : envoi différé après toute modification (si connecté)
      const premierRendu = useRef(true);
      useEffect(() => {
        if (premierRendu.current) { premierRendu.current = false; return; }  // ne pas re-pousser ce qu'on vient de charger
        pushCloudDiffere();
      }, [lots, suivis, mirages, eclosions, races, reproducteurs, abattoir, collectes, consommables, materiel, poulaillers, poussins, lotsStock, breederPurchases, sujets, config]);

      return <DataContext.Provider value={store}>{children}</DataContext.Provider>;
    }

    /* ============================================================
       COMPOSANTS UI
       ============================================================ */
    // Classes complètes (Tailwind CDN ne génère pas les classes construites dynamiquement)
    const COLOR_TEXT = {
      emerald: "text-emerald-600",
      orange: "text-orange-500",
      indigo: "text-indigo-600",
      purple: "text-purple-600",
      red: "text-red-600",
      slate: "text-slate-600",
    };
    function StatCard({ label, value, sub, color = "emerald" }) {
      return (
        <div className="bg-white rounded-xl shadow-sm p-5 border border-slate-100">
          <p className="text-sm text-slate-500">{label}</p>
          <p className={`text-3xl font-bold mt-1 ${COLOR_TEXT[color]}`}>{value}</p>
          {sub && <p className="text-xs text-slate-400 mt-1">{sub}</p>}
        </div>
      );
    }

    function StatusBadge({ statut }) {
      const map = {
        "en stockage": "bg-amber-100 text-amber-700",
        "en couveuse": "bg-blue-100 text-blue-700",
        "terminé": "bg-slate-200 text-slate-600",
        // anciens libellés (compatibilité)
        "En cours": "bg-blue-100 text-blue-700",
        "Terminé": "bg-slate-200 text-slate-600",
      };
      return <span className={`px-2 py-0.5 rounded-full text-xs font-medium ${map[statut] || "bg-slate-100 text-slate-600"}`}>{statut}</span>;
    }

    // Badge de type d'événement dans le suivi journalier
    function EventBadge({ type }) {
      const map = {
        "relevé":   "bg-slate-100 text-slate-600",
        "mirage 1": "bg-amber-100 text-amber-700",
        "mirage 2": "bg-orange-100 text-orange-700",
        "éclosion": "bg-emerald-100 text-emerald-700",
      };
      return <span className={`px-2 py-0.5 rounded-full text-xs font-medium whitespace-nowrap ${map[type] || "bg-slate-100 text-slate-600"}`}>{type}</span>;
    }

    // Construit un tracé SVG lissé (Catmull-Rom → Bézier) à partir de points [x,y]
    function smoothPath(pts) {
      if (!pts.length) return "";
      if (pts.length < 3) return pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
      let d = "M " + pts[0][0].toFixed(1) + " " + pts[0][1].toFixed(1);
      for (let i = 0; i < pts.length - 1; i++) {
        const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
        const c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = p1[1] + (p2[1] - p0[1]) / 6;
        const c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = p2[1] - (p3[1] - p1[1]) / 6;
        d += " C " + c1x.toFixed(1) + " " + c1y.toFixed(1) + ", " + c2x.toFixed(1) + " " + c2y.toFixed(1) + ", " + p2[0].toFixed(1) + " " + p2[1].toFixed(1);
      }
      return d;
    }

    // Graphique SVG en courbe LISSE sur l'axe des jours d'incubation (J 0 → J max).
    // norme = [{x,y}] optionnel : courbe des valeurs attendues (gris/vert clair).
    function LineChart({ points, xMax, unit, color, titre, norme, band, ligne }) {
      const W = 320, H = 150, pl = 36, pb = 24, pt = 14, pr = 12;
      const iw = W - pl - pr, ih = H - pt - pb;
      const ligneN = ligne || norme;   // compat : `norme` = ancienne ligne unique
      const hasReal = points && points.length > 0;
      const hasBand = band && band.length > 0;
      const hasLigne = ligneN && ligneN.length > 0;
      if (!hasReal && !hasBand && !hasLigne) {
        return <div className="text-xs text-slate-400 flex items-center justify-center" style={{ height: H }}>Pas encore de relevé</div>;
      }
      const ys = (hasReal ? points.map(p => p.y) : [])
        .concat(hasLigne ? ligneN.map(p => p.y) : [])
        .concat(hasBand ? band.map(p => p.lo) : [])
        .concat(hasBand ? band.map(p => p.hi) : []);
      let lo = Math.min.apply(null, ys), hi = Math.max.apply(null, ys);
      if (lo === hi) { lo -= 1; hi += 1; }
      const pad = (hi - lo) * 0.2 || 1; lo -= pad; hi += pad;
      const sx = (x) => pl + (xMax ? x / xMax : 0) * iw;
      const sy = (y) => pt + ih - ((y - lo) / (hi - lo)) * ih;
      const d = hasReal ? smoothPath(points.map(p => [sx(p.x), sy(p.y)])) : "";
      const dL = hasLigne ? smoothPath(ligneN.map(p => [sx(p.x), sy(p.y)])) : "";
      // Aire de la bande min/max : haut (gauche→droite) puis bas (droite→gauche)
      const dBand = hasBand
        ? "M" + band.map(p => sx(p.x) + "," + sy(p.hi)).join(" L") + " L" + band.slice().reverse().map(p => sx(p.x) + "," + sy(p.lo)).join(" L") + " Z"
        : "";
      return (
        <div>
          <div className="flex items-center justify-between mb-1">
            <span className="text-xs font-medium text-slate-600">{titre}</span>
            <span className="text-[10px] text-slate-400 flex items-center gap-2">
              {hasBand && <span className="flex items-center gap-1"><span className="inline-block w-3 h-2 bg-emerald-100 border border-emerald-300"></span>zone norme</span>}
              {hasLigne && <span className="flex items-center gap-1"><span className="inline-block w-3 h-0.5 bg-emerald-400"></span>cible</span>}
            </span>
          </div>
          <svg viewBox={`0 0 ${W} ${H}`} className="w-full" style={{ maxHeight: 170 }}>
            <line x1={pl} y1={pt} x2={pl} y2={pt + ih} stroke="#e2e8f0" />
            <line x1={pl} y1={pt + ih} x2={pl + iw} y2={pt + ih} stroke="#e2e8f0" />
            <text x={pl - 5} y={pt + 4} textAnchor="end" fontSize="9" fill="#94a3b8">{hi.toFixed(0)}{unit}</text>
            <text x={pl - 5} y={pt + ih} textAnchor="end" fontSize="9" fill="#94a3b8">{lo.toFixed(0)}{unit}</text>
            <text x={pl} y={H - 6} textAnchor="start" fontSize="9" fill="#94a3b8">J 0</text>
            <text x={pl + iw} y={H - 6} textAnchor="end" fontSize="9" fill="#94a3b8">J {xMax}</text>
            {/* zone de norme (bande min/max) */}
            {hasBand && <path d={dBand} fill="#bbf7d0" fillOpacity="0.5" stroke="none" />}
            {/* ligne cible */}
            {hasLigne && <path d={dL} fill="none" stroke="#34d399" strokeWidth="2" strokeDasharray="4 3" strokeLinejoin="round" strokeLinecap="round" />}
            {/* courbe réelle (au-dessus, bien visible) */}
            {hasReal && <path d={d} fill="none" stroke={color} strokeWidth="2.25" strokeLinejoin="round" strokeLinecap="round" />}
            {hasReal && points.map((p, i) => <circle key={i} cx={sx(p.x)} cy={sy(p.y)} r="2" fill={color} />)}
          </svg>
        </div>
      );
    }

    // Normes d'incubation : lues depuis la config (modifiables dans Réglages), à base de phases.
    function normeEspece(config, espece) {
      return (config && config.normes && config.normes[espece]) || configDefaut.normes[espece] || configDefaut.normes.poule;
    }
    // Renvoie la phase couvrant le jour j (première phase dont jusqua >= j, sinon la dernière)
    function phaseDuJour(n, j) {
      const ph = (n && n.phases) || [];
      if (!ph.length) return { temp: 37.5, hum: 55 };
      return ph.find((p) => j <= Number(p.jusqua)) || ph[ph.length - 1];
    }
    function normeTemp(config, espece, j) { return Number(phaseDuJour(normeEspece(config, espece), j).temp); }
    function normeHum(config, espece, j)  { return Number(phaseDuJour(normeEspece(config, espece), j).hum); }
    // Construit la série de norme sur 0..total (un point par jour)
    function serieNorme(config, espece, total, fn) {
      const out = [];
      for (let j = 0; j <= total; j++) out.push({ x: j, y: fn(config, espece, j) });
      return out;
    }

    // ===== Normes détaillées température/humidité par plage de jours =====
    function normesCouvaisonEsp(config, espece) {
      return (config && config.normesCouvaison && config.normesCouvaison[espece]) || configDefaut.normesCouvaison[espece] || [];
    }
    // Norme applicable à un jour d'incubation (cible/min/max temp + min/max humidité). found:false si aucune plage.
    function normeJour(config, espece, jour) {
      const arr = normesCouvaisonEsp(config, espece);
      const r = arr.find((x) => x.actif !== false && Number(jour) >= Number(x.jDebut) && Number(jour) <= Number(x.jFin));
      if (!r) return { found: false };
      const num = (v) => (v === "" || v == null ? null : Number(v));
      return {
        found: true, tempCible: num(r.tempCible), tempMin: num(r.tempMin), tempMax: num(r.tempMax),
        humMin: num(r.humMin), humMax: num(r.humMax), phase: r.phase || "", obs: r.obs || "",
        jDebut: Number(r.jDebut), jFin: Number(r.jFin),
      };
    }
    // Durée d'incubation = plus grand jFin des normes (sinon config.normes.duree, sinon DUREE)
    function dureeEspece(config, espece) {
      const arr = normesCouvaisonEsp(config, espece);
      const maxJ = arr.reduce((m, x) => Math.max(m, Number(x.jFin) || 0), 0);
      const dn = config && config.normes && config.normes[espece] && config.normes[espece].duree;
      return maxJ || dn || DUREE[espece] || 21;
    }
    // Statut d'une valeur vs intervalle [min,max] : "ok" | "bas" | "haut" | "?"
    function statutIntervalle(val, min, max) {
      if (val == null || val === "" || isNaN(Number(val))) return "?";
      const v = Number(val);
      if (min != null && v < min) return "bas";
      if (max != null && v > max) return "haut";
      return "ok";
    }
    // Tolérance température effective (min/max explicites sinon ±0,3 autour de la cible)
    function bornesTemp(n) {
      const min = n.tempMin != null ? n.tempMin : (n.tempCible != null ? n.tempCible - 0.3 : null);
      const max = n.tempMax != null ? n.tempMax : (n.tempCible != null ? n.tempCible + 0.3 : null);
      return { min, max };
    }
    // Séries pour les graphiques (un point par jour 0..total) — utilise le 1er jour pour J0
    function serieBande(config, espece, total, champLo, champHi) {
      const out = [];
      for (let j = 0; j <= total; j++) {
        const n = normeJour(config, espece, Math.max(1, j));
        if (n.found) out.push({ x: j, lo: n[champLo], hi: n[champHi] });
      }
      return out;
    }
    function serieCible(config, espece, total, champ) {
      const out = [];
      for (let j = 0; j <= total; j++) {
        const n = normeJour(config, espece, Math.max(1, j));
        if (n.found && n[champ] != null) out.push({ x: j, y: n[champ] });
      }
      return out;
    }
    // Alertes couvaison d'un lot (espèce + dernier relevé vs norme du jour). Renvoie { jour, total, dernier, n, alertes:[] }
    function alertesCouvaison(lot, releves, config) {
      const total = dureeEspece(config, lot.espece);
      const jour = Math.max(0, Math.min(joursEcoules(lot.dateDebut), total));
      const dernier = (releves && releves.length) ? releves[releves.length - 1] : null;
      const alertes = [];
      if (jour > total) alertes.push("J" + jour + " hors durée normale (max J" + total + " pour " + lot.espece + ")");
      const n = normeJour(config, lot.espece, Math.max(1, jour));
      if (!n.found) { alertes.push("Norme non trouvée pour J" + jour + " (" + lot.espece + ")"); return { jour, total, dernier, n, alertes }; }
      if (dernier) {
        const bt = bornesTemp(n);
        const st = statutIntervalle(dernier.temp, bt.min, bt.max);
        if (st === "bas") alertes.push("Température trop basse (" + dernier.temp + " °C · cible " + n.tempCible + ")");
        if (st === "haut") alertes.push("Température trop haute (" + dernier.temp + " °C · cible " + n.tempCible + ")");
        const sh = statutIntervalle(dernier.humidite, n.humMin, n.humMax);
        if (sh === "bas") alertes.push("Humidité trop basse (" + dernier.humidite + " % · min " + n.humMin + ")");
        if (sh === "haut") alertes.push("Humidité trop haute (" + dernier.humidite + " % · max " + n.humMax + ")");
      }
      return { jour, total, dernier, n, alertes };
    }
    // Pastille de statut OK / trop bas / trop haut / à vérifier
    function PastilleStatut({ statut }) {
      const map = { ok: ["bg-emerald-100 text-emerald-700", "OK"], bas: ["bg-blue-100 text-blue-700", "trop bas"], haut: ["bg-red-100 text-red-700", "trop haut"], "?": ["bg-slate-100 text-slate-500", "à vérifier"] };
      const [cls, lbl] = map[statut] || map["?"];
      return <span className={"px-2 py-0.5 rounded-full text-xs font-medium " + cls}>{lbl}</span>;
    }

    // Graphique en courbe lisse sur une suite de dates (séries de la collecte d'œufs).
    // data = [{ label, y }] déjà trié chronologiquement.
    function SeriesChart({ data, unit, color, titre }) {
      const W = 320, H = 150, pl = 36, pb = 26, pt = 14, pr = 12;
      const iw = W - pl - pr, ih = H - pt - pb;
      const pts = (data || []).filter(d => d.y != null && !isNaN(d.y));
      if (pts.length === 0) {
        return (
          <div>
            <div className="text-xs font-medium text-slate-600 mb-1">{titre}</div>
            <div className="text-xs text-slate-400 flex items-center justify-center" style={{ height: H }}>Pas encore de données</div>
          </div>
        );
      }
      const ys = pts.map(p => p.y);
      let lo = Math.min.apply(null, ys), hi = Math.max.apply(null, ys);
      if (lo === hi) { lo -= 1; hi += 1; }
      const pad = (hi - lo) * 0.2 || 1; lo -= pad; hi += pad;
      const n = pts.length;
      const sx = (i) => pl + (n === 1 ? iw / 2 : (i / (n - 1)) * iw);
      const sy = (y) => pt + ih - ((y - lo) / (hi - lo)) * ih;
      const xy = pts.map((p, i) => [sx(i), sy(p.y)]);
      const d = smoothPath(xy);
      return (
        <div>
          <div className="text-xs font-medium text-slate-600 mb-1">{titre}</div>
          <svg viewBox={`0 0 ${W} ${H}`} className="w-full" style={{ maxHeight: 170 }}>
            <line x1={pl} y1={pt} x2={pl} y2={pt + ih} stroke="#e2e8f0" />
            <line x1={pl} y1={pt + ih} x2={pl + iw} y2={pt + ih} stroke="#e2e8f0" />
            <text x={pl - 5} y={pt + 4} textAnchor="end" fontSize="9" fill="#94a3b8">{hi.toFixed(0)}{unit}</text>
            <text x={pl - 5} y={pt + ih} textAnchor="end" fontSize="9" fill="#94a3b8">{lo.toFixed(0)}{unit}</text>
            <text x={pl} y={H - 6} textAnchor="start" fontSize="8" fill="#94a3b8">{pts[0].label}</text>
            {n > 1 && <text x={pl + iw} y={H - 6} textAnchor="end" fontSize="8" fill="#94a3b8">{pts[n - 1].label}</text>}
            <path d={d} fill="none" stroke={color} strokeWidth="2" strokeLinejoin="round" strokeLinecap="round" />
            {pts.map((p, i) => <circle key={i} cx={sx(i)} cy={sy(p.y)} r="2" fill={color} />)}
          </svg>
        </div>
      );
    }

    // Durée entre deux dates (en ans / mois), pour calculer un âge.
    function dureeTexte(debutIso, finIso) {
      if (!debutIso) return "—";
      const d0 = new Date(debutIso);
      if (isNaN(d0)) return "—";
      const d1 = finIso ? new Date(finIso) : AUJOURDHUI;
      let mois = (d1.getFullYear() - d0.getFullYear()) * 12 + (d1.getMonth() - d0.getMonth());
      if (d1.getDate() < d0.getDate()) mois -= 1;
      if (mois < 0) return "—";
      const ans = Math.floor(mois / 12), m = mois % 12;
      return ans > 0 ? (ans + " an" + (ans > 1 ? "s" : "") + (m ? " " + m + " mois" : "")) : (mois + " mois");
    }

    // Âge d'un animal : depuis la naissance (sinon l'arrivée), figé à la date de décès.
    function ageAnimal(r) {
      const debut = r.naissance || r.arrivee;
      const finStr = ((r.statut === "décédé") && r.dateFin) ? r.dateFin : null;
      const txt = dureeTexte(debut, finStr);
      if (txt === "—") return "—";
      const base = r.naissance ? "" : "≈ ";          // approximatif si calculé depuis l'arrivée
      return base + txt + (finStr ? " (au décès)" : "");
    }

    // Âge du matériel : depuis la date d'achat, figé à la date de mise hors service si connue.
    function ageMateriel(m) {
      const finStr = ((m.etat === "hors service") && m.dateHorsService) ? m.dateHorsService : null;
      const txt = dureeTexte(m.dateAchat, finStr);
      if (txt === "—") return "—";
      return txt + (finStr ? " (hors service)" : "");
    }

    // Table responsive.
    // - resume(row, i) : si fourni, sur téléphone chaque ligne devient une carte « repliée »
    //   (résumé sur une ligne, détails au clic). L'ordinateur garde le tableau complet.
    // - rowClass(row, i) : classe CSS optionnelle par ligne (ex. mise en évidence criticité).
    function Table({ columns, rows, resume, rowClass }) {
      const rc = (i) => (rowClass ? (" " + (rowClass(rows[i], i) || "")) : "");
      // Détail (paires libellé · valeur) réutilisé par les deux modes mobiles
      const detail = (r) => r.map((cell, j) => {

            <span className="text-right min-w-0">{cell}</span>

      return (
        <div className="bg-white rounded-xl shadow-sm border border-slate-100">

                  : rows.map((r, i) => (
                      <tr key={i} className={"hover:bg-slate-50" + rc(i)}>
                        {r.map((cell, j) => <td key={j} className="px-4 py-3">{cell}</td>)}

              </tbody>
            </table>
          </div>

          <div className="sm:hidden divide-y divide-slate-100">
            {rows.length === 0
              ? <p className="px-4 py-6 text-center text-slate-400 text-sm">Aucune donnée</p>
              : resume
                ? rows.map((r, i) => (
                    /* Mode compact : résumé sur une ligne, détails dépliables au clic */
                    <details key={i} className={"group" + rc(i)}>
                      <summary className="cursor-pointer select-none px-4 py-3 flex items-center justify-between gap-2 list-none">
                        <span className="text-sm text-slate-700 min-w-0">{resume(r, i)}</span>
                        <span className="text-slate-400 text-xs transition-transform group-open:rotate-180 shrink-0">▼</span>
                      </summary>
                      <div className="px-4 pb-3 space-y-1.5">{detail(r)}</div>
                    </details>
                  ))
                : rows.map((r, i) => (
                    /* Une carte par ligne (libellé de colonne · valeur) — pas de défilement horizontal */
                    <div key={i} className={"px-4 py-3 space-y-1.5" + rc(i)}>{detail(r)}</div>
                  ))
            }

        </div>
      );

    // Cellule "Observation" : bouton court → modale. Si onSave fourni, l'observation

    function ObsCell({ texte, titre, onSave }) {

    // Actions de ligne réutilisables : modifier ✏️ / supprimer 🗑 (avec confirmation).
    function RowActions({ onEdit, onDelete, extra }) {

          {onDelete && <button onClick={() => { if (window.confirm("Supprimer cette ligne ?")) onDelete(); }} title="Supprimer" className="px-1.5 py-0.5 rounded hover:bg-red-50 text-red-500">🗑</button>}
