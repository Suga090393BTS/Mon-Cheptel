    // Pesées régulières d'un lot de consommation (poids moyen en g) — courbe de croissance simple
    function PeseesLot({ index, onClose }) {
      const { abattoir, patchLigne } = useData();
      const a = abattoir[index] || {};   // lecture fraîche
      const [date, setDate] = useState(new Date().toISOString().slice(0, 10));
      const [poids, setPoids] = useState("");
      const pesees = (a.pesees || []).slice().sort((x, y) => (x.date || "").localeCompare(y.date || ""));
      const ajouter = (e) => {
        e.preventDefault();
        const p = Number(poids) || 0; if (!p) return;
        patchLigne("abattoir", index, { pesees: (a.pesees || []).concat([{ date, poids: p }]) });
        setPoids("");
      };
      const retirer = (i) => patchLigne("abattoir", index, { pesees: (a.pesees || []).filter((_, k) => k !== i) });
      return (
        <div className="space-y-4">
          <form onSubmit={ajouter} className="flex gap-2 items-end bg-slate-50 border border-slate-200 rounded-xl p-3">
            <Field label="Date"><input type="date" className={inputClass} value={date} onChange={(e) => setDate(e.target.value)} /></Field>
            <Field label="Poids moyen (g)"><input type="number" min="0" className={inputClass} value={poids} onChange={(e) => setPoids(e.target.value)} placeholder="ex. 1850" /></Field>
            <button type="submit" className="px-4 py-2 text-sm rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white font-medium whitespace-nowrap">+ Peser</button>
          </form>
          {pesees.length === 0
            ? <p className="text-sm text-slate-400">Aucune pesée. Pèse régulièrement (ex. 1×/semaine) pour suivre la croissance et choisir le bon moment d'abattage.</p>
            : <table className="w-full text-sm">
                <thead className="text-slate-500 text-left"><tr><th className="px-2 py-1 font-medium">Date</th><th className="px-2 py-1 font-medium">Poids moyen</th><th className="px-2 py-1 font-medium">Évolution</th><th></th></tr></thead>
                <tbody>
                  {pesees.map((p, i) => {
                    const prec = pesees[i - 1];
                    const delta = prec ? p.poids - prec.poids : null;
                    const idxOrig = (a.pesees || []).findIndex((x) => x.date === p.date && x.poids === p.poids);
                    return (
                      <tr key={i} className="border-t border-slate-100">
                        <td className="px-2 py-1">{frDate(p.date)}</td>
                        <td className="px-2 py-1 font-medium">{p.poids} g</td>
                        <td className="px-2 py-1">{delta == null ? "—" : <span className={delta >= 0 ? "text-emerald-600" : "text-red-600"}>{delta >= 0 ? "+" : ""}{delta} g</span>}</td>
                        <td className="px-2 py-1 text-right"><button onClick={() => retirer(idxOrig)} className="text-slate-300 hover:text-red-500">🗑</button></td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>}
          <div className="flex justify-end">
            <button type="button" onClick={onClose} className="px-4 py-2 text-sm rounded-lg border border-slate-300 hover:bg-slate-50">Fermer</button>
          </div>
        </div>
      );
    }

    function Abattoir() {
      const { abattoir, poussins, config, majLigne, supprimerLigne, patchLigne } = useData();
      const [open, setOpen] = useState(false);
      const [edit, setEdit] = useState(null);
      const [pesees, setPesees] = useState(null);   // { index } → modale des pesées
      const today = AUJOURDHUI_ISO;
      // Lots de BÉBÉS encore en croissance (module Poussins) : dans combien de temps seront-ils
      // prêts pour l'abattage ? (naissance + âge d'abattage conseillé des Réglages)
      const bebesAVenir = poussins
        .filter((p) => p.statut === "en croissance" && p.date)
        .map((p) => {
          const espece = p.espece === "caille" ? "caille" : "poule";
          const datePrete = abattageSuggere({ naissance: p.date, espece }, config);
          const restant = datePrete ? Math.ceil((new Date(datePrete) - AUJOURDHUI) / 86400000) : null;
          return { p, espece, datePrete, restant };
        })
        .sort((a, b) => (a.restant || 0) - (b.restant || 0));
      const libRestant = (j) => {
        if (j == null) return "—";
        if (j <= 0) return "✅ âge atteint";
        if (j < 14) return "dans " + j + " j";
        return "dans ~" + Math.round(j / 7) + " semaines";
      };
      // Stock congélateur : lots abattus avec nbCongele > 0 ; alerte si plus vieux que config.dureeCongel (mois)
      const dureeCongel = Number(config.dureeCongel) || 9;
      const auCongel = abattoir.map((a, i) => ({ a, i })).filter(({ a }) => Number(a.nbCongele) > 0);
      const totalCongel = auCongel.reduce((s, { a }) => s + Number(a.nbCongele), 0);
      const moisCongel = (a) => a.abattageReel ? Math.floor((joursDepuis(a.abattageReel) || 0) / 30.44) : null;
      const plusVieux = auCongel.map(({ a }) => moisCongel(a)).filter((m) => m != null).sort((x, y) => y - x)[0];
      const enRetardAbattage = abattoir.filter((a) => a.statut !== "abattu" && a.statut !== "décédé" && abattageSuggere(a, config) && abattageSuggere(a, config) < today).length;
      return (
        <div>
          <PageHeader
            title="Animaux destinés à l'abattoir"
            subtitle="Lots élevés pour la consommation — pesées, rendement carcasse et stock congélateur"
            action={<AddButton onClick={() => setOpen(true)} label="Ajouter un animal ou lot" />}
          />

          {/* Résumé : congélateur + retards d'abattage */}
          <div className="grid grid-cols-2 md:grid-cols-3 gap-4 mb-5">
            <StatCard label="🧊 Au congélateur" value={totalCongel} color="indigo" sub={auCongel.length ? auCongel.length + " lot(s)" : "rien en stock"} />
            <StatCard label="Plus ancien au congél." value={plusVieux != null ? plusVieux + " mois" : "—"} color={plusVieux != null && plusVieux >= dureeCongel ? "red" : "slate"} sub={"consommer avant " + dureeCongel + " mois (Réglages)"} />
            <StatCard label="Abattage dépassé" value={enRetardAbattage} color={enRetardAbattage ? "orange" : "emerald"} sub="lots au-delà de l'âge conseillé" />
          </div>

          {/* Lots de bébés à venir : compte à rebours avant l'âge d'abattage conseillé */}
          {bebesAVenir.length > 0 && <>
            <h2 className="text-lg font-semibold mb-3">🐥 Bébés à venir <span className="text-sm font-normal text-slate-400">— dans combien de temps seront-ils prêts ?</span></h2>
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 mb-3">
              {bebesAVenir.map(({ p, espece, datePrete, restant }, k) => (
                <div key={k} className="bg-white rounded-xl shadow-sm border border-slate-100 p-4">
                  <div className="flex items-start justify-between gap-2 mb-1">
                    <p className="text-sm font-medium text-slate-700">{p.id || labelJeune(p.espece)} <span className="font-normal text-slate-400">· {labelJeune(p.espece)} · {p.nombre} vivant(s)</span></p>
                    <span className={"px-2 py-0.5 rounded-full text-xs font-medium whitespace-nowrap " + (restant != null && restant <= 0 ? "bg-emerald-100 text-emerald-700" : (restant != null && restant < 14 ? "bg-amber-100 text-amber-700" : "bg-slate-100 text-slate-600"))}>{libRestant(restant)}</span>
                  </div>
                  <p className="text-xs text-slate-500">Né le {frDate(p.date)} · {ageJeune(p.date).label}</p>
                  <p className="text-xs text-slate-500">Prêt pour l'abattage vers le <span className="font-medium">{datePrete ? frDate(datePrete) : "—"}</span> <span className="text-slate-400">({(config.agesAbattage || {})[espece] || (espece === "caille" ? 8 : 18)} sem)</span></p>
                </div>
              ))}
            </div>
            <p className="text-xs text-slate-400 mb-6">Ces lots vivent encore dans <span className="font-medium">Gestion poulailler → Bébé</span> : vers 8 semaines, le bouton « →Conso » les transfère ici pour la suite (pesées, abattage, congélateur).</p>
          </>}

          <Table
            resume={(r, k) => { const a = abattoir[k]; return <><span className="font-medium">{a.lot || "—"}</span> — {a.espece}<span className="text-slate-400"> · {a.nombre} · {a.statut}{Number(a.nbCongele) > 0 ? " · 🧊 " + a.nbCongele : ""}</span></>; }}
            columns={["Lot", "Espèce", "Race", "Naissance", "Nombre", "Statut", "Suggéré", "Abattage prévu", "Abattage réel", "⚖️ Poids", "🧊 Congél.", "Obs", ""]}
            rows={abattoir.map((a, i) => {
              const sug = abattageSuggere(a, config);
              const sugDepasse = sug && sug < today && a.statut !== "abattu" && a.statut !== "décédé";
              const dern = (a.pesees || []).slice().sort((x, y) => (x.date || "").localeCompare(y.date || "")).pop();
              const rend = (Number(a.poidsVif) > 0 && Number(a.poidsCarcasse) > 0) ? Math.round((a.poidsCarcasse / a.poidsVif) * 100) : null;
              const mc = moisCongel(a);
              return [
                <span className="font-medium">{a.lot || "—"}</span>,
                a.espece,
                a.race || "—",
                frDate(a.naissance),
                a.nombre,
                <StatutAnimal statut={a.statut} />,
                sug ? <span className={"whitespace-nowrap text-xs " + (sugDepasse ? "text-red-600 font-medium" : "text-slate-500")}>{frDate(sug)}{sugDepasse ? " ⚠️" : ""}</span> : "—",
                frDate(a.abattagePrevu),
                frDate(a.abattageReel),
                <span className="whitespace-nowrap text-xs">
                  {a.statut === "abattu" && Number(a.poidsCarcasse) > 0
                    ? <>carc. <span className="font-medium">{a.poidsCarcasse} g</span>{rend != null ? " · " + rend + " %" : ""}</>
                    : (dern ? <><span className="font-medium">{dern.poids} g</span> <span className="text-slate-400">({frDate(dern.date)})</span></> : <span className="text-slate-300">—</span>)}
                  <button onClick={() => setPesees({ index: i })} title="Pesées du lot" className="ml-1 px-1 py-0.5 rounded hover:bg-slate-100">⚖️</button>
                </span>,
                Number(a.nbCongele) > 0
                  ? <span className={"whitespace-nowrap text-xs " + (mc != null && mc >= dureeCongel ? "text-red-600 font-medium" : "")}>
                      🧊 {a.nbCongele}{mc != null ? " · " + mc + " mois" : ""}{mc != null && mc >= dureeCongel ? " ⚠️" : ""}
                      <button onClick={() => patchLigne("abattoir", i, { nbCongele: Math.max(0, Number(a.nbCongele) - 1) })} title="1 sujet consommé" className="ml-1 px-1.5 py-0.5 rounded border border-slate-300 hover:bg-slate-50">−1</button>
                    </span>
                  : <span className="text-slate-300 text-xs">—</span>,
                <ObsCell texte={a.obs} titre="Observation" onSave={(v) => patchLigne("abattoir", i, { obs: v })} />,
                <RowActions onEdit={() => setEdit({ index: i, rec: a })} onDelete={() => supprimerLigne("abattoir", i)} />,
              ];
            })}
          />
          <p className="text-xs text-slate-400 mt-2">« Suggéré » = naissance + âge d'abattage conseillé (Réglages : {(config.agesAbattage || {}).poule || 18} sem poule · {(config.agesAbattage || {}).caille || 8} sem caille). ⚖️ = pesées régulières du lot (poids moyen). 🧊 « −1 » à chaque sujet sorti du congélateur ; alerte au-delà de {dureeCongel} mois.</p>
          {open && (
            <Modal title="Nouvel animal / lot abattoir" onClose={() => setOpen(false)}>
              <AbattoirForm onClose={() => setOpen(false)} />
            </Modal>
          )}
          {edit && (
            <Modal title="Modifier la ligne abattoir" onClose={() => setEdit(null)}>
              <AbattoirForm initial={edit.rec} onSave={(rec) => majLigne("abattoir", edit.index, rec)} onClose={() => setEdit(null)} />
            </Modal>
          )}
          {pesees && (
            <Modal title={"⚖️ Pesées — " + ((abattoir[pesees.index] || {}).lot || "lot")} onClose={() => setPesees(null)}>
              <PeseesLot index={pesees.index} onClose={() => setPesees(null)} />
            </Modal>
          )}
        </div>
      );
    }

    /* ---------- Inventaire consommables ---------- */
    // Pastille état stock (bas / ok)
    function StockBadge({ bas }) {
      return bas
        ? <span className="px-2 py-0.5 rounded-full text-xs font-medium bg-red-100 text-red-700">⚠️ à racheter</span>
        : <span className="px-2 py-0.5 rounded-full text-xs font-medium bg-emerald-100 text-emerald-700">ok</span>;
    }

    // Fusionne un article mal écrit dans le bon : tous ses mouvements sont renommés (rien n'est supprimé).
    function FusionArticlesForm({ articles, onClose, onFusion }) {
      const [source, setSource] = useState("");
      const [dest, setDest] = useState("");
      const ok = source && dest && normLibelle(source) !== normLibelle(dest);
      const submit = (e) => { e.preventDefault(); if (!ok) return; onFusion(source, dest); onClose(); };
      return (
        <form onSubmit={submit} className="space-y-3">
          <Field label="Article mal écrit (disparaîtra du stock)">
            <select className={inputClass} value={source} onChange={(e) => setSource(e.target.value)} required>
              <option value="">— choisir —</option>
              {articles.map((a) => <option key={a} value={a}>{a}</option>)}
            </select>
          </Field>
          <Field label="Article correct (récupère les mouvements)">
            <select className={inputClass} value={dest} onChange={(e) => setDest(e.target.value)} required>
              <option value="">— choisir —</option>
              {articles.filter((a) => normLibelle(a) !== normLibelle(source)).map((a) => <option key={a} value={a}>{a}</option>)}
            </select>
          </Field>
          <p className="text-xs text-slate-400">Toutes les entrées/sorties de l'article mal écrit sont renommées vers l'article correct : le stock se recalcule tout seul. Rien n'est supprimé.</p>
          <FormButtons onClose={onClose} />
        </form>
      );
    }

    function ConsommableForm({ onClose, mouvementInit, initial, onSave }) {
      const { ajouterConsommable, consommables, config, setConfig } = useData();
      const CONSO_CATS_C = config.catsConso, UNITES_C = config.unites;
      const [date, setDate] = useState(initial ? initial.date : new Date().toISOString().slice(0, 10));
      const [article, setArticle] = useState(initial ? initial.article : "");
      const [categorie, setCategorie] = useState(initial ? initial.categorie : CONSO_CATS_C[0]);
      const [mouvement, setMouvement] = useState(initial ? initial.mouvement : (mouvementInit || "entrée"));
      const [quantite, setQuantite] = useState(initial ? String(initial.quantite) : "");
      // Unité par défaut = « pièce » (on compte souvent 1 sac, peu importe son poids ; le poids va dans « conditionnement »)
      const [unite, setUnite] = useState(initial ? initial.unite : "pièce");
      const [conditionnement, setConditionnement] = useState(initial ? (initial.conditionnement || "") : "");
      const [prixUnitaire, setPrixUnitaire] = useState(initial ? String(initial.prixUnitaire) : "");
      const [remise, setRemise] = useState(initial && initial.remise ? String(initial.remise) : "");
      const [seuil, setSeuil] = useState(initial && initial.seuil !== "" ? String(initial.seuil) : "");
      const [fournisseur, setFournisseur] = useState(initial ? (initial.fournisseur || "") : "");
      const [urgent, setUrgent] = useState(initial ? articleEstUrgent(config, initial.article) : false);
      const [obs, setObs] = useState(initial ? (initial.obs || "") : "");
      const valeurReelle = (Number(quantite) || 0) * (Number(prixUnitaire) || 0);
      const prixPaye = Math.max(0, valeurReelle - (Number(remise) || 0));
      // Listes auto (datalists) — articles & fournisseurs déjà mémorisés
      const articlesConnus = Array.from(new Set(Object.values(config.memoireArticles || {}).map((a) => a.article))).sort((a, b) => a.localeCompare(b));
      const fournisseursConnus = (config.fournisseurs || []).slice().sort((a, b) => a.localeCompare(b));

      // Mémoire inventaire : quand on saisit un article connu/ressemblant, proposer seuil/unité/conditionnement/catégorie/fournisseur.
      // Ne remplit que les champs encore vides → l'utilisateur garde la main. Inactif en édition d'une ligne existante.
      const sug = (!initial && mouvement === "entrée") ? suggererArticle(config, article) : null;
      useEffect(() => {
        if (!sug) return;
        if (sug.categorie && CONSO_CATS_C.includes(sug.categorie)) setCategorie((v) => (v === CONSO_CATS_C[0] ? sug.categorie : v));
        if (sug.unite) setUnite((v) => (v === "pièce" ? sug.unite : v));
        if (sug.conditionnement) setConditionnement((v) => (v === "" ? sug.conditionnement : v));
        if (sug.seuil !== "" && sug.seuil != null) setSeuil((v) => (v === "" ? String(sug.seuil) : v));
        if (sug.fournisseur) setFournisseur((v) => (v === "" ? sug.fournisseur : v));
      }, [sug && sug.article]);
      // Reflète l'état « urgent » déjà connu de l'article saisi (sans écraser un choix après coup)
      useEffect(() => { if (!initial && article.trim()) setUrgent(articleEstUrgent(config, article)); }, [article]);

      function submit(e) {
        e.preventDefault();
        const rec = {
          date, article: article.trim(), categorie, mouvement,
          quantite: Number(quantite) || 0, unite, conditionnement: conditionnement.trim(),
          prixUnitaire: Number(prixUnitaire) || 0,
          remise: Number(remise) || 0,
          seuil: seuil === "" ? "" : (Number(seuil) || 0),
          fournisseur: fournisseur.trim(), obs: obs.trim(),
        };
        // Mémorise l'article + fournisseur, et réconcilie l'état « urgent » (alerte importante)
        if (rec.article) setConfig((c) => {
          let out = memoriserArticle(c, rec);
          if (urgent !== articleEstUrgent(out, rec.article)) out = { ...out, articlesUrgents: toggleArticleUrgent(out, rec.article) };
          return out;
        });
        (onSave || ajouterConsommable)(rec);
        onClose();
      }
      return (
        <form onSubmit={submit} className="space-y-3">
          <div className="grid grid-cols-2 gap-3">
            <Field label="Date">
              <input type="date" className={inputClass} value={date} onChange={(e) => setDate(e.target.value)} required />
            </Field>
            <Field label="Type de mouvement">
              <select className={inputClass} value={mouvement} onChange={(e) => setMouvement(e.target.value)}>
                <option value="entrée">Entrée</option>
                <option value="sortie">Sortie</option>
              </select>
            </Field>
          </div>
          <Field label="Article">
            <input className={inputClass} list="conso-articles-list" value={article} onChange={(e) => setArticle(e.target.value)} placeholder="ex. Granulé poule pondeuse" required />
            <datalist id="conso-articles-list">{articlesConnus.map((a) => <option key={a} value={a} />)}</datalist>
            {(() => { const proche = articleProche(config, consommables, article); return proche ? (
              <div className="mt-1.5 flex flex-wrap items-center gap-2 text-xs bg-orange-50 border border-orange-200 text-orange-700 rounded-lg px-2.5 py-1.5">
                <span>⚠️ Très proche de « <span className="font-medium">{proche}</span> » — faute de frappe ?</span>
                <button type="button" onClick={() => setArticle(proche)}
                  className="px-2 py-0.5 rounded-lg border border-orange-300 bg-white font-medium hover:bg-orange-100 whitespace-nowrap">✓ Utiliser « {proche} »</button>
              </div>
            ) : null; })()}
          </Field>
          <div className="grid grid-cols-2 gap-3">
            <Field label="Catégorie">
              <select className={inputClass} value={categorie} onChange={(e) => setCategorie(e.target.value)}>
                {CONSO_CATS_C.map((c) => <option key={c} value={c}>{c}</option>)}
              </select>
            </Field>
            <Field label="Conditionnement (informatif)">
              <input className={inputClass} value={conditionnement} onChange={(e) => setConditionnement(e.target.value)} placeholder="ex. 20 kg, 4 kg, 900 g, 1 L" />
            </Field>
          </div>
          <div className="grid grid-cols-3 gap-3">
            <Field label="Quantité (pièces)">
              <input type="number" step="0.01" min="0" className={inputClass} value={quantite} onChange={(e) => setQuantite(e.target.value)} />
            </Field>
            <Field label="Unité">
              <select className={inputClass} value={unite} onChange={(e) => setUnite(e.target.value)}>
                {UNITES_C.map((u) => <option key={u} value={u}>{u}</option>)}
              </select>
            </Field>
            <Field label="Prix unitaire (€)">
              <input type="number" step="0.01" min="0" className={inputClass} value={prixUnitaire} onChange={(e) => setPrixUnitaire(e.target.value)} disabled={mouvement === "sortie"} />
            </Field>
          </div>
          {mouvement !== "sortie" && (
            <div className="grid grid-cols-3 gap-3">
              <Field label="Valeur réelle (€)">
                <input className={inputClass + " bg-slate-100"} value={eur(valeurReelle)} readOnly />
              </Field>
              <Field label="Remise / promo (€)">
                <input type="number" step="0.01" min="0" className={inputClass} value={remise} onChange={(e) => setRemise(e.target.value)} placeholder="ex. 55.35" />
              </Field>
              <Field label="Prix payé (€)">
                <input className={inputClass + " bg-slate-100 font-medium"} value={eur(prixPaye)} readOnly />
              </Field>
            </div>
          )}
          <div className="grid grid-cols-2 gap-3">
            <Field label="Seuil d'alerte">
              <input type="number" step="0.01" min="0" className={inputClass} value={seuil} onChange={(e) => setSeuil(e.target.value)} placeholder="ex. 2" />
            </Field>
            <Field label="Fournisseur">
              <input className={inputClass} list="conso-fournisseurs-list" value={fournisseur} onChange={(e) => setFournisseur(e.target.value)} placeholder="ex. Gamm Vert" />
              <datalist id="conso-fournisseurs-list">{fournisseursConnus.map((f) => <option key={f} value={f} />)}</datalist>
            </Field>
          </div>
          <label className="flex items-center gap-2 text-sm text-slate-700 bg-amber-50 border border-amber-200 rounded-lg px-3 py-2">
            <input type="checkbox" checked={urgent} onChange={(e) => setUrgent(e.target.checked)} className="w-4 h-4" />
            <span><span className="font-medium">⭐ Urgent</span> — si coché, l'article remonte en « Alertes importantes » quand il passe sous le seuil (sinon il reste seulement dans l'inventaire).</span>
          </label>
          <Field label="Observations">
            <textarea className={inputClass} rows="2" value={obs} onChange={(e) => setObs(e.target.value)} />
          </Field>
          <FormButtons onClose={onClose} />
        </form>
      );
    }

    // Sortie rapide : article déjà sélectionné, on ne saisit que la quantité (+ date / obs facultatives)
    function SortieRapideForm({ article, onClose }) {
      const { ajouterConsommable } = useData();
      const [quantite, setQuantite] = useState("");
      const [date, setDate] = useState(new Date().toISOString().slice(0, 10));
      const [obs, setObs] = useState("");
      function submit(e) {
        e.preventDefault();
        ajouterConsommable({
          date, article: article.article, categorie: article.categorie,
          mouvement: "sortie", quantite: Number(quantite) || 0, unite: article.unite,
          prixUnitaire: 0, seuil: "", fournisseur: "", obs: obs.trim(),
        });
        onClose();
      }
      return (
        <form onSubmit={submit} className="space-y-3">
          <div className="rounded-lg bg-slate-50 border border-slate-100 p-3 text-sm">
            <span className="text-slate-500">Article :</span> <span className="font-medium">{article.article}</span>
            <span className="text-slate-400"> · stock actuel {article.stock} {article.unite}</span>
          </div>
          <div className="grid grid-cols-2 gap-3">
            <Field label={"Quantité sortie (" + article.unite + ")"}>
              <input type="number" step="0.01" min="0" className={inputClass} value={quantite} onChange={(e) => setQuantite(e.target.value)} autoFocus required />
            </Field>
            <Field label="Date">
              <input type="date" className={inputClass} value={date} onChange={(e) => setDate(e.target.value)} />
            </Field>
          </div>
          <Field label="Observation (facultatif)">
            <textarea className={inputClass} rows="2" value={obs} onChange={(e) => setObs(e.target.value)} />
          </Field>
          <FormButtons onClose={onClose} />
        </form>
      );
    }

    function InventaireConsommables() {
      const { consommables, config, setConfig, majLigne, supprimerLigne, patchLigne } = useData();
      const setUrgent = (article) => setConfig((c) => ({ ...c, articlesUrgents: toggleArticleUrgent(c, article) }));
      const setMasque = (article) => setConfig((c) => ({ ...c, articlesMasques: toggleArticleMasque(c, article) }));
      const [vue, setVue] = useState("stock");   // onglet interne : stock | mouvements | depenses
      const [open, setOpen] = useState(null);   // null | "entrée" | "sortie"
      const [sortie, setSortie] = useState(null); // article sélectionné pour sortie rapide
      const [edit, setEdit] = useState(null);   // { index, rec }
      const st = statsConsommables(consommables);
      // Articles masqués (intitulé mal écrit, doublon…) : cachés du stock, réaffichables plus bas
      const visibles = st.parArticle.filter((a) => !articleEstMasque(config, a.article));
      const masques = st.parArticle.filter((a) => articleEstMasque(config, a.article));
      const aRacheter = visibles.filter((a) => a.bas);
      const valeurStockVisible = visibles.reduce((s, a) => s + Math.max(0, a.stock) * a.prixRef, 0);
      // Fusion d'articles : renomme tous les mouvements de « source » (mal écrit) vers « dest » (correct)
      const [fusion, setFusion] = useState(false);
      function fusionnerArticles(source, dest) {
        const ns = normLibelle(source);
        consommables.forEach((c, i) => { if (normLibelle(c.article) === ns) patchLigne("consommables", i, { article: dest }); });
        setConfig((c) => {
          const mem = { ...(c.memoireArticles || {}) }; delete mem[ns];
          return { ...c, memoireArticles: mem,
            articlesUrgents: (c.articlesUrgents || []).filter((x) => normLibelle(x) !== ns),
            articlesMasques: (c.articlesMasques || []).filter((x) => normLibelle(x) !== ns) };
        });
      }
      const moisTries = Object.keys(st.depMois).sort().reverse();
      const chartData = Object.keys(st.depMois).sort().map((m) => ({ label: moisFr(m), y: st.depMois[m] }));
      const valReelle = (c) => (Number(c.quantite) || 0) * (Number(c.prixUnitaire) || 0);
      const cout = (c) => Math.max(0, valReelle(c) - (Number(c.remise) || 0));   // prix payé (remise déduite)
      const mvts = consommables.map((c, i) => ({ c, i })).sort((a, b) => b.c.date.localeCompare(a.c.date));

      return (
        <div>
          <PageHeader
            title="Inventaire consommables"
            subtitle="Entrées / sorties de stock, coûts et résumé"
            action={
              <div className="flex flex-wrap gap-2">
                <AddButton onClick={() => setOpen("entrée")} label="Entrée de stock" />
                <AddButton onClick={() => setOpen("sortie")} label="Sortie de stock" />
              </div>
            }
          />

          {/* Résumé chiffré */}
          <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
            <StatCard label="Valeur du stock" value={eur(valeurStockVisible)} sub={masques.length ? "hors " + masques.length + " article(s) masqué(s)" : undefined} />
            <StatCard label={"Dépenses " + ANNEE_COURANTE} value={eur(st.depAnnee[String(ANNEE_COURANTE)] || 0)} color="indigo" />
            <StatCard label="Dépenses ce mois" value={eur(st.depMois[MOIS_COURANT] || 0)} color="purple" />
            <StatCard label="À racheter" value={aRacheter.length} color="orange" sub="stock sous le seuil" />
          </div>

          {/* Onglets internes */}
          <div className="flex gap-1.5 mb-6 flex-wrap border-b border-slate-200">
            {[["stock", "📦 Stock"], ["mouvements", "🔁 Mouvements"], ["depenses", "💶 Dépenses"]].map(([id, lbl]) => (
              <button key={id} onClick={() => setVue(id)}
                className={"px-3 py-2 text-sm font-medium -mb-px border-b-2 whitespace-nowrap " + (vue === id ? "border-emerald-600 text-emerald-700" : "border-transparent text-slate-500 hover:text-slate-700")}>{lbl}</button>
            ))}
          </div>

          {vue === "stock" && <>
          {/* Liste des articles à racheter (dans l'inventaire, pas seulement le tableau de bord) */}
          <div className="bg-white rounded-xl shadow-sm border border-slate-100 p-4 mb-6">
            <p className="text-sm font-semibold text-slate-700 mb-2">À racheter <span className="text-slate-400 font-normal">({aRacheter.length})</span></p>
            {aRacheter.length === 0
              ? <p className="text-sm text-slate-400">Aucun article sous le seuil. 👍</p>
              : <div className="flex flex-wrap gap-2">
                  {aRacheter.map((a, i) => {
                    const u = articleEstUrgent(config, a.article);
                    return (
                      <span key={i} className={"inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-medium border " + (u ? "bg-red-50 text-red-700 border-red-200" : "bg-slate-50 text-slate-600 border-slate-200")}>
                        {u ? "⭐" : "⚠️"} {a.article} <span className={u ? "text-red-400" : "text-slate-400"}>· {a.stock} {a.unite} / seuil {a.seuil}</span>
                      </span>
                    );
                  })}
                </div>}
            <p className="text-xs text-slate-400 mt-2">⭐ = urgent (remonte en « Alertes importantes » du tableau de bord). Les autres restent ici sans surcharger le tableau de bord.</p>
          </div>

          {/* Stock par article + action rapide "Sortir" */}
          <div className="flex items-center justify-between gap-2 mb-3 flex-wrap">
            <h2 className="text-lg font-semibold">Stock par article</h2>
            {st.parArticle.length >= 2 && (
              <button onClick={() => setFusion(true)} title="Renommer tous les mouvements d'un article mal écrit vers le bon article"
                className="px-2.5 py-1.5 rounded-lg text-xs font-medium border border-slate-300 text-slate-600 hover:bg-slate-50 whitespace-nowrap">🔀 Fusionner deux articles</button>
            )}
          </div>
          <Table
            resume={(r, i) => { const a = visibles[i]; return <span className={a.bas ? "font-medium text-red-600" : "font-medium"}>{a.article}</span>; }}
            columns={["Article", "Catégorie", "Stock actuel", "Seuil", "Statut", "Urgent", "Action"]}
            rows={visibles.map((a) => {
              const u = articleEstUrgent(config, a.article);
              return [
                <span className="font-medium">{a.article}</span>,
                a.categorie,
                <span className={a.bas ? "text-red-600 font-medium" : "font-medium"}>{a.stock} {a.unite}</span>,
                a.seuil > 0 ? a.seuil + " " + a.unite : "—",
                <StockBadge bas={a.bas} />,
                <button onClick={() => setUrgent(a.article)} title={u ? "Retirer des alertes importantes" : "Mettre en alerte importante"}
                  className={"px-2 py-1 rounded-lg text-xs font-medium border whitespace-nowrap " + (u ? "bg-amber-100 text-amber-700 border-amber-300" : "bg-white text-slate-400 border-slate-300 hover:bg-slate-50")}>
                  {u ? "⭐ urgent" : "☆"}
                </button>,
                <span className="inline-flex gap-1.5 whitespace-nowrap">
                  <button onClick={() => setSortie(a)} className="px-2.5 py-1 rounded-lg text-xs font-medium border border-amber-300 text-amber-700 hover:bg-amber-50 whitespace-nowrap">↘ Sortir</button>
                  <button onClick={() => setMasque(a.article)} title="Masquer cette ligne du stock (réaffichable en bas de page)"
                    className="px-2 py-1 rounded-lg text-xs font-medium border border-slate-300 text-slate-400 hover:bg-slate-50 whitespace-nowrap">🙈</button>
                </span>,
              ];
            })}
          />
          <p className="text-xs text-slate-400 mt-2">🙈 masque une ligne (ex. intitulé mal écrit) sans rien supprimer. Pour corriger vraiment un article mal nommé, modifie ou supprime ses lignes dans l'onglet <span className="font-medium">Mouvements</span>.</p>
